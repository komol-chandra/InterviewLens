[project]
name = "lens-brain"
version = "0.1.0"
description = "Local hybrid RAG over the InterviewLens study notes (FTS5 + sqlite-vec + fastembed), MCP + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
lens = "lens_brain.cli:main"
lens-brain-mcp = "lens_brain.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lens_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
