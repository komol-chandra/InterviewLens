<script id="docs" type="application/json">[{"file": "00-inventory.md", "md": "# 00 · Inventory — Every Messaging Moving Part in Sokrio\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` (PR #5654) · surveyed 2026-10-26.\n> All paths are relative to `sokrio-server/` unless prefixed with another repo.\n> **Master drift (T12, 2026-10-29):** `master` is now `75c787a2c`. No Kafka file changed. Line refs still match the snapshot, but **F13 is fixed** and **F12 is partly mitigated** on master. See §0.14.\n> Tags: `[CODE]` verified in code · `[NOTES]` from my blog/PR notes only · `[GENERAL]` industry knowledge · `[ASSUMPTION]` best guess + how to verify.\n\n---\n\n## 0.1 The one-paragraph answer\n\n`[CODE]` Sokrio uses three messaging mechanisms, and **no RabbitMQ**:\n\n1. **Kafka**, via the pure-PHP client `longlang/phpkafka` v1.2.5. Two topics have live producer → consumer pipelines: `tracking` (GPS breadcrumbs) and `departments` (outlet master-data sync to Mongo). Two more (`order_summaries`, `delivery_summaries`) are registered, but their publish calls are commented out and they have no consumer.\n2. **Laravel queues on Redis.** This is the workhorse: 127 queued Jobs, 19 queued Listeners and 13 queued Mailables, spread over the `summary`, `default`, `feature-tracking`, `order-approved` and `sequential` queues. They are fed largely by the ~40-entry scheduler in `app/Console/Kernel.php`.\n3. **Redis as a primitive.** It serves as the cache (255 `Cache::*` call sites), distributed locks (`Cache::lock`, 8 sites), rate limiters, a hand-rolled list-based event buffer (feature tracking), a broadcast transport option, and the Pusher-backed realtime channel for the app frontend.\n\nDeployment is plain EC2 VMs. GitHub Actions SSHes in and runs a server-side `pipeline.sh`, and processes are managed by Supervisor. No infra-as-code is in the repos.\n\n---\n\n## 0.2 Landscape diagram\n\n```mermaid\nflowchart LR\n    subgraph Clients\n        MOB[Mobile app<br/>field reps]\n        WEB[sokrio-app-frontend<br/>React]\n    end\n\n    subgraph API[\"sokrio-server (php-fpm, EC2 'prod')\"]\n        TC1[\"POST trackings<br/>Tracking/TrackingController\"]\n        TC2[\"POST v2 trackings bulk<br/>V2/Tracking/TrackingController\"]\n        DEP[\"Department model save<br/>DepartmentChangeObserver\"]\n        ORD[\"Order / Delivery save<br/>Order/DeliveryObserver<br/>(publish COMMENTED OUT)\"]\n        DISP[\"dispatch(Job) / event(...)\"]\n        FT[\"FeatureUsedEvent\"]\n    end\n\n    subgraph Kafka[\"Kafka broker(s) — KAFKA_BROKERS\"]\n        T1[(\"tracking.events.v1\")]\n        T2[(\"departments.events.v1\")]\n        T3[(\"order-summaries.events.v1<br/>no producer, no consumer\")]\n        T4[(\"delivery-summaries.events.v1<br/>no producer, no consumer\")]\n    end\n\n    subgraph Redis[\"Redis\"]\n        RQ[[\"queues DB0: summary · default ·<br/>feature-tracking · order-approved · sequential\"]]\n        RC[(\"cache DB1: Cache::remember,<br/>locks, rate limits, unique-job locks\")]\n        RB[[\"feature_tracking:buffer:{tenant} lists\"]]\n    end\n\n    subgraph Workers[\"Long-running processes (Supervisor)\"]\n        KC1[\"kafka:consume tracking\"]\n        KC2[\"kafka:consume departments\"]\n        QW[\"queue:work (feature-tracking, default, summary…)\"]\n        SCH[\"schedule:run (RUN_SCHEDULER=true box only)\"]\n    end\n\n    subgraph Stores\n        MY[(Tenant MySQL)]\n        MG[(MongoDB)]\n        LL[(Landlord MySQL)]\n    end\n\n    MOB --> TC1 & TC2\n    TC1 & TC2 -->|\"publish key=user_id\"| T1\n    TC1 & TC2 -.->|\"fallback if publish fails\"| MY & MG\n    DEP -->|\"publish key=department_id\"| T2\n    ORD -.-x T3 & T4\n    T1 --> KC1 -->|\"bulk insert per tenant\"| MY & MG\n    T2 --> KC2 -->|\"bulkWrite upsert\"| MG\n    KC1 & KC2 -->|\"Org::findById\"| LL\n    DISP --> RQ --> QW --> MY & MG\n    SCH -->|\"dispatch per tenant\"| RQ\n    FT --> RQ\n    QW -->|\"rpush\"| RB -->|\"FlushFeatureEventsJob\"| MG\n    API <--> RC\n    API -->|\"broadcast\"| PUSH[Pusher] --> WEB\n```\n\n---\n\n## 0.3 Packages & runtime (composer.json / composer.lock)\n\n| Package | Constraint | Locked | Role | Ref |\n|---|---|---|---|---|\n| `laravel/framework` | `^9.0` | **v9.52.22** | Queue, cache, broadcast, scheduler | `composer.json:22` |\n| `longlang/phpkafka` | `^1.2.5` | v1.2.5 | **Pure-PHP** Kafka client (no librdkafka) | `composer.json:28` |\n| `predis/predis` | `^1.1` | v1.1.10 | Pure-PHP Redis client | `composer.json:31` |\n| `pusher/pusher-php-server` | `^7.2` | — | Broadcast driver | `composer.json:33` |\n| `aws/aws-sdk-php` | `^3.166` | 3.395.1 | S3 only (via Flysystem); **no SQS/SNS/MSK use** | `composer.json:15` |\n| `laravel/telescope` | `^4.9` | — | Dev-only job/queue inspection | `composer.json:25` |\n| `ext-pcntl` | `*` | — | Required for consumer signal handling | `composer.json:13` |\n| `php` | `^8.0` | CI runs 8.3 | — | `composer.json:11`, `.github/workflows/tests.yml:23` |\n\n`[CODE]` Not present: `laravel/horizon`, `laravel/octane`, `php-amqplib`, `vladimir-yuldashev/laravel-queue-rabbitmq`, `mateusjunges/laravel-kafka`, `ext-rdkafka`.\n\n`[CODE]` Frontend: `sokrio-app-frontend` depends on `laravel-echo ^1.17.1` and `pusher-js ^8.4.0-rc2`, with the client in `sokrio-app-frontend/src/lib/echo.ts`. `sokrio-admin-frontend` has no realtime client.\n\n> ⚠️ **Notes vs code:** the workspace `.claude/CLAUDE.md` says \"Laravel 10\". The lock file says **9.52.22**, and `sokrio-server/CLAUDE.md` correctly says Laravel 9.\n\n---\n\n## 0.4 Kafka — producers\n\n| # | Producer (call site) | Topic key → topic name | Event type | Partition key | Payload | Failure behaviour | Ref |\n|---|---|---|---|---|---|---|---|\n| P1 | `Tracking\\TrackingController::store()` single point | `tracking` → `tracking.events.v1` | `tracking.created` | **`user_id`** | fat: lat, long, address, battery_percent, created_at, user_id, user{…} | `publish()` returns `null` → synchronous `WriteTrackingActions`. If that ot (T12 check, 2026-10-29)\n\n`master` moved from `d14c0ebb2` to `75c787a2c`. Every `file:line` ref in this knowledge base still points at **`d14c0ebb2`**, and T12 checked all 1,038 of them there. 1,037 were in range. One off-by-one was fixed (`SecondaryOrderSummaryJob.php:52-85`, §1). 10 random refs were checked by eye and matched.\n\n- **Kafka files are unchanged**: `app/Services/Kafka`, `app/Console/Commands/Kafka`, `app/Observers` and `config/kafka.php`. F1–F9 and D1–D11 still hold on master.\n- **39 refs into 8 changed files have moved on master.** Read them at the snapshot (`git show d14c0ebb2:<path>`). What changed and how it affects the findings:\n\n| File (master) | Change | Effect on findings | Commit |\n|---|---|---|---|\n| `Guest/StockUpdateController.php` | Per-stock Redis lock removed. Now uses `DB::transaction(…, 3)` + `LockOrCreateStock` (`lockForUpdate` row lock) + `adjust()` | **F13 fixed on master.** This is the fix §4.10 #4 recommended (row lock inside the txn). The challan lock (`:117`, 30 s) is still there | `e39909947`, `428b098ec` |\n| `BatchTransferJob.php`, `PreInventoryTransferJob.php` | `lockForUpdate` on stock rows, deadlock retry, Mongo writes moved after the MySQL statements | R31 / F16 **still live**: the constructor still takes `User $user` | `e39909947`, `428b098ec` |\n| `Middleware/ScopeCacheToTenant.php` | New `tenantPrefix(int $orgId)`. `Module::forgetAllModulesCache` uses it to forget `{domain}.module.all` from landlord code | **F12 partly mitigated** (one key). Workers, the scheduler and consumers still use the bare prefix. R35 still stands | `9d3d42cd6` |\n| `Jobs/PrimaryOrder/ApproveOrder.php` | Wraps `approve()` in `Cache::lock(statusLockKey, 60)->block(30)`, `release(30)` on timeout | **F10 still holds**: no `onQueue`, `$timeout = 0`. The `pending()` guard is now at `:58` | `d3fd1f69e` |\n| `Models/MongoDB/PrimaryOrder/PrimaryOrder.php` | Layered approval + SAP fields. `approveAfter` is now at `:234-238` | None (still no `onQueue`) | — |\n| `Console/Kernel.php` | +2 commands, +1 schedule line (`tenant:prune_day_in_images`) | Lines shift by +2 to +4. No messaging change | — |\n| `Requests/PrimaryOrder/OrderRequest.php` | Indent type, discount rules, `withValidator` | Still dispatches `approveAfter` with no txn (§5 afterCommit table) | — |\n| New: `Jobs/PrimaryOrder/SyncPrimaryOrderToSap.php`, `config/sap.php` | SAP sync job | Not reviewed in this knowledge base. Check its queue and `afterCommit` if it matters | — |\n\nRe-check command: `git -C sokrio-server diff --stat d14c0ebb2 master -- app/Services/Kafka app/Console/Commands/Kafka app/Observers config app/Jobs app/Http/Middleware app/Support/Tenant`.\n\n---\n\n### ✅ Phase 0 quality check\n- [x] Every Sokrio claim has a `file:line` or a tag\n- [x] No secrets: env var names only, IPs/hosts not copied\n- [x] Landscape Mermaid diagram\n- [x] \"Not found\" list with what was searched\n- [x] Notes-vs-code conflicts listed (D1–D8)\n"}, {"file": "01-architecture-overview.md", "md": "# 01 · Architecture Overview — Why Sokrio Needs Messaging\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26.\n> Paths are relative to `sokrio-server/`. Tags: `[CODE]` verified in code · `[NOTES]` from my blog/PR notes · `[GENERAL]` industry knowledge · `[ASSUMPTION]` best guess plus how to verify.\n> Builds on `00-inventory.md`. Facts already proven there are reused, not re-proven.\n\n---\n\n## 1.1 The one-paragraph answer\n\n`[CODE]` Sokrio is a multi-tenant Laravel 9 monolith. Most work happens inside a request or in a scheduled batch. Messaging appears wherever one of three pressures shows up:\n\n1. **Volume.** GPS pings arrive all day from every field rep.\n2. **Latency.** The mobile app or the web UI must not wait for slow work, such as report exports, summaries or PDFs.\n3. **Time.** Some work has to happen later (delayed order approval) or on a schedule (hourly and nightly summaries).\n\nKafka handles the two **event streams** (tracking, departments). Laravel queues on Redis handle **work items** (summaries, exports, mail, approvals). Redis lists are used as a cheap **buffer** for analytics events. Pusher pushes **notifications** back to the browser.\n\n`[GENERAL]` In one line: Kafka is used where we need a durable, replayable, ordered *log of facts*, and Redis queues are used where we need *a job done once*.\n\n---\n\n## 1.2 Business problems solved with messaging\n\n| # | Business problem | Mechanism | Why async at all | Entry point → worker | Tag |\n|---|---|---|---|---|---|\n| B1 | **GPS tracking**: field reps' phones post breadcrumbs all day | Kafka `tracking.events.v1`, key `user_id` | High volume, low value per event. The phone should not wait for MySQL and Mongo writes | `Tracking/TrackingController.php:62-83`, `V2/Tracking/TrackingController.php:52-78` → `kafka:consume tracking` → `TrackingMessageHandler.php:50-116` | `[CODE]` |\n| B2 | **Outlet (department) master data → Mongo**: reports read a denormalised department document | Kafka `departments.events.v1`, key `department_id` | It keeps the 8-relation transform and the Mongo write out of the save path. It replaced a synchronous `syncWithMongoDB` call, which is now commented out | `DepartmentChangeObserver.php:26-46,104-145` → `kafka:consume departments` → `DepartmentMessageHandler.php:66-122` | `[CODE]` |\n| B3 | **Sales summaries / KPI reports**: dashboards read pre-aggregated Mongo collections | Scheduler → one Redis-queue job per tenant on queue `summary` → Mongo `bulkWrite` upserts | Aggregating every tenant's orders is too heavy for a request. It is a periodic batch by nature | `Kernel.php:111-190` → `BaseCommand.php:50-70` → e.g. `SecondaryOrderSummaryJob.php:52-85` | `[CODE]` |\n| B4 | **Feature-usage analytics**: which tenant uses which screen | Queued listener → Redis list buffer → `FlushFeatureEventsJob` → Mongo | Analytics must never slow down or break the user's request | `BufferFeatureUsageListener.php:16-46`, `FlushFeatureEventsJob.php:18-127`, `Kernel.php:180-181` | `[CODE]` |\n| B5 | **Realtime notifications**: export ready, report progress, order and payment approved | Laravel broadcasting → Pusher → `laravel-echo` in `sokrio-app-frontend` | Tells the UI about work finished in the background, without polling | `app/Events/*` (17 `ShouldBroadcast*`), `ReportProgress.php:12`, `NotifyUserOfCompleteExport.php:69`, `sokrio-app-frontend/src/lib/echo.ts` | `[CODE]` |\n| B6 | **Deferred report exports**: big Excel/PDF exports | DB table `sequential_jobs` + a `Cache::lock` → queue `sequential`, one at a time | Exports can take minutes. Running them one at a time protects the report DB | `SequentialJob.php:32-44`, `SequentialJobDispatcher.php:13-68`, `config/deferred-jobs.php:19` | `[CODE]` |\n| B7 | **Delayed order approval**: auto-approve an order N minutes after placement | Redis delayed job on queue `order-approved` | Native \"run later\" support. No cron polling needed | `Order.php:240-243` → `ApproveOrder.php:20-53` | `[CODE]` |\n| B8 | (Planned) **near-real-time order/delivery summaries** | Kafka `order-summaries.events.v1` / `delivery-summaries.events.v1` | Hourly summaries are up to ~1h stale | Publish calls commented out (`OrderObserver.php:21-24`, `DeliveryObserver.php:21-24`); plan in `old-resource/primary-order-delivery-kafka-plan.md` | `[CODE]` + `[NOTES]` |\n\n`[CODE]` For B3 the staleness is real. `primary_order_summary_mongodb` runs `hourlyAt(45)` over the *previous* hour (`Kernel.php:152`, `SecondaryOrderSummaryJob.php:61-62` uses the same pattern). An order placed at 10:46 is therefore summarised at 11:45. That matches the blog's example (`old-resource/03-…md:10`) `[NOTES]`.\n\n---\n\n## 1.3 Why each technology fits its job\n\n### Decision matrix\n\n| Need | Kafka | Laravel queue (Redis) | Redis list buffer | Pusher broadcast |\n|---|---|---|---|---|\n| Survives a consumer outage for days | ✅ retention (broker default) `[GENERAL]` | ⚠️ while Redis has memory and persistence | ❌ TTL 1800s (`BufferFeatureUsageListener.php:21`) | ❌ fire-and-forget |\n| Replay / reprocess history | ✅ reset offsets | ❌ a job is gone once it is done | ❌ | ❌ |\n| Several independent readers | ✅ one group per reader | ❌ one worker takes each job | ❌ | ✅ fan-out to browsers |\n| Per-key ordering | ✅ per partition | ❌ none across workers | ✅ per tenant list (FIFO) | ❌ |\n| Delayed / scheduled execution | ❌ | ✅ `->delay()` | ❌ | ❌ |\n| Per-job retries + `failed_jobs` | ❌ hand-rolled (`TrackingMessageHandler.php:85-116`) | ✅ built in (`config/queue.php:82-86`) | ❌ | ❌ |\n| Ops cost in this stack | High: a separate broker, a pure-PHP client, Supervisor programs | Low: Redis is already there for cache | Near zero | SaaS |\n| Throughput fit | Many tiny events per second | Tens to thousands of heavy jobs | Small events, batched | Low |\n\n### Per-job verdict\n\n- **B1 Tracking → Kafka. Right choice.** `[CODE]` + `[GENERAL]` It is the only true high-volume *stream*. It needs per-rep ordering (key `user_id`, `Tracking/TrackingController.php:67`), batching (200 msgs / 1.0s, `KafkaConsumer.php:251-259`) and a buffer that survives consumer deploys. A Redis queue would put one job per GPS point into Redis, the same Redis that holds the cache and other queues. Commit `37840a3b5` (\"Redis-OOM hardening\") shows Redis memory is already a pressure point `[CODE]`.\n- **B2 Departments → Kafka. Defensible, but heavier than needed today.** `[GENERAL]` Volume is low (master data edits). The real benefits are per-department ordering, key `department_id` (`DepartmentChangeObserver.php:135`), and **replay** for rebuilding the Mongo copy. *Should-have-been note:* with one consumer and no replay tooling, a queued listener with `afterCommit` plus an idempotent upsert would give the same result with less infrastructure. Kafka pays off once a second reader appears (search index, ERP sync, analytics).\n- **B3 Summaries → scheduler + Redis queue. Right choice for a batch.** `[CODE]` Work is per tenant and time-windowed, and it is recomputed from MySQL each time (`SummariesQuery` builds `updateOne … upsert` ops, `app/Models/MongoDB/SummariesQuery.php:229-238`). That makes it idempotent by design, so a queue's at-least-once delivery is fine. *Should-have-been note:* it is batch only because nobody publishes order events yet (B8).\n- **B4 Feature analytics → Redis list. Right choice.** `[CODE]` It is loss-tolerant (`LTRIM 5000`, TTL 1800s), needs batching (100-event threshold or every 15 min), and needs zero new infrastructure. `[GENERAL]` Redis Streams (`XADD`/`XREADGROUP`) would add consumer groups and acks with no new infrastructure. `RENAME`-to-claim (`FlushFeatureEventsJob.php:47-127`) is a hand-built version of that.\n- **B5 Notifications → Pusher. Right choice.** `[CODE]` The browser needs a push channel. Pusher is managed, and Echo is already wired in the app frontend. `[CODE]` `ReportProgressUpdated` is `ShouldBroadcastNow` (`app/Events/ReportProgressUpdated.php:11`). It calls Pusher **synchronously inside the export job**, so a slow Pusher slows the job. `ReportNotification` is `ShouldBroadcast` (`app/Events/ReportNotification.php:11`), so it is queued as its own job. `[CODE]` `BROADCAST_DRIVER` defaults to `null` (`config/broadcasting.php:18`). `[ASSUMPTION]` Production sets `pusher`. Verify the `.env` value name only.\n- **B6 Exports → DB table + lock + queue. Right choice.** `[CODE]` A DB row gives a visible, auditable backlog (`SequentialJob::create`, `SequentialJob.php:35`). The cache lock `custom-jobs:one-at-a-time` (`SequentialJobDispatcher.php:15`) plus `lockForUpdate` (`:31`) ensures only one export runs at a time. Kafka would add nothing here.\n- **B7 Delayed approval → Redis delayed job. Right choice.** `[CODE]` `->onQueue('order-approved')->delay(now()->addMinutes($delay))` (`Order.php:243`). Kafka has no native delay. RabbitMQ would need TTL+DLX or a plugin (see T3).\n- **RabbitMQ → not used.** `[CODE]` Not found. Searched: `amqp`, `php-amqplib`, `rabbitmq`, `x-dead-letter-exchange` (`00-inventory.md` §0.13). Where it *would* fit is covered in T3.\n\n---\n\n## 1.4 Flow A — GPS tracking: publish → consumer → MySQL + Mongo (with fallback)\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant App as Mobile app\n    participant API as TrackingController (v1 / v2 bulk)\n    participant P as KafkaProducer (singleton)\n    participant K as Kafka tracking.events.v1\n    participant W as WriteTracking / WriteBulkTrackingActions\n    participant C as kafka:consume tracking (KafkaConsumer)\n    participant H as TrackingMessageHandler\n    participant LL as Landlord MySQL (Org)\n    participant DB as Tenant MySQL trackings + Mongo TrackingReport\n\n    App->>API: POST trackings (1 point) or v2 bulk (N points)\n    API->>P: publish / publishBatch(topic, tenant_id, payload, key=user_id)\n    P->>K: send envelope {event_id, event_type, tenant_id, occurred_at, payload}\n    alt broker reachable (≤3 attempts, 1s timeouts)\n        K-->>P: ack (library-default acks, see A1)\n        P-->>API: event_id(s)\n    else every attempt failed → null\n        P-->>API: null\n        API->>W: synchronous fallback write\n        W->>DB: MySQL insert in txn, then best-effort Mongo insert\n        alt fallback also throws\n            API-->>App: 503 + Retry-After: 5\n        end\n    end\n    API-->>App: 202 Accepted\n\n    loop poll loop\n        C->>K: fetch\n        C->>C: buffer until 200 msgs or 1.0s (or an empty poll)\n    end\n    C->>C: block SIGTERM/SIGINT\n    C->>H: handleBatch(buffer)\n    H->>H: group payloads by tenant_id\n    loop per tenant in the batch\n        H->>LL: Org::findById (memoised, reconnect landlord on error)\n        H->>DB: TenantManager reconnect + bulk insert (3 attempts, sleep 1s/2s)\n        opt still failing\n            H->>DB: per-point WriteTrackingActions (bad rows dropped + logged)\n        end\n    end\n    H-->>C: returns (never throws)\n    C->>K: commit offsets, once per partition per flush\n    C->>C: unblock signals\n```\n\n**Proof points**\n\n- `[CODE]` The fallback runs only when publish returns `null` (`Tracking/TrackingController.php:62-81`; v2 at `V2/Tracking/TrackingController.php:52-76`). The 503 comes from the `catch` around the fallback.\n- `[CODE]` The v2 fallback runs MySQL in a transaction and then Mongo best-effort: `DB::transaction` (`app/Actions/Tracking/WriteBulkTrackingActions.php:67-69`) and the Mongo `insert` in a swallowing `try` (`:75-82`). A Mongo failure does **not** return 503, so a client retry cannot duplicate committed MySQL rows (comment at `V2/Tracking/TrackingController.php:63-68`).\n- `[CODE]` The handler resolves the tenant itself: a consumer has no request and no subdomain, so it uses `Org::findById` with a landlord self-heal (`TrackingMessageHandler.php:160-186`).\n- `[CODE]` Retry then degrade: `MAX_ATTEMPTS = 3` with `sleep($attempt)` (`:23`, `:85-116`), then per-point (`:125-158`).\n\n**What could go wrong** (detail in T2/T7)\n\n- `[CODE]` A lost ack produces a duplicate: the broker stored the message but the producer timed out, so the API also writes the fallback. Accepted on purpose (`WriteTrackingActions.php:26-28`).\n- `[CODE]` A handler failure is swallowed, so offsets are committed anyway. This path is at-most-once, and there is no DLQ (`TrackingMessageHandler.php:50-71`).\n- `[GENERAL]` `sleep()` inside the handler lengthens poll gaps. Retries of 1s+2s fit inside the 30s session timeout (`config/kafka.php:50`), so this is fine today.\n\n---\n\n## 1.5 Flow B — Department save → Kafka → Mongo upsert\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant UI as Admin / app UI or import\n    participant M as Department model (Eloquent)\n    participant O as DepartmentChangeObserver\n    participant P as KafkaProducer\n    participant K as Kafka departments.events.v1\n    participant C as kafka:consume departments (group KAFKA_GROUP-departments)\n    participant H as DepartmentMessageHandler\n    participant MG as Mongo departments\n\n    UI->>M: save() (created / updated)\n    M->>O: created() / updated()\n    alt only last_order_date / last_checkin_date changed\n        O-->>M: skip (no event)\n    else real change\n        O->>M: load 8 relations, transformDepartmentData()\n        O->>P: publish(key=department_id, payload=full Mongo doc)\n        alt publish fails\n            P-->>O: null / throws\n            O->>O: log warning on the kafka channel (NO fallback)\n        end\n    end\n    Note over M,O: Observer fires inside save(). If the caller wraps it<br/>in DB::transaction, the event can leave before COMMIT (A8)\n\n    C->>K: fetch, buffer 200 / 1.0s\n    C->>H: handleBatch(buffer)\n    H->>H: group by tenant_id, TenantManager reconnect\n    H->>MG: bulkWrite updateOne {department_id} $set payload, upsert, ordered=false\n    opt bulkWrite throws\n        H->>MG: per-record updateOrCreate (bad docs dropped + logged)\n    end\n    C->>K: commit offsets per partition\n```\n\n**Proof points**\n\n- `[CODE]` The ignored-fields guard is `DepartmentChangeObserver.php:35-46,51-71`. Publishing is skipped in `testing` (`:106-108`). The fat payload is built from 8 eager-loaded relations (`:111-126`).\n- `[CODE]` The trait swallows every `Throwable` (`app/Observers/Concerns/PublishesKafkaMessage.php:19-25`), and the observer adds its own catch (`DepartmentChangeObserver.php:139-144`). **A broker outage loses department events silently**, because there is no fallback write.\n- `[CODE]` The consumer is idempotent: it upserts the full document keyed on `department_id` (`DepartmentMessageHandler.php:87-100`), so a replay is harmless.\n\n**What could go wrong: two new findings from T1**\n\n- `[CODE]` 🆕 **There is no automatic safety net.** `DepartmentSync`, the full-resync job the handler comment points to (`DepartmentMessageHandler.php:109`), is dispatched only by the manual command `tenant:department_sync_with_mongodb` (`app/Console/Commands/DepartmentSyncWithMongoDB.php:15,31`). It is **not** in the scheduler (`Kernel.php:111-190`). Lost events stay lost until someone runs it by hand. This corrects MEMORY risk #2, which guessed a nightly sync.\n- `[CODE]` 🆕 **Writes that bypass the observer.** `DepartmentErpCodeSyncJob` updates `erp_code` through `Department::upsert(...)` (`app/Jobs/DepartmentErpCodeSyncJob.php:71`). That is a query-builder bulk write, and `[GENERAL]` Eloquent fires no model events for it. `erp_code` is part of the Mongo document (`app/Models/MongoDB/Department.php:71,213`), so **ERP codes synced at 06:00 daily (`Kernel.php:147`) never reach Mongo through Kafka.** Other `Department::where()->update()` calls (`VanSystemController.php:98,138,152`) also bypass the observer, but they change `van_sales_enabled`, which is not in the Mongo transform, so they are harmless.\n\n---\n\n## 1.6 Flow C — Scheduler → summary job per tenant → Mongo bulkWrite\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant CRON as cron → schedule:run (box with RUN_SCHEDULER=true)\n    participant CMD as tenant:secondary_order_summary (BaseCommand)\n    participant LL as Landlord MySQL (orgs)\n    participant RQ as Redis queue \"summary\" (DB0)\n    participant QW as queue:work (worker box)\n    participant J as SecondaryOrderSummaryJob\n    participant TDB as Tenant MySQL (orders)\n    participant MG as Mongo order_summaries\n\n    CRON->>CMD: hourlyAt(5) --resync=false / dailyAt(06:10) --date=yesterday --resync=true\n    Note over CRON: withoutOverlapping()->runInBackground(), no onOneServer()\n    CMD->>LL: Org where active=1 (all tenants, or --tenant)\n    loop each tenant\n        CMD->>RQ: dispatch(job(org, date, resync)) → queue summary\n    end\n    QW->>RQ: reserve job (retry_after 9000s)\n    QW->>J: handle()\n    J->>J: memory_limit 2048M\n    J->>TDB: TenantManager reconnect, SummariesQuery over [from, to]\n    J->>MG: bulkWrite(updateOne … $set / $setOnInsert, upsert:true)\n    opt resync = true\n        J->>TDB: verifySync: compare MySQL vs Mongo for the day\n    end\n    QW->>RQ: delete job (or release / failed_jobs on throw)\n```\n\n**Proof points**\n\n- `[CODE]` The scheduler is gated by `RUN_SCHEDULER` (`Kernel.php:113-117`). The hourly run is `hourlyAt(5)` (`:149`), and the daily resync is `dailyAt(\"06:10\")` (`:155`).\n- `[CODE]` Fan-out: `BaseCommand` loads `Org` with `active = 1` (`app/Console/Commands/BaseCommand.php:12,50-54`) and calls `dispatchJob` per tenant (`:67-70`). That method is `SecondaryOrderSummaryJob::dispatch($tenant, $date, $resync)` (`app/Console/Commands/SecondaryOrderSummary.php:33-36`).\n- `[CODE]` Job: queue `summary` (`SecondaryOrderSummaryJob.php:37`), `$timeout = 900` (`:25`), tenant reconnect (`:55`), the window is the previous hour or a whole day (`:57-63`), `bulkWrite` (`:68-71`), and the optional `verifySync` (`:73-84`).\n- `[CODE]` The upserts make re-runs safe: `$set` plus `$setOnInsert created_at` with `upsert: true` (`app/Models/MongoDB/SummariesQuery.php:229-238`).\n\n**What could go wrong**\n\n- `[CODE]` 🆕 **`ShouldBeUnique` is defeated.** `uniqueId()` returns `database_date . rand(1000, 9999)` (`SecondaryOrderSummaryJob.php:40-43`), so every dispatch gets a different lock key. Two overlapping runs for the same tenant and hour can both be queued. The upserts keep the data correct, but the work doubles. This is the only job in `app/Jobs` with this pattern (grep: `rand(` inside `uniqueId`).\n- `[CODE]` `bulkWrite` here uses the default `ordered: true`, while the department consumer passes `ordered: false` (`DepartmentMessageHandler.php:111`). `[GENERAL]` With `ordered: true`, the first failing op stops the rest of the batch. The next hourly or daily run repairs the gap.\n- `[CODE]` No `onOneServer()` (`00-inventory.md` §0.7). This is safe only while exactly one box has `RUN_SCHEDULER=true`.\n- `[CODE]` `retry_after` 9000s vs `$timeout = 900`: fine for this job. The `$timeout = 0` jobs are the duplicate-run risk (T4).\n\n---\n\n## 1.7 Notes vs code (the code wins)\n\n| # | Notes say | Code says | Ref | Source of the note |\n|---|---|---|---|---|\n| D1 | `group.instance.id = ''` means dynamic membership | `''` is **static** membership under id `\"\"` | `KafkaConsumer.php:79-95` | study guide §4.4, blog 04 incident 2 |\n| D2 | One shared `KAFKA_GROUP` | One group per topic. `tracking` keeps the bare legacy id | `ConsumeCommand.php:97-107` | study guide §2, §7.3 |\n| D3 | Tracking is the only live pipeline | Departments is live too | `ConsumeCommand.php:27-30` | study guide §1, PR-5094 |\n| D4 | Key is always `tenant_id` | Default only. Live producers use `user_id` / `department_id` | `Tracking/TrackingController.php:67`, `DepartmentChangeObserver.php:135` | study guide §2, §5.4 |\n| D5 | Sync write + publish (shadow) | The sync write is a fallback only. The API returns 202 | `Tracking/TrackingController.php:57-83` | study guide §3, PR-5094 |\n| D6 | Department publish is commented out | Enabled. The `syncWithMongoDB` call is what's commented out | `DepartmentChangeObserver.php:28-29,44-45` | PR-5094 §3 |\n| D7 | Laravel 10 | Laravel 9.52.22 | `composer.lock` | workspace `.claude/CLAUDE.md` |\n| D8 | Consumer `autoCommit = true` | `autoCommit = false`, manual per-flush commit | `KafkaConsumer.php:69` | PR-5094 |\n| 🆕 D9 | Blog snippet: on `null`, call `WriteTrackingActions` and return 202 | It is also wrapped in `try/catch`, returning **503 + `Retry-After: 5`** if the fallback throws | `Tracking/TrackingController.php:70-81` | blog 04 \"The first workload\" |\n| 🆕 D10 | A nightly full resync is the department safety net (MEMORY risk #2, hedged) | `DepartmentSync` is **manual only**, not scheduled | `DepartmentSyncWithMongoDB.php:15,31`, `Kernel.php:111-190` | `_plan/MEMORY.md` §4 |\n| 🆕 D11 | Blog rule 1: \"a Kafka failure never breaks a request … synchronous fallback where the data matters\" | True for tracking. Departments have **no** fallback, and observer-bypassing writes (`Department::upsert`) never publish at all | `DepartmentChangeObserver.php:139-144`, `DepartmentErpCodeSyncJob.php:71` | blog 04 \"The rules we kept\" |\n\nClaims checked and confirmed `[CODE]`:\n\n- Producer timeouts are 1s and consumer timeouts are 3–5s (`config/kafka.php:25-27,42-44`), as the blog says.\n- A 10:46 order shows up after 11:45, as blog 03 says.\n- Kafka logs go to their own channel (`config/logging.php:54-68`).\n\n---\n\n## 1.8 Takeaways for interviews\n\n- `[GENERAL]` \"We chose the tool per job.\" Kafka handles streams of facts that need ordering and replay. Redis queues handle units of work that need retries and delays. Redis lists handle loss-tolerant buffering. Pusher handles fan-out to browsers.\n- `[CODE]` \"We decoupled latency first.\" Tracking returns 202 and the consumer owns persistence. The synchronous path survives as a fallback, so a broker outage is not a user-facing outage.\n- `[CODE]` \"Honest gaps\": the department pipeline has no fallback, no scheduled resync and an observer blind spot (D10, D11). There is no DLQ anywhere, and one job's `ShouldBeUnique` is a no-op. These are good material for \"what would you improve?\"\n\n---\n\n### ✅ Quality check\n- [x] Every Sokrio claim has a `file:line` or a tag\n- [x] No secrets: env var names only, no hosts or IPs\n- [x] 3 Mermaid sequence diagrams (tracking, department, scheduler → summary)\n- [x] Business problems B1–B8 mapped to mechanisms, with a \"should have been\" note where the choice is undocumented\n- [x] Notes-vs-code table: D1–D8 reused, D9–D11 added\n- [x] New findings logged for MEMORY (DepartmentSync manual, ERP `upsert` bypass, `rand()` uniqueId, `ShouldBroadcastNow` in jobs)\n"}, {"file": "02-kafka-in-sokrio.md", "md": "# 02 · Kafka in Sokrio — Deep Dive\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26.\n> Paths are relative to `sokrio-server/`. Library paths are shortened to `phpkafka/…` = `vendor/longlang/phpkafka/src/…` (v1.2.5).\n> Tags: `[CODE]` verified in app code · `[LIB]` verified in the vendored client · `[NOTES]` from my blog/PR notes · `[GENERAL]` industry knowledge · `[INFERENCE]` reasoned from code + Kafka protocol, needs a lab to prove · `[ASSUMPTION]` best guess plus how to verify.\n> Builds on `00-inventory.md` and `01-architecture-overview.md`. Facts proven there are reused, not re-proven.\n\n---\n\n## 2.0 What changed our understanding (read this first)\n\nT2 started by settling A1/A2 in the client library. The answers changed several earlier claims.\n\n| # | Finding | Proof | Impact |\n|---|---|---|---|\n| F5 | **The producer runs with `acks = 0`.** Sokrio never calls `setAcks()`, and the library default is 0. With acks=0 the client writes to the socket and **does not wait for any broker response** | `phpkafka/Producer/ProducerConfig.php:36`; `phpkafka/Producer/Producer.php:159-163`; `grep setAcks app config` → no hits | \"Publish succeeded\" only means \"bytes left our socket\". A broker-side rejection (not leader, topic missing, message too large, disk full) is invisible. The 202 can be returned for an event that never landed. The tracking fallback only covers *transport* failures |\n| F6 | **No `auto.offset.reset` setting exists.** A group with no committed offset starts at offset **0** (effectively *earliest*). An out-of-range offset (data aged out by retention) jumps to **latest − 1** | `phpkafka/Consumer/OffsetManager.php:107` (`max(committed, 0)`), `:140,150` (ListOffsets timestamp −1 → `offset - 1`); `phpkafka/Consumer/Consumer.php:345,364` | A renamed group replays the whole topic (that is why `tracking` is grandfathered, `config/kafka.php:9-16`). A consumer that is down longer than retention silently skips everything it missed |\n| F7 | **The client counts messages instead of reading record offsets.** `RecordBatch::$baseOffset` is never read by the consumer; the cursor is `+1` per delivered message | `phpkafka/Consumer/Consumer.php:321,351-353`; `app/Services/Kafka/KafkaConsumer.php:282` | `[INFERENCE]` A Kafka broker returns *whole* record batches. If the committed offset lands mid-batch (a v2 bulk publish is one batch, see §2.1), a restart re-delivers the head of that batch **and** over-advances the cursor, skipping the same number of later records. Needs a lab (T9) |\n| F8 | **A8 confirmed: Department events fire inside an open transaction.** `DepartmentBulkDataUpdateController` updates each department with `->update()` between `DB::beginTransaction()` and `DB::commit()` | `app/Http/Controllers/DepartmentBulkDataUpdateController.php:41-52` | On rollback, Mongo already received `territory_id`/`supplier_id` changes that never happened. While the broker is down, each row also pays the publish retry budget (§2.2) inside the request |\n| F9 | **Heartbeats are piggy-backed on fetches.** Outside Swoole the timer is a no-op, so a heartbeat is only sent from `fetchMessages()` | `phpkafka/Util/KafkaUtil.php:45-53`, `phpkafka/Timer/NoopTimer.php`, `phpkafka/Consumer/Consumer.php:292-294,421-427` | A flush that takes longer than `session_timeout` (30 s, `config/kafka.php:50`) gets the member evicted. The offset commit then fails (swallowed at `KafkaConsumer.php:329-335`) and the batch is replayed |\n\n> These replace the open items A1, A2 and A8 in MEMORY.md. Partitioner = `crc32(key) % partitions` (`phpkafka/Producer/Partitioner/DefaultPartitioner.php:48-53`). Compression = none (no compression attribute is set anywhere in `Producer.php`).\n\n---\n\n## 2.1 Producer: config, keys, envelope, retry and fallback\n\n### Config actually in force\n\n| Setting | Value | Source | Comment |\n|---|---|---|---|\n| `acks` | **0** (library default) | `ProducerConfig.php:36` | F5. Not configured anywhere in Sokrio |\n| connect / send / recv timeout | 1.0 s each | `config/kafka.php:25-27`, set at `KafkaProducer.php:41-43` | Short on purpose: the publish runs inside the HTTP request |\n| library `produceRetry` | 0 | `config/kafka.php:28` | The library's own retry is off; Sokrio retries itself |\n| library `maxWriteAttempts` | 1 | `config/kafka.php:30` | |\n| Sokrio publish attempts | 3, with 0.25 s sleep and a socket reset between them | `KafkaProducer.php:26,115-142`, `config/kafka.php:36` | Only on `SocketException`/`ConnectionException`/`NoAliveBrokerException` |\n| partitioner | `crc32(key) % N` | `DefaultPartitioner.php:48-53` | Keyless messages would be round-robin; Sokrio always sets a key |\n| compression | none | `Producer.php` (no attributes set) | `[GENERAL]` GPS JSON compresses ~5–10×; worth it at volume |\n| idempotent producer / transactions | none (`producerId = -1`) | `ProducerConfig.php:41-46` | No broker-side dedup |\n| socket | `InterruptResilientStreamSocket` | `KafkaProducer.php:51`, `Socket/InterruptResilientStreamSocket.php:36-83` | Retries `stream_select()` on EINTR from Datadog's profiler signals |\n\n### Key choice\n\n| Stream | Key | Proof | Why it's right | What breaks it |\n|---|---|---|---|---|\n| Tracking v1 | `user_id` | `Tracking/TrackingController.php:62-68` | Breadcrumbs are ordered per rep; one rep never spans partitions | Adding partitions remaps `crc32 % N`, so in-flight keys move (§2.5) |\n| Tracking v2 (bulk) | `user_id`, all points in **one** `sendBatch` | `V2/Tracking/TrackingController.php:52-58`, `KafkaProducer.php:70-91` | One request = one partition = one record batch (`Producer.php` builds one `RecordBatch` per partition) | F7: the one-batch shape is what makes mid-batch commits possible |\n| Departments | `department_id` | `DepartmentChangeObserver.php:131-138` | Last-write-wins per outlet only needs per-outlet order | A hot tenant cannot hot-spot a partition, which is good |\n| Default | `tenant_id` | `KafkaProducer.php:58,76` | Fallback only | `[GENERAL]` Keying by tenant would make one big tenant a hot partition. Sokrio's overrides avoid that (D4) |\n\n### Envelope\n\n`KafkaProducer.php:93-102` → `{event_id (uuid v4), event_type, tenant_id, occurred_at (ISO-8601), payload}`.\n\n- `[CODE]` The consumer only reads `tenant_id`, `event_type` and `payload` (`KafkaConsumer.php:351-364`). **`event_id` and `occurred_at` are dropped on decode**, so nothing downstream can deduplicate or reorder by them.\n- `[GENERAL]` Missing pieces versus a production envelope: `schema_version`, `producer` (service/host), `trace_id`. `event_type` carries the meaning; the `.v1` suffix in the topic name is the only versioning (`TopicRegistry.php:18-24`).\n\n### Retry + fallback, end to end\n\n```php\n// KafkaProducer::sendWithRetry() — KafkaProducer.php:115-121 (trimmed)\nfor ($attempt = 1; $attempt <= self::MAX_PUBLISH_ATTEMPTS; $attempt++) {\n    try {\n        $this->topicProvisioner->ensureTopicExists($this->config, $topic);\n        $this->ensureConnection();\n        $this->producer->sendBatch($messages);   // acks=0 → returns after the socket write\n        return true;\n    } catch (SocketException | ConnectionException | NoAliveBrokerException $e) { /* reset, sleep, retry */ }\n      catch (\\Predis\\PredisException | \\RedisException $e) { return false; }  // Redis OOM ≠ Kafka failure\n      catch (\\Throwable $e) { return false; }   // logged on the kafka channel only\n}\n```\n\n- `[CODE]` Every failure becomes `false` → `null`. Tracking turns `null` into a synchronous write (`Tracking/TrackingController.php:70-81`, v2 `:60-76`); if that also fails the client gets **503 + `Retry-After: 5`**.\n- `[CODE]` Departments have **no** fallback. The trait swallows and logs (`Observers/Concerns/PublishesKafkaMessage.php:19-25`).\n- `[CODE]` Worst-case added latency with the broker down: 3 × (1 s connect + 0.25 s sleep) ≈ **3.75 s per publish**, plus the topic check in `ensureTopicExists` when the Redis \"verified\" flag is missing (`TopicProvisioner.php:23,52-81`).\n\n**What could go wrong**\n- F5 (acks=0): leader moves, the broker is out of disk, or the payload exceeds `message.max.bytes` → silent loss with a 202. The comment about a \"rare lost-ack\" duplicate (`app/Actions/Tracking/WriteTrackingActions.php:26-28`) describes an acks≥1 world. With acks=0 the dominant risk is the opposite: **loss, not duplication**.\n- A v2 batch of N points is one produce request, so it lands entirely or fails entirely, and the client retries the whole batch. That is fine with the fallback; without acks it may \"succeed\" and vanish as a unit.\n- Fix (cheap): `setAcks(1)` costs one broker round-trip (~1–3 ms on a LAN) and turns broker errors into exceptions the existing fallback already handles. `acks=-1` (all) only matters once RF > 1 (§2.5).\n\n---\n\n## 2.2 The dual-write problem\n\n`[GENERAL]` A dual write = one business action writes to **two systems** (MySQL + Kafka) with no shared transaction. Any crash or failure between the two leaves them disagreeing.\n\n| Path | Write 1 | Write 2 | Failure window | Result | Proof |\n|---|---|---|---|---|---|\n| Tracking v1/v2 | Kafka publish | (consumer) MySQL + Mongo | Publish \"succeeds\" but the broker drops it (F5) | Point lost, client saw 202 | `TrackingController.php:62-83` |\n| Tracking fallback | MySQL txn | Mongo `insert` | Mongo fails after the MySQL commit | MySQL has the row, Mongo report does not; `report()` only | `app/Actions/Tracking/WriteBulkTrackingActions.php:67-82` |\n| Department save | MySQL row (maybe inside an open txn) | Kafka publish from the `updated` observer | (a) txn rolls back after publish → **phantom event** (F8); (b) broker down → event lost, no fallback | Mongo ≠ MySQL until the manual `tenant:department_sync_with_mongodb` (F1) | `DepartmentChangeObserver.php:35-46`, `DepartmentBulkDataUpdateController.php:41-52` |\n| Department bulk writes | `Department::upsert()` / query `->update()` | none (observers bypassed) | always | ERP codes never reach Mongo (F2) | `app/Jobs/DepartmentErpCodeSyncJob.php:71` |\n\n```mermaid\nsequenceDiagram\n    autonumber\n    participant C as DepartmentBulkDataUpdateController\n    participant DB as MySQL (tenant)\n    participant O as DepartmentChangeObserver\n    participant K as Kafka\n    participant M as Mongo departments\n    C->>DB: BEGIN\n    loop each department (chunkById 100)\n        C->>DB: UPDATE departments SET territory_id=…\n        DB-->>O: Eloquent \"updated\" (txn still open)\n        O->>K: publish department.updated (acks=0)\n    end\n    K-->>M: consumer $set upsert (already applied)\n    C->>DB: ROLLBACK (some row failed)\n    Note over DB,M: MySQL = old territory · Mongo = new territory · nothing reconciles automatically\n```\n\n### Proposal: transactional outbox (sized for Sokrio)\n\n1. New tenant table `outbox_events(id, topic, key, event_type, payload JSON, created_at, published_at NULL)`, index `(published_at, id)`.\n2. The observer writes an outbox row **in the same DB transaction** as the department save (`DB::afterCommit` is not needed, because the row commits or rolls back with the save). `Department::upsert` callers write outbox rows explicitly, which also closes F2.\n3. A relay (`kafka:relay-outbox`, under Supervisor) per tenant: `SELECT … WHERE published_at IS NULL ORDER BY id LIMIT 500 FOR UPDATE SKIP LOCKED` → `publishBatch` with **acks=1** → `UPDATE published_at`.\n4. Delivery becomes at-least-once from the producer side; the consumer is already idempotent for departments (§2.7).\n\n- Cheaper alternative today: `Department::observe(...)` with `$afterCommit = true` on the observer (`[GENERAL]` Laravel 9 supports `public $afterCommit = true;` on observers). This kills phantom events (F8) but not lost events.\n- `[GENERAL]` A CDC tool (Debezium on the MySQL binlog) is the \"zero app change\" version, but one binlog per tenant DB makes it heavy for Sokrio's DB-per-tenant model.\n\n---\n\n## 2.3 Consumer: process model, groups, commits, batching\n\n### Process model\n\n| Aspect | How | Proof |\n|---|---|---|\n| Entry | `php artisan kafka:consume {tracking|departments}` | `Console/Commands/Kafka/ConsumeCommand.php:18,27-30` |\n| Supervisor | `sokrio-kafka-consumer-tracking`, `-departments`; numprocs=1, stopwaitsecs=35, `DD_PROFILING_ENABLED=false`/`DD_TRACE_CLI_ENABLED=false` | `README.md:178-212` |\n| Group id | tracking → bare `KAFKA_GROUP` (legacy); others → `{KAFKA_GROUP}-{topic}` | `ConsumeCommand.php:97-107`, `config/kafka.php:16` |\n| Membership | **static**, `group.instance.id = \"\"` (D1) | `KafkaConsumer.php:79-95` |\n| Assignment | `RangeAssignor` (library default) | `phpkafka/Consumer/ConsumerConfig.php:115` |\n| Recycle | flush, commit and exit 0 after 6 h | `config/kafka.php:70`, `KafkaConsumer.php:123,229-231,256-258` |\n| No time limit | `set_time_limit(0)` | `ConsumeCommand.php:45-46` |\n\n`[CODE]` With numprocs=1 and 3 partitions, **one PHP process owns all three partitions** of its topic. Scaling out means numprocs=2–3. With static membership, each process then needs a **distinct** `group.instance.id` (for example `%(process_num)s`), which Sokrio can't do today because the id is hard-coded to `\"\"`. Two processes with `\"\"` fence each other (the FENCED_INSTANCE_ID ping-pong in the comment at `KafkaConsumer.php:92-94`).\n\n### The poll loop\n\n```mermaid\nflowchart LR\n    A[consume\\nlibrary pops 1 msg\\nfetches when empty\\n+ heartbeat] -->|null| F{buffer or dirty?}\n    F -->|yes| FL[flush]\n    F -->|no| S[usleep poll_interval]\n    A -->|msg| C[advanceCursor +1\\nmark partition dirty]\n    C --> D[decode envelope\\nmalformed → log, skip]\n    D --> B{buffer ≥ 200\\nor ≥ 1 s?}\n    B -->|yes| FL\n    FL --> H[sigprocmask BLOCK\\nhandler->handleBatch\\nUNBLOCK]\n    H --> O[saveOffsets per dirty partition\\nfailure → debug log]\n```\n\n- `[CODE]` Commits are **manual and per flush**: `autoCommit=false` (`KafkaConsumer.php:69`), the cursor advances as each message is pulled (`:236-241,279-294`), and `saveOffsets` runs only after the handler returns (`:326-336`). That is \"process, then commit\", i.e. at-least-once (§2.6).\n- `[CODE]` Signals are blocked during the persist step so a SIGTERM can't tear a MySQL read in half (\"Packets out of order\") (`KafkaConsumer.php:309-319`). Shutdown between polls flushes first (`:262-266`). `stopwaitsecs=35` must exceed the longest flush, or Supervisor SIGKILLs mid-batch and the batch is replayed.\n- `[CODE]` Reconnect: transport/Kafka errors close the consumer, back off `min(failures, 30)` s and rejoin from the last committed offset; 10 in a row → exit for Supervisor (`KafkaConsumer.php:155-190,371-393`, `config/kafka.php:56-57`). The join handshake is retried 5× (`:404-432`).\n- `[CODE]` Tenant switching happens **inside the handler**, per tenant slice of the batch: group by `tenant_id` → `Org::findById` (in-process cache) → `TenantManager::tenant($org)->reconnect()` (`TrackingMessageHandler.php:50-87`, `DepartmentMessageHandler.php:40-76`). There is no switch back to landlord, but each slice reconnects explicitly, so the next tenant can't inherit the wrong DB.\n- `[CODE]` Memory: the in-process `$orgs` cache never evicts (`TrackingMessageHandler.php:33`), which is bounded by tenant count. The 6 h recycle bounds everything else.\n- `[LIB]` `[INFERENCE]` Per-partition fetch `maxBytes` is left at **0** (`phpkafka/Protocol/Fetch/FetchPartition.php:45`). Brokers still return the first batch so the consumer makes progress (KIP-74), but each fetch likely carries ~one record batch. For v1 tracking (one message per produce) that means roughly one fetch round-trip per GPS point. Batching at 200 still helps the *write* side, not the *read* side. Measure with `kafka-consumer-groups --describe` lag during a backlog.\n\n**What could go wrong**\n- F9: a slow flush (tracking retries sleep 1 s + 2 s, `TrackingMessageHandler.php:114`, then per-point fallback for up to 200 points) can exceed 30 s with no heartbeat → eviction → commit lost → the whole batch is replayed → duplicate tracking rows.\n- A handler exception that escapes `handleBatch` is impossible by design (both handlers catch `\\Throwable` per tenant, `TrackingMessageHandler.php:57-70`, `DepartmentMessageHandler.php:47-60`). But an error from `pcntl_sigprocmask` or the decode step would crash the process, and Supervisor restarts it from the last commit.\n- F6: if the consumer is stopped longer than topic retention (broker default 7 days, `[ASSUMPTION]` not overridden), the restart hits OFFSET_OUT_OF_RANGE and **jumps to the end**. The gap is silently skipped.\n\n---\n\n## 2.4 PR-5094 walkthrough → today\n\n`[NOTES]` PR #5094 (Aug 2026, `59f4f047a` + `fc2d46905`) shipped the generic plumbing plus a **shadow** tracking pilot. Here is each decision and what happened to it.\n\n| PR-5094 decision | Why it was reasonable | What could go wrong | Today | Commit |\n|---|---|---|---|---|\n| Consumer `autoCommit = true` via `Consumer::start()` | Simplest correct-looking loop | Commit per message (slow) **and** the ack happens even when the handler gave up → at-most-once | Own poll loop, manual commit per flush | `a7e63f4bb` (D8) |\n| Handler writes to shadow `TrackingNew`; request still writes MySQL+Mongo synchronously **and** publishes | Compare both paths before trusting Kafka | Double latency; it proves nothing about ordering under load | Shadow removed; the consumer owns persistence; the sync write is a fallback only; 202 | `d32d99105`, `59922533e`, `3af8daa1f` (D5) |\n| Retry 3× with `sleep($attempt)` then drop | Bounded effort, no poison-pill block | Silent drop, no DLQ | Same 3× retry, then **per-point fallback**, then drop + `report()` | `TrackingMessageHandler.php:85-158` |\n| One `KAFKA_GROUP` for all topics | Fewer knobs | Two topics under one static id → FENCED_INSTANCE_ID | One group per topic; tracking grandfathered | `9d902b7e8` (D2) |\n| Join retried 5× on transport errors | The library doesn't retry the handshake | — | Kept, plus `KafkaErrorException` (FENCED, UNKNOWN_MEMBER…) | `de9b53f38`, `d1cbf7c54` |\n| Order/Delivery publish commented out | De-risk the stakes: pilot on tracking first | — | **Still** commented out (`OrderObserver.php:23`, `DeliveryObserver.php:23`) | — |\n| Departments topic had no handler | Not in scope | — | `DepartmentMessageHandler` live; observer publishes (D3, D6) | `94791dabd` |\n| Logs | — | Transport noise in Sentry/Slack | Isolated `kafka` channel, never at error level (test `KafkaLogsNeverAtErrorLevelTest`) | `config/logging.php:54-68` |\n| Not addressed in the PR or since | — | `acks`, outbox, DLQ, `event_id` dedup, RF | **Open**: F5, §2.2, §2.9, §2.7, §2.5 | — |\n\n`[CODE]` What the evolution shows: each fix followed a production symptom. EINTR → `InterruptResilientStreamSocket`; Redis OOM → `37840a3b5`; dead sockets → `ce3a7aaab`; fenced members → `9d902b7e8`. That is good material for an interview story (T8e STAR).\n\n---\n\n## 2.5 Topic design\n\n| Topic (prod name) | Non-prod name | Partitions | RF | Retention | Proof |\n|---|---|---|---|---|---|\n| `tracking.events.v1` | `tracking.events.v1.{APP_ENV}` | 3 | 1 | broker default | `TopicRegistry.php:18-24,51-58`, `config/kafka.php:74-75` |\n| `departments.events.v1` | `…{APP_ENV}` | 3 | 1 | broker default | same |\n| `order-summaries.events.v1`, `delivery-summaries.events.v1` | `…{APP_ENV}` | created on first publish (none today) | 1 | — | same |\n\n- `[CODE]` Topics are created by the app at runtime (`TopicProvisioner.php:52-81`), memoized in cache for a day (`:114`). The library's `autoCreateTopic = true` (`ProducerConfig.php:56`, `ConsumerConfig.php:110`) is a second path to the broker's own defaults.\n- `[CODE]` A creation failure other than TOPIC_ALREADY_EXISTS is only a warning (`TopicProvisioner.php:69-80`). Combined with acks=0, a publish to a non-existent topic can \"succeed\".\n- `[ASSUMPTION]` A3: production topics have RF=1. Verify with `kafka-topics.sh --describe --topic tracking.events.v1` (look at `ReplicationFactor` and `Isr`).\n\n**What could go wrong**\n- RF=1: one broker disk loss = all unconsumed events gone; one broker restart = a produce/consume outage (tracking falls back, departments lose events).\n- Partition count is the **ceiling on consumer parallelism** (3). Raising it later remaps `crc32(key) % N`, so a user's new points can land on a different partition than the old, still-unconsumed ones. Order across that boundary is not guaranteed until the backlog drains.\n- `[GENERAL]` Recommended: create topics with IaC/ops scripts (not from the app), RF=3, `min.insync.replicas=2`, producer acks=all, explicit `retention.ms` (tracking: 3–7 d; departments: consider `cleanup.policy=compact`, since the payload is a full snapshot keyed by `department_id`, so a compacted topic *is* the department table).\n\n---\n\n## 2.6 Delivery guarantee — proved hop by hop\n\n| Hop | Guarantee | Proof |\n|---|---|---|\n| App → broker (tracking) | **At-most-once for broker-side errors** (acks=0), with a sync **fallback for transport errors** | F5; `Producer.php:159-163`; `TrackingController.php:70-81` |\n| App → broker (departments) | **At-most-once**: no acks, no fallback, swallowed | F5; `PublishesKafkaMessage.php:19-25` |\n| Broker storage | Lost on single-broker disk loss (RF=1) | §2.5, A3 |\n| Broker → handler | **At-least-once**: commit happens after `handleBatch` returns; a crash, SIGKILL or eviction before the commit replays the batch | `KafkaConsumer.php:308-336` |\n| Handler → stores | **At-most-once on the give-up path**: after 3 tries + per-point fallback, failures are logged and the offset is still committed | `TrackingMessageHandler.php:96-106,141-157`; `KafkaConsumer.php:326-336` |\n| Library offset arithmetic | Possible duplicate + skip on restart mid-batch | F7 `[INFERENCE]` |\n\n> **One-line answer:** the consumer is at-least-once, but the pipeline as a whole is *best-effort*. acks=0 and swallowed handler failures make the ends at-most-once. \"Exactly-once\" is nowhere. Only the **effect** is exactly-once, and only for departments, through idempotent upserts.\n\n---\n\n## 2.7 Idempotency\n\n| Stream | Write | Idempotent? | Why | Proof |\n|---|---|---|---|---|\n| Tracking | MySQL `Tracking::insert($rows)` + Mongo `TrackingReport::insert` | **No** | Plain inserts; no unique key on `(user_id, created_at)` (only plain indexes) | `WriteBulkTrackingActions.php:67-78`; `database/migrations/2020_08_18_074138_create_trackings_table.php:18,24` |\n| Departments | Mongo `updateOne({department_id}, {$set: payload}, upsert)` | **Yes** | Same snapshot applied twice = same document | `DepartmentMessageHandler.php:87-112`; fallback `updateOrCreate` `:139-142` |\n\n- Replay sources for tracking: eviction (F9), SIGKILL past `stopwaitsecs`, a crash between the handler and `saveOffsets`, a client retrying after a 503 that actually committed MySQL (v2 comment explains why the action rolls back first, `V2/Tracking/TrackingController.php:63-69`), and F7.\n- **Fix options** (cheapest first):\n  1. Unique index on `trackings(user_id, created_at)` + `insertOrIgnore`. A phone never produces two fixes in the same second for the same user. Mongo: unique index on `{user_id, created_at}` + `ordered:false` insert, ignoring E11000.\n  2. Carry `event_id` through decode and store it with a unique index (`KafkaConsumer.php:360-364` currently drops it).\n  3. `[GENERAL]` A processed-ids table with a TTL is the general pattern, but it is overkill for breadcrumbs.\n\n---\n\n## 2.8 Ordering\n\n- `[CODE]` Guarantee: **per key, per partition**. Tracking: per `user_id`; departments: per `department_id`. One process reads partitions sequentially, so messages for one key reach the handler in log order.\n- `[CODE]` Inside a flush, the handler **groups by tenant** (`TrackingMessageHandler.php:52-55`). Relative order between tenants changes, but order within a key is preserved because `array` grouping keeps insertion order.\n\n| Where order breaks | Stream | Matters? | Proof |\n|---|---|---|---|\n| Request-path fallback writes directly while earlier points for the same user are still in Kafka | Tracking | **No**: reports sort by the device's `created_at`, not insert order | `TrackingController.php:70-71` |\n| Per-point degraded path after a failed bulk write | Tracking | No (same reason) | `TrackingMessageHandler.php:142-149` |\n| Replay after eviction/restart re-applies an older batch | Departments | **No**: the replay contains the newer events too, in order, and the final `$set` wins | `KafkaConsumer.php:326-336` |\n| Phantom event from a rolled-back txn (F8) | Departments | **Yes**: Mongo keeps a state that MySQL never committed | §2.2 |\n| Partition count change remaps keys | Both | Yes for departments while a backlog exists | §2.5 |\n| The snapshot is built at **publish** time by `load()`-ing 8 relations | Departments | Two saves of related rows (e.g. territory renamed) don't re-publish the department, so Mongo shows stale nested names | `DepartmentChangeObserver.php:111-125` |\n\n- `[GENERAL]` The retry `sleep()` in the handler doesn't reorder anything (one process, synchronous), but it **does** pause every partition, so all users' tracking lags during a DB blip.\n\n---\n\n## 2.9 Retry and DLQ — none today, here's a proposal\n\n**Today** `[CODE]`: producer retry 3× (transport only) → fallback (tracking) or drop (departments). Consumer: 3× bulk retry with linear sleep → per-record fallback → drop + `report()` + commit. Malformed envelopes: warn, skip, commit (`KafkaConsumer.php:347-358`). **No dead-letter topic, no parking lot, no replay tool.** The only recovery for departments is the manual full resync (F1).\n\n**Proposal**, in order of value:\n\n1. **DLQ topic per stream**: `tracking.events.v1.dlq`, `departments.events.v1.dlq`. In `persistPerPoint`/`persistPerRecord`, publish each failed payload (with `error`, `attempts`, `original_partition/offset` when available, and `failed_at`) with **acks=1**. Commit only after the DLQ publish succeeds; if the DLQ is down too, *don't commit*. Let the consumer crash-loop rather than lose data (departments) or accept the loss (tracking, documented).\n2. **Classify errors before retrying.** Transient (connection, deadlock, Mongo `NotPrimary`) → retry with backoff. Permanent (validation, unknown tenant, `TypeError`) → straight to the DLQ, with no 3 s sleep that starves heartbeats (F9).\n3. **Replay command**: `kafka:replay-dlq {topic} --since=` re-publishes DLQ messages to the main topic after a fix. Idempotency (§2.7) makes this safe.\n4. **Alerting**: DLQ depth > 0 → Slack (via a scheduled check, keeping the `kafka` log channel quiet as designed).\n5. **Schedule `DepartmentSync`** nightly as a safety net until the outbox exists (closes F1), with `->onOneServer()`.\n\n`[GENERAL]` Retry topics with delays (`.retry.5m`, `.retry.1h`) are the \"Uber pattern\". They are overkill at Sokrio's volume; a single DLQ + manual replay covers it.\n\n---\n\n## 2.10 Takeaways for interviews\n\n- \"Our consumer is **at-least-once** because we commit after processing, per flush, with signals blocked during the write. The weak spot was the producer: we were effectively fire-and-forget (`acks=0`), so I'd move to acks=1 now and acks=all with RF=3.\"\n- \"Departments are idempotent (full-snapshot `$set` upserts, keyed by id), so replays are harmless. Tracking is not, and the fix is a natural unique key `(user_id, created_at)` rather than a dedup store.\"\n- \"We have a classic **dual-write** bug: observers publish inside open transactions. The fix is an outbox table written in the same transaction, plus a relay. `afterCommit` observers are the 10-minute stopgap.\"\n- \"Pure-PHP Kafka has sharp edges: no heartbeat thread (heartbeats ride on fetches), message counting instead of offset tracking, no idempotent producer. If the volume grows, `ext-rdkafka` fixes all three.\"\n\n---\n\n### ✅ Quality check\n- [x] A1, A2, A8 resolved with `[LIB]`/`[CODE]` proofs (F5, F6, F8); partitioner + compression recorded\n- [x] All 9 subsections from the T2 card covered, each with a code proof and a \"what could go wrong\" note\n- [x] F2 reused in the dual-write table; F1 reused in the retry/DLQ section\n- [x] 2 Mermaid diagrams (phantom-event sequence, poll-loop flowchart)\n- [x] `[INFERENCE]` items (F7, fetch maxBytes 0) flagged for a T9 lab instead of stated as fact\n- [x] No secrets: env var names only, no hosts or IPs\n"}, {"file": "03-rabbitmq-in-sokrio.md", "md": "# 03 · RabbitMQ in Sokrio — Not Used, and Where It Would Fit\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26.\n> Paths are relative to `sokrio-server/`. Tags: `[CODE]` verified in app code · `[GENERAL]` industry knowledge · `[ASSUMPTION]` best guess plus how to verify.\n> Question bank links: Q29–Q36 (RabbitMQ), Q48 (Kafka vs RabbitMQ), Q80 (blocked producers).\n\n## 3.0 Verdict (read this first)\n\n- `[CODE]` **Sokrio does not use RabbitMQ.** There is no client library, no config, no connection and no AMQP code (§3.1).\n- `[GENERAL]` Four jobs in Sokrio have the *shape* of a RabbitMQ problem: delayed order approval, SMS retries, per-tenant priority, and request/reply with the ERP (§3.3).\n- **My recommendation: don't add it.** In three of the four cases the current stack (Laravel queues on Redis, plus Kafka) can do the same job with a few lines of config. The only case where a broker would add real value is the ERP integration, and that depends on the ERP side, not on us.\n- The useful output of this section is the fixes that fell out of the comparison: **F10** (primary-order delayed approval runs on `default` with `$timeout = 0`) and a Laravel `backoff` design for SMS.\n\n---\n\n## 3.1 Proof: not used\n\nRe-run on HEAD `d14c0ebb2`, extending the T0 search (`00-inventory.md` §0.3 packages and §0.13 \"Not found\").\n\n| Searched for | Where | Result |\n|---|---|---|\n| `amqp`, `rabbitmq`, `basic_publish`, `basic_consume`, `x-dead-letter`, `php-amqplib` | `*.php`, `*.json`, `*.yml`, `*.yaml`, `.env.example`, excluding `vendor/` | **Not found** |\n| `php-amqplib`, `vladimir-yuldashev/laravel-queue-rabbitmq`, `enqueue/amqp-*`, `bunny/bunny` | `composer.json` / `composer.lock` / `vendor/` | **Not found** |\n| A `rabbitmq` connection | `config/queue.php:30-72` | Only `sync`, `database`, `beanstalkd`, `sqs` (stub), `redis` |\n| Amazon MQ | Code, CI workflows, deploy scripts | **Not found** (T0) |\n\n`[CODE]` So every \"queue\" in Sokrio is a **Laravel queue on Redis** (`config/queue.php:65`, `retry_after = 9000`), and every \"stream\" is Kafka (T2).\n\n---\n\n## 3.2 The AMQP model in five minutes `[GENERAL]`\n\nThe key difference from Kafka is that **a producer never writes to a queue directly**. It publishes to an *exchange* with a *routing key*. *Bindings* decide which queues get a copy. The broker tracks each message per queue and **deletes it once a consumer acks it**. There is no log to replay (Q29).\n\n```mermaid\nflowchart LR\n    P[Producer\\nLaravel] -->|publish\\nrouting key sms.send\\n+ publisher confirm| X{{exchange: sokrio.direct}}\n    X -->|binding sms.send| Q1[(queue sms.send\\nquorum)]\n    X -->|binding order.approve| Q2[(queue order.approve)]\n    Q1 -->|push, prefetch=10| C1[worker A]\n    Q1 -->|push, prefetch=10| C2[worker B]\n    C1 -. nack requeue=false .-> DLX{{exchange: sokrio.dlx}}\n    DLX --> R[(queue sms.retry.30s\\nx-message-ttl=30000\\nx-dead-letter-exchange=sokrio.direct)]\n    R -. TTL expires .-> X\n    DLX -->|after N x-death| PL[(queue sms.parking-lot)]\n```\n\n| Concept | What it means | Kafka equivalent (T2) |\n|---|---|---|\n| Exchange (`direct`, `topic`, `fanout`, `headers`) | Routing table: the routing key and bindings choose the target queues | None. The producer picks the topic and the partition (`crc32(key) % N`) |\n| Queue | The unit of storage and delivery. Deleted per message on ack | Topic partition, which keeps messages until retention expires |\n| Ack / nack / requeue | Per-message settlement. Nack with `requeue=false` sends the message to the DLX | Commit an offset per partition. Nothing is per message |\n| Prefetch (`basic.qos`) | Cap on unacked messages per consumer, which is the backpressure (Q5) | `max.poll.records` / fetch size. Sokrio flushes at 200 |\n| Publisher confirms | The broker acks each publish once it is stored (Q33) | `acks`. Sokrio runs **acks=0** (F5) |\n| `mandatory` flag | Returns an unroutable message to the producer instead of dropping it | None. A topic always exists (auto-create) |\n| Quorum queue | Raft-replicated queue over 3+ nodes, the durable default | RF=3 + `min.insync.replicas=2`. Sokrio is likely RF=1 (A3) |\n| DLX + TTL | Dead-letter routing and per-queue or per-message expiry. Together they make delayed retries (Q34) | A DLQ topic plus a retry consumer (T2 §2.9) |\n| Streams | An append-only log with replay, RabbitMQ's answer to Kafka (Q35) | A topic |\n\n**The one-line difference** (Q48): Kafka is a **log you read from**, so consumers own their position and can replay. RabbitMQ is a **broker that hands out work**, so it owns the delivery state and gives you routing, per-message acks, delays and priorities out of the box.\n\n---\n\n## 3.3 Where it would fit — four candidates\n\nEach candidate follows the same pattern: what happens today, where it hurts, the RabbitMQ design, the cheaper option in the current stack, and a verdict.\n\n### 3.3.1 Delayed order approval\n\n**Today** `[CODE]`\n- Secondary orders: `Order::approveAfter` dispatches `ApproveOrder` on queue `order-approved` with `->delay(now()->addMinutes($delay))` (`app/Models/Order/Order.php:240-243`). The delay comes from a tenant setting (`app/Http/Requests/OrderRequest.php:200-205`), and the import path uses it too (`app/Jobs/ImportSecondaryOrderJob.php:260`).\n- The job has `tries = 3` and `timeout = 300`. Its `$retry_after = 600` is ignored by Laravel (`app/Jobs/ApproveOrder.php:24-26`, MEMORY risk 7). It is safe to repeat, because `Order::pending()->find(...)?->approve()` does nothing once the order has left pending (`:53`).\n- **F10, new:** primary orders use a *different* job. `PrimaryOrder::approveAfter` dispatches `App\\Jobs\\PrimaryOrder\\ApproveOrder` **with no `onQueue`**, so it lands on `default` (`app/Models/MongoDB/PrimaryOrder/PrimaryOrder.php:199-203`), and that job has `$timeout = 0` (`app/Jobs/PrimaryOrder/ApproveOrder.php:20`). It joins the `$timeout = 0` vs `retry_after = 9000` double-run family (MEMORY risk 3). The double run is harmless here only because `pending()` guards it (`:47`).\n- `[GENERAL]` Laravel's Redis driver keeps delayed jobs in a sorted set (`queues:order-approved:delayed`). A worker polling that queue moves due jobs onto the ready list. So the delay is only accurate while a worker listens to that queue. `[ASSUMPTION]` One does on the queue-worker box, but the only Supervisor programs in the repo are the three in `README.md:178-212`. Verify on the box with `supervisorctl status`.\n\n**Where it hurts**\n- A worker that dies mid-approval holds the job until `retry_after` (9000 s, **2.5 h**) runs out, so the approval happens 2.5 h late.\n- When `order-approved` has no worker, approvals silently never happen. There is no alert.\n\n**RabbitMQ design** `[GENERAL]`\n- Option A, the `rabbitmq_delayed_message_exchange` plugin: publish with header `x-delay: <ms>`. Caveats: it is a community plugin, delayed messages sit in a **single node's Mnesia table (not replicated)**, and it is not built for millions of pending delays.\n- Option B, a TTL queue + DLX per delay value (`order.approve.wait.15m` → DLX → `order.approve`). Caveat: per-message TTL only expires **at the head of the queue**, so mixing delays in one queue blocks the short ones behind the long ones. Since each tenant chooses its own delay, you need one queue per distinct delay.\n- Either way, the redelivery-after-crash problem goes away: an unacked message comes back as soon as the consumer's channel closes, not 2.5 h later.\n\n**The cheaper option** `[CODE]`-anchored\n1. Put primary orders on `order-approved` and give the job a real `$timeout`, which fixes F10.\n2. Set `retry_after` per connection: add a second Redis connection, `redis-short`, with `retry_after = 360`, and route `order-approved` to it. That turns 2.5 h into 6 min.\n3. Add a scheduled check that alerts when `queues:order-approved:delayed` holds jobs more than 10 min past due.\n\n**Verdict:** Redis delayed jobs are the right tool. Fix F10 and `retry_after`. RabbitMQ would add a broker to solve a configuration bug.\n\n### 3.3.2 SMS retries with DLX + TTL\n\n**Today** `[CODE]`\n- A failed SMS becomes a `messages` row with status `failed`. **Nothing retries it automatically.** A user picks failed rows in the UI, and `MessageResendService::startResend` claims them (failed → pending under `Cache::lock` + `lockForUpdate`, `app/Services/SMS/MessageResendService.php:111-198`). It then dispatches `ResendFailedSmsBatch` in chunks of `batch_size = 100` to the **`default` queue** (`:233-257`, `config/sms.php:14`).\n- The batch job has `tries = 1` on purpose (\"the retry limit is ours\", `app/Jobs/SMS/ResendFailedSmsBatch.php:37-41`). `messages.retry_count` caps resends at `max_retry = 5` (`config/sms.php:15`).\n- The design separates two errors carefully. `ProviderUnavailableException` means nothing was sent. `SmsDeliveryUnknownException` means the provider got the request but never answered, so the SMS *may* have gone out (`app/Services/SMSSender.php:12-19`). After the first failure, the rest of the batch is skipped (`ResendFailedSmsBatch.php:66-68,87-92`).\n\n**RabbitMQ design** `[GENERAL]`. This is the textbook case (Q34):\n- `sms.send` (quorum) → on failure `nack(requeue=false)` → DLX → `sms.retry.30s` / `.5m` / `.30m` (TTL queues that dead-letter back to `sms.send`) → after 3 attempts, counted from the `x-death` header → `sms.parking-lot`, which a human reviews (today's resend screen).\n- Publisher confirms on enqueue, and `prefetch` sized to the provider's rate limit.\n\n**Where the textbook breaks for Sokrio**\n- Retrying `SmsDeliveryUnknownException` automatically can **send the SMS twice and charge the tenant twice**. Only `ProviderUnavailableException` is safe to retry automatically. Today's code already makes that distinction, and any broker design must keep it.\n- The balance reservation (`reservedSms`, `MessageResendService.php:215-219`) lives in MySQL. Messages waiting in a broker's TTL queue are invisible to it unless the row stays `pending`.\n\n**The cheaper option:** a dedicated `SendSmsJob` on its own `sms` queue with `$tries = 4` and `public function backoff() { return [30, 300, 1800]; }`. It calls `$this->release()` only for `ProviderUnavailableException`, and `failed()` marks the row `failed` so the existing resend screen becomes the parking lot. Laravel's `backoff` uses the same delayed set as §3.3.1.\n\n**Verdict:** this is the most natural RabbitMQ fit, but Laravel `backoff` covers it at Sokrio's volume. Build the retry ladder in Laravel, and keep \"delivery unknown\" out of automatic retries.\n\n### 3.3.3 Per-tenant priority and fairness\n\n**Today** `[CODE]`\n- `BaseCommand` loops over all active tenants and dispatches one job per tenant (`app/Console/Commands/BaseCommand.php:50-70`). The 20 summary jobs share one FIFO `summary` queue, and the hourly runs are scheduled at `app/Console/Kernel.php:149,152`.\n- A large tenant's 900 s job (`SecondaryOrderSummaryJob` timeout 900) holds a worker while small tenants queue up behind it. There is no notion of tier or priority.\n\n**RabbitMQ design** `[GENERAL]`\n- Priority queues: `x-max-priority` on classic queues, where 1–5 levels is practical. Quorum queues support only two levels (normal and high, RabbitMQ 4.0+). Caveat: priority only matters when messages are **waiting**. With `prefetch` > 1, a consumer has already taken low-priority work.\n- Fairness: `prefetch = 1` per consumer gives fair dispatch. Per-tier queues (`summary.enterprise`, `summary.standard`) with dedicated consumers isolate the tiers.\n\n**The cheaper option:** Laravel already does strict priority across queues. `queue:work --queue=summary-high,summary` drains `summary-high` first. Add a tier flag on `Org` and choose the queue in `dispatchJob`. A second worker on `summary` alone keeps the low tier from starving.\n\n**Verdict:** Laravel's multi-queue priority is enough. RabbitMQ adds nothing here that Sokrio needs.\n\n### 3.3.4 Request/reply with the ERP (IFS)\n\n**Today** `[CODE]`: a **shared-database** integration.\n- Sokrio reads `{org.ifs_database}.customer_responses WHERE fetch = 0`, writes `erp_code` with `Department::upsert` (which bypasses the observer, so Mongo never hears about it, F2), then sets `fetch = 1` (`app/Jobs/DepartmentErpCodeSyncJob.php:44-73`). This runs **once a day at 06:00** (`app/Console/Kernel.php:147`).\n- The product-price sync works the same way on `{ifs_database}.sales_part` with a `FetchCount` flag, daily at 05:40 (`app/Jobs/IFS/SalePartProductPriceSyncJob.php:51-55,133`; `Kernel.php:143`). Guest SellScope controllers read `ifs_database` tables directly as well (`app/Http/Controllers/Guest/SellScope/InvoiceDeliveryController.php:47`).\n- The `fetch` flag is a home-made **inbox table**. The upsert and the flag update are not in one transaction, but a crash between them only re-reads rows, and the upsert is idempotent. That part is safe.\n\n**Where it hurts**\n- An outlet created in Sokrio waits **up to 24 h** for its ERP code.\n- Sokrio is coupled to the ERP's table layout and needs cross-database credentials.\n- Mongo never gets `erp_code` (F2).\n\n**RabbitMQ design** `[GENERAL]`: async request/reply (RPC).\n- Sokrio publishes `erp.customer.create` with `reply_to = erp.replies.sokrio` and `correlation_id = department_id`.\n- An IFS-side adapter creates the customer and replies with `{correlation_id, DealerNo}`.\n- A Sokrio consumer updates the department **through Eloquent `save()`**, so the observer fires and Mongo gets the code. That closes F2 for this path.\n- Fallback: keep the 06:00 poll as a nightly reconciliation.\n\n**Caveats** `[ASSUMPTION]`: this needs an adapter on the ERP side, which Sokrio does not own. The same pattern also works on Kafka (a request topic plus a reply topic keyed by `department_id`), and Sokrio already runs Kafka.\n\n**Verdict:** this has the highest business value (24 h → seconds), but it is a cross-team decision. If the ERP team can only speak a message broker, RabbitMQ's built-in `reply_to` / `correlation_id` makes it the easier choice. If they can call HTTP, a webhook is simpler than either broker.\n\n---\n\n## 3.4 The T2 DLQ proposal, translated to RabbitMQ\n\n| Concern | Kafka (T2 §2.9 proposal) | RabbitMQ equivalent | Note |\n|---|---|---|---|\n| Dead-letter target | `<topic>.dlq` topic, published by the consumer | DLX bound to a `.dlq` queue. The broker routes it on `nack(requeue=false)`, TTL expiry or length overflow | RabbitMQ does it **without consumer code** |\n| Metadata | `error`, `attempts`, `original_partition/offset` added by hand | `x-death` header (queue, reason, count, time) added by the broker | |\n| Delayed retry | Separate retry topics + a sleeping consumer (\"Uber pattern\"), overkill here | TTL queue + DLX (§3.3.2) | The thing RabbitMQ does best |\n| Replay after a fix | Re-publish from the DLQ topic. The main topic still holds history until retention | Shovel or move messages from `.dlq` back to the work queue. **There is no history**: acked messages are gone | Kafka wins for \"replay last Tuesday\" |\n| Poison message | Commit past it and log it (today: swallowed) | `x-delivery-limit` on quorum queues dead-letters it after N redeliveries | |\n\n---\n\n## 3.5 If Sokrio ever did add RabbitMQ\n\n- `[GENERAL]` **Laravel driver:** `vladimir-yuldashev/laravel-queue-rabbitmq` makes it one more `config/queue.php` connection, so jobs keep `dispatch()->onConnection('rabbitmq')`. Retry, `backoff` and `failed_jobs` keep working, but Laravel re-implements delays its own way, so check that the driver maps them to the delayed-exchange plugin and not to ad-hoc TTL queues.\n- `[GENERAL]` **Ops cost on EC2** (no IaC, Supervisor, T6): quorum queues need **3 nodes**. You also need to plan for memory and disk alarms that block publishers (Q80), partition handling (Q36, `pause_minority`), and upgrades. That is a third stateful cluster next to Kafka and Redis, for a small team.\n- `[ASSUMPTION]` **Amazon MQ for RabbitMQ** removes most of that (a managed 3-node cluster) at a fixed hourly cost. Compare it in T6 with SQS, which covers the delay, DLQ and visibility-timeout needs of §3.3.1–3.3.2 natively and with no cluster to run.\n- **Decision rule:** add a broker only when you need **routing** (one event, many differently-filtered consumers), **per-message priority/TTL at scale**, or **RPC with a partner that speaks AMQP**. None of these is true in Sokrio today.\n\n---\n\n## 3.6 Takeaways for interviews\n\n- \"We don't run RabbitMQ, and I can show why. Our work-queue needs (delays, retries, priority) are covered by Laravel queues on Redis, and our stream needs by Kafka. Adding a third stateful system for a small team needs a use case neither covers.\"\n- \"Where I *would* reach for it is partner integration with request/reply. Our ERP sync is a once-a-day shared-database poll with a `fetch` flag, basically a home-made inbox. `reply_to` plus `correlation_id` makes that seconds instead of a day.\"\n- \"DLX + TTL is the cleanest delayed-retry design I know, but retries need to know about side effects. For SMS, 'provider down' is safe to retry and 'delivery unknown' is not, because it can double-send and double-charge.\"\n- \"Kafka vs RabbitMQ in one line: a log you read from vs a broker that hands out work. Pick Kafka when you need replay and many independent readers, and RabbitMQ when you need routing and per-message settlement.\"\n\n---\n\n### ✅ Quality check\n- [x] \"Not used\" proved with an explicit search table, re-run on HEAD `d14c0ebb2` (§3.1)\n- [x] All four task-card candidates covered (delayed approval, SMS DLX+TTL, per-tenant priority, ERP request/reply), each with today's code (`file:line`), a RabbitMQ design, a cheaper option and a verdict\n- [x] AMQP model diagram (Mermaid) including DLX + TTL retry and the parking lot\n- [x] T2 hooks reused: F2 (ERP upsert bypass), F5 (acks=0 vs confirms), §2.9 DLQ translated (§3.4)\n- [x] New finding F10 recorded (primary-order delayed approval on `default`, `$timeout = 0`)\n- [x] Every statement tagged; `[GENERAL]` used for anything not in Sokrio's code\n- [x] No secrets: env var names only, no hosts or IPs\n"}, {"file": "04-redis-in-sokrio.md", "md": "# 04 · Redis in Sokrio — Queues, Cache, Locks, Limiters, Buffer\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26.\n> Paths are relative to `sokrio-server/`. Tags: `[CODE]` verified in app code · `[LIB]` verified in `vendor/` · `[LAB]` reproduced on a throwaway local Redis · `[GENERAL]` industry knowledge · `[INFERENCE]` follows from code but not observed in prod · `[ASSUMPTION]` best guess plus how to verify.\n> Question bank links: Q38–Q47 (Redis), Q49 (Redis vs Kafka), Q60 (distributed locks), Q64 (cache stampede), Q71 (Laravel queues).\n\n## 4.0 What changed our understanding (read this first)\n\nRedis does seven jobs in Sokrio: the Laravel queue, the cache, distributed locks, unique-job locks, rate limiters, the feature-usage buffer, and the session store. All seven share **one Redis server** (two logical DBs). Five new findings came out of this pass:\n\n| # | Finding | Severity | Proof |\n|---|---|---|---|\n| **F11** | Bulk stock import chunks are **silently dropped**. `Stock\\BulkStockImportJob` is `ShouldBeUnique` with no `uniqueId` and no `uniqueFor`, so every chunk of every tenant shares one lock that never expires | 🔴 | §4.3, `[LAB]` |\n| **F12** | **Prefix-split family.** Web requests write cache keys under `…:tenant_{id}:`, but workers use the base prefix. Anything written in one context and cleared in the other leaks: report
