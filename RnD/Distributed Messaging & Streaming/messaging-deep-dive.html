Sokrio's vendor, with lab job classes in `jobs.php` |\n| `redis/*.sh`, `mysql/dup.sql` | The eviction and idempotency labs |\n\nThe compose file, trimmed (`x-env` holds the five shared KRaft settings):\n```yaml\nservices:\n  k1: { image: apache/kafka:3.7.0, environment: { <<: *env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://k1:9092 } }\n  k2: { image: apache/kafka:3.7.0, environment: { <<: *env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://k2:9092 } }\n  k3: { image: apache/kafka:3.7.0, environment: { <<: *env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://k3:9092 } }\n  redis: { image: redis:7-alpine }\n```\n\n**Start / stop** (from `labs/`):\n```bash\ndocker compose -p t9lab up -d && sleep 20          # brokers need ~15 s to form the KRaft quorum\ndocker compose -p t9lab down -v                      # cleanup for every lab\n```\n\n**The Laravel console** (`labs/laravel/artisan`, the core of it):\n```php\nrequire '/srv/vendor/autoload.php';                  // Sokrio's Laravel 9.52.22, read-only\nrequire __DIR__ . '/jobs.php';\n$app = new Illuminate\\Foundation\\Application(__DIR__);\n$app->singleton(Illuminate\\Contracts\\Console\\Kernel::class, Illuminate\\Foundation\\Console\\Kernel::class);\n$app->singleton(Illuminate\\Contracts\\Debug\\ExceptionHandler::class, Illuminate\\Foundation\\Exceptions\\Handler::class);\n$kernel = $app->make(Illuminate\\Contracts\\Console\\Kernel::class);\nif (($argv[1] ?? '') === 'run') { $kernel->bootstrap(); require $argv[2]; exit(0); }   // run a lab script\nexit($kernel->handle(new Symfony\\Component\\Console\\Input\\ArgvInput, new Symfony\\Component\\Console\\Output\\ConsoleOutput));\n```\n- `config/` holds only what the labs need: `queue.php` (`retry_after` from the `RETRY_AFTER` env, default 9000 like prod), `database.php` (`REDIS_CLIENT` env picks phpredis/predis; DB0 queues, DB1 cache, like Sokrio), `cache.php` (redis store).\n\n**Gotchas we hit** (so you don't):\n- zsh does not word-split `$VAR`, so `K=\"docker compose exec …\"; $K` fails. Use the `bin/*.sh` scripts, or run bash.\n- A fresh `composer create-project laravel/laravel:^9.0` is blocked by security advisories (§9.0). That's why the harness reuses Sokrio's installed vendor instead.\n- The Laravel console needs `bootstrap/cache/` and `storage/` to exist (already in `labs/laravel/`).\n\n---\n\n## 9.3 Labs\n\nEvery lab uses the same fields: **Goal · Setup · Steps · What we observed · Sokrio link · Cleanup**. \"What we observed\" is real output from 2026-10-26.\n\n### L0 — Smoke test\n- **Steps:** `docker compose -p t9lab up -d && sleep 20`, then `bin/k.sh k1 kafka-topics --bootstrap-server k1:9092 --create --topic demo --partitions 3 --replication-factor 3 --config min.insync.replicas=2` and `--describe --topic demo`.\n- **Observed:** 3 partitions, leaders spread over brokers 1/2/3, `Isr` lists all three replicas.\n\n### L1 — Kill a broker: RF=1 (Sokrio today) vs RF=3\n- **Goal:** see why auto-created RF=1 topics (`config/kafka.php:74-75`) mean \"one broker down = some partitions offline\".\n- **Setup:** L0, plus `--create --topic rf1 --partitions 3 --replication-factor 1`.\n- **Steps:**\n  ```bash\n  docker compose -p t9lab stop k2 && sleep 8\n  bin/k.sh k1 kafka-topics --bootstrap-server k1:9092 --describe --unavailable-partitions\n  bin/k.sh k1 kafka-topics --bootstrap-server k1:9092 --describe --under-replicated-partitions\n  docker compose -p t9lab start k2     # describe again: ISR heals; preferred leaders return after the auto leader rebalance (~5 min default)\n  ```\n- **Observed** `[LAB]`:\n  ```\n  unavailable:  Topic: rf1   Partition: 0  Leader: none  Replicas: 2      Isr: 2\n  URP:          Topic: demo  Partition: 0  Leader: 3     Replicas: 2,3,1  Isr: 3,1\n  ```\n  - The RF=1 partition owned by `k2` had **no leader**, so every write keyed to it fails or waits.\n  - The RF=3 topic only became under-replicated. With `min.insync.replicas=2` and acks=all it keeps accepting writes.\n- **Sokrio link:** A3 (prod RF unknown), R1/R21, Top-5 #2, Q14/Q81. With a single prod broker `[ASSUMPTION]` (A4), \"one broker down\" means *every* partition is down, and the producer's fallback (tracking only) or nothing (departments, F1/D11) takes over.\n- **Cleanup:** `docker compose -p t9lab down -v`.\n\n### L2 — acks=0 swallows a broker rejection (F5)\n- **Goal:** prove that \"publish succeeded\" means \"bytes were written to a socket\", not \"the broker stored it\".\n- **Setup:** L0, plus a topic that rejects big messages: `--create --topic small --partitions 1 --replication-factor 3 --config max.message.bytes=1000`.\n- **Steps:** `bin/php.sh -- kafka/f5_acks.php`. It sends 5 000 bytes with the library default (= Sokrio, which never calls `setAcks()`), then with `setAcks(1)`. Then run `bin/k.sh k1 kafka-get-offsets --bootstrap-server k1:9092 --topic small`.\n- **Observed** `[LAB]`:\n  ```\n  acks=0 (library default, = Sokrio): send() returned normally\n  acks=1: longlang\\phpkafka\\Exception\\KafkaErrorException — [10] The request included a message larger than the max message size the server will accept.\n  small:0:0                                    ← nothing stored\n  ```\n- **Sokrio link:** F5 (`phpkafka/Producer/ProducerConfig.php:36`, `Producer.php:159-163`). The tracking fallback (`Tracking/TrackingController.php:62-83`) only runs on a *transport* exception, so with acks=0 a rejected batch is a silent loss behind a 202. Fix: `setAcks(1)` in `KafkaProducer` (Top-5 #2). Q82, Q14.\n- **Try next:** stop the partition leader's broker and repeat with acks=0 vs acks=1.\n\n### L3 — Slow consumer → eviction → replay (F9, forced rebalance)\n- **Goal:** see that a phpkafka consumer outside Swoole heartbeats **only when it fetches** (`phpkafka/Consumer/Consumer.php:292-294,421-427`), so a long flush is the same as a dead consumer.\n- **Setup:** L0, plus `--create --topic f9 --partitions 1 --replication-factor 3`.\n- **Steps:** `bin/php.sh -- kafka/f9_heartbeat.php 40`, then the control `… 20`. The script reads 3 records, sleeps N seconds as if `flush()` were running the DB write, then commits, and finally a new process reads.\n- **Observed** `[LAB]`:\n  ```\n  40 s: commit FAILED: KafkaErrorException — [25] The coordinator is not aware of this member.\n        next process reads: a,b,c                       ← replayed\n  20 s: commit OK / next process reads: (nothing)\n  ```\n- **Sokrio link:** `session_timeout` 30 s (`config/kafka.php:50`). Sokrio catches the failed commit and logs it at **debug** (`KafkaConsumer.php:328-335`), so the replay is invisible. Tracking inserts are not idempotent (no unique key), so a replay means duplicate rows (see L5). R23, Q25, Q85.\n- **Watch the group** (not captured in T9): while the sleep runs, `bin/k.sh k1 kafka-consumer-groups --bootstrap-server k1:9092 --describe --group f9-group --members --state` should show the member dropped after ~30 s.\n- **Fix ideas:** keep flushes far below 30 s (smaller `batch_size`, bulk writes), or heartbeat from inside long handlers; raise `session_timeout` only together with a lag alert.\n\n### L4 — Counted offsets after a mid-batch restart (F7) → the replay loop (F25)\n- **Goal:** test T2's `[INFERENCE]` that phpkafka advances a counter instead of reading record offsets.\n- **Setup:** L0, plus `--create --topic f7 --partitions 1 --replication-factor 3` (and `f7b` for the control).\n- **Steps:** `bin/php.sh -- kafka/f7_offsets.php`, then `bin/php.sh -- kafka/f7_control.php`. The script does exactly what Sokrio does:\n  ```php\n  $m = $c->consume();                                          // library hands out decoded records\n  $c->getOffsetManager(T)->addFetchOffset($m->getPartition(), 1); // = advanceCursor, KafkaConsumer.php:282\n  $c->getOffsetManager(T)->saveOffsets(0, 3);                  // = flush commit, KafkaConsumer.php:328\n  ```\n- **Observed** `[LAB]`. 10 records were produced by one `sendBatch` (one RecordBatch, offsets 0–9):\n  ```\n  run 1 read: 0,1,2,3            | committed cursor=4   (then the process restarts)\n  run 2 read: 0..9, 0..9, 0..9   | cursor=9             (log end offset is 10)\n  + batch 10..13: 0..9,10..13,10..13,10..13\n  control, aligned start:        0..9 read once, cursor=10   ✅\n  control, one single-record publish after the loop: 10..19, 20 → then 21,22,23 once  (loop ends)\n  ```\n\n```mermaid\nsequenceDiagram\n  participant C as Consumer (counted cursor)\n  participant B as Broker\n  Note over C: committed 4 (mid-batch), restart\n  C->>B: Fetch offset 4\n  B-->>C: whole batch 0..9 (brokers return whole batches)\n  Note over C: 10 records → cursor 4+10 = 14  (true next = 10)\n  C->>B: Fetch offset 14\n  B-->>C: OFFSET_OUT_OF_RANGE\n  Note over C: reset to latest − 1 = 9 (OffsetManager.php:140,150)\n  C->>B: Fetch offset 9\n  B-->>C: whole batch 0..9 again → cursor 19 → out of range → 9 → …\n  Note over C,B: loops while the partition is idle, a 1-record batch realigns it\n```\n\n- **Why** `[LIB]`:\n  1. The fetch loop turns every record of every returned batch into a message (`phpkafka/Consumer/Consumer.php:357`) and never checks the record's own offset against the requested one.\n  2. The cursor is a counter (`KafkaConsumer.php:282`).\n  3. Out-of-range resets to `latest − 1` (`Consumer.php:345,364` → `OffsetManager.php:140,150`). That lands *inside* the last batch whenever it holds more than one record.\n- **When Sokrio gets misaligned** `[INFERENCE]`:\n  - A flush fires at 200 messages or after 1 s (`KafkaConsumer.php:251`, `config/kafka.php:63-64`), which can be in the middle of a fetched batch, and that offset is committed.\n  - Any restart then resumes mid-batch: the 6 h `max_runtime` recycle (`config/kafka.php:70`), a deploy, a crash, or an eviction (L3).\n  - v2 bulk tracking publishes one batch per call (F7), so its batches are big.\n  - The loop ends at the next v1 single-point publish. On a quiet partition, or one carrying only bulk traffic, it can replay the same batch for a long time, and every replay inserts duplicate `trackings` rows.\n- **Skips:** the lab saw duplicates, not skips. A skip is still possible `[INFERENCE]` when the drift is larger than the next batch: the counter can jump over a small batch entirely.\n- **Sokrio link:** F7 → **F25** (new), R23/R24, Q84. **Fix options:**\n  1. Track offsets from the record batch (`baseOffset + offsetDelta`) and drop records below the requested offset. That needs a patched or forked client.\n  2. Commit only at batch boundaries (flush only after the library's buffer is empty).\n  3. Make the handler idempotent (L5), so replays are harmless whatever the client does.\n  4. Long term, move to an `rdkafka`-based client (T2 §2.10).\n\n### L5 — Reproduce a duplicate, then fix it with idempotency\n- **Goal:** turn the L3/L4 replays into duplicate rows, then make the write idempotent.\n- **Setup:** `docker run -d --name t9lab-mysql -e MYSQL_ALLOW_EMPTY_PASSWORD=1 mysql:8.0`, wait for `mysqladmin ping`.\n- **Steps:** `docker exec -i t9lab-mysql mysql -uroot -t < mysql/dup.sql`. The table has the same indexes as `trackings` (only `user_id` and `(created_at,user_id)`, migration `2020_08_18_074138_create_trackings_table.php:18,24`). The script inserts a batch twice, de-duplicates, adds `UNIQUE (user_id, created_at)` and replays with `INSERT IGNORE` (= Laravel `insertOrIgnore()`).\n- **Observed** `[LAB]`:\n  ```\n  after replay                    | 6\n  after dedupe + unique + replay  | 3\n  plain INSERT of a replayed row  → ERROR 1062 Duplicate entry '7-2026-10-26 10:00:00' for key 'trackings.trackings_user_time_unique'\n  ```\n- **Sokrio link:** Q8, Q102. Production rollout order matters:\n  1. Clean up the existing duplicates (batched `DELETE … JOIN` by date range on a big table).\n  2. Add the unique index online.\n  3. Switch the writer to `insertOrIgnore` / `upsert`.\n  - Natural-key caveat (Q102): two genuine points from one user in the same second would collide. Use millisecond `created_at` or the dropped `event_id` (Q100) if that's real.\n- **Cleanup:** `docker rm -f t9lab-mysql`.\n\n### L6 — The `retry_after` double run (R13)\n- **Goal:** watch one job run several times because it outlives its reservation.\n- **Setup:** L0 (needs `redis`). `jobs.php` has `SlowReportJob` with `$timeout = 0`, `$tries = 3`, sleeping 12 s, shaped like `GenerateTrackingReport` and the other `$timeout = 0` jobs.\n- **Steps:** `bin/php.sh -e RETRY_AFTER=5 -- sh laravel/retry_after.sh` (dispatches once, starts two `queue:work redis` workers).\n- **Observed** `[LAB]` on Laravel 9.52.22:\n  ```\n  [10:21:36] pid 8  START job XC8S… attempt 1\n  [10:21:41] pid 14 START job XC8S… attempt 2      ← 5 s later: reservation expired, second worker took it\n  [10:21:48] pid 8  END   job XC8S…\n  [10:21:48] pid 8  START job XC8S… attempt 3      ← expired again, worker 1 took it back\n  [10:21:53] local.ERROR: SlowReportJob has been attempted too many times or run too long.  (MaxAttemptsExceededException)\n  ```\n- **Why** `[LIB]`: `pop` moves the job to `queues:default:reserved` with score `now + retry_after` (`Queue/RedisQueue.php:224`). Every worker's next `pop` first migrates expired reservations back to the queue (`:244-249`). `$timeout = 0` turns the worker's alarm off (`Queue/Worker.php:229-254`), so nothing kills the first run.\n- **Sokrio link:** prod `retry_after = 9000` (`config/queue.php:65`), so a `$timeout = 0` report that runs over 2.5 h starts a second copy. A crashed worker's job waits 2.5 h before anyone retries it (R12/R13, F10, Top-5 #4). Fix: a real `$timeout` below `retry_after` on every job, plus a separate short-`retry_after` connection for quick jobs (`order-approved`). Q65.\n\n### L7 — Fill Redis memory: OOM vs eviction (R11, A9)\n- **Goal:** see what each `maxmemory-policy` does to a queue that shares Redis with cache keys, as Sokrio's does.\n- **Steps:** `bash redis/evict-many-small.sh` (40 000 small cache keys with TTL), then `bash redis/evict-few-big.sh` (40 × 200 KB keys, with the queue key left idle for 3 s first). Each script starts a 4 MB `redis:7-alpine` and removes it at the end.\n- **Observed** `[LAB]`:\n\n| Policy | Push a job after the fill | Queued job survives? | Evicted keys |\n|---|---|---|---|\n| `noeviction` | `OOM command not allowed when used memory > 'maxmemory'` | yes, but new dispatches fail | 0 (memory hit **13.5 MB on a 4 MB limit**: the Lua fill was checked only at its start) |\n| `allkeys-lru`, 40k small keys | OK | yes (one key among 32k is rarely sampled) | 31 919 |\n| `allkeys-lru`, 40 big keys | — | **no, LLEN = 0 in 3/3 runs: the queued job was evicted** | 31 |\n| `volatile-lru`, both runs | OK | **yes, 3/3**: queue keys have no TTL, so they can't be chosen | 30 / 32 008 |\n\n- **Lesson:** with `allkeys-*`, queued jobs can disappear **silently**. It's probabilistic, so it may pass a quick test and still hit you in prod. `noeviction` fails loudly instead: dispatches throw, and the cache stops writing. `volatile-lru` keeps jobs safe **only** while every cache key has a TTL (Sokrio has 9 `rememberForever` keys, T4 §4.4).\n- **Sokrio link:** one Redis for queues (DB0) and cache (DB1) (`config/database.php:202-219`). DB numbers don't split memory. Python also writes to DB0 (F20). Prod policy unknown (A9). **Commands to run on prod** (read-only): `redis-cli CONFIG GET maxmemory*`, `INFO memory`, `INFO stats | grep evicted_keys`. R11, Q45, Q79. The structural fix is a separate Redis for queues (T6 §6.5).\n\n### L8 — `ShouldBeUnique` without an id drops other tenants' chunks (F11)\n- **Steps:** `bin/php.sh -- laravel/artisan run laravel/f11.php`. `BulkStockImportLikeJob` copies `Stock\\BulkStockImportJob`: `ShouldBeUnique`, no `uniqueId()`, no `uniqueFor`.\n- **Observed** `[LAB]` (same as `[LAB-T4]`):\n  ```\n  dispatch beol chunk@1 -> queued\n  dispatch beol chunk@30001 -> DROPPED\n  dispatch pvm chunk@1 -> DROPPED\n  lock key 'laravel_unique_job:BulkStockImportLikeJob' TTL = -1 (-1 = never expires)\n  ```\n- **Try the fix:** add `public function uniqueId() { return \"{$this->tenant}:{$this->startingRow}\"; }` and `public $uniqueFor = 3600;` to the lab job, `FLUSHALL` the lab Redis, and rerun. All three should queue.\n- **Sokrio link:** `app/Jobs/Stock/BulkStockImportJob.php:30`, chunk loop `BulkStockBatchImportJob.php:104-107`. R29, Top-5 #3, Q88.\n\n### L9 — Same SCAN call, two clients (F14) and the corrected fix (D21)\n- **Steps:** `for c in predis phpredis; do bin/php.sh -e REDIS_CLIENT=$c -- laravel/artisan run laravel/f14.php; done`. It creates 120 `feature_tracking:buffer:*` keys and counts what each call shape finds.\n- **Observed** `[LAB]`:\n\n| Client | Sokrio's call `scan('0','MATCH',…,'COUNT',50)` | array options, start `null` | start `0` | start `'0'` |\n|---|---|---|---|---|\n| predis | **120/120** | `ERR invalid cursor` | 120/120 | 120/120 |\n| phpredis | **0/120** (F14) | 120/120 | 0/120 | 0/120 |\n\n- **Why** `[LIB]`: Laravel wraps `scan` only for phpredis (`Redis/Connections/PhpRedisConnection.php:314-326`, options array + by-reference cursor where `null` means \"start\"). Predis gets the raw arguments, and Redis rejects a `null` cursor.\n- **The fix that works on both** (each half verified above):\n  ```php\n  $cursor = config('database.redis.client') === 'phpredis' ? null : '0';\n  do {\n      [$cursor, $keys] = Redis::scan($cursor, ['match' => $match, 'count' => 50]) ?: [0, []];\n      foreach ($keys as $rawKey) { /* … */ }\n  } while ($cursor && (string) $cursor !== '0');\n  ```\n- **Sokrio link:** `FlushFeatureEventsJob.php:68`, `PurgeFeatureTrackingLeaderboards.php:38`. A7 decides if F14 is live (README recommends phpredis). R30, Q90.\n\n### L10 — Web ↔ worker cache prefix split (F12) — `[LAB-T4]`\n- **Goal:** show that a key written under the tenant prefix in a request is invisible to the worker.\n- **Steps** (in the `labs/laravel` console):\n  1. `Cache::getStore()->setPrefix('lab_cache:tenant_7:')` (what `ScopeCacheToTenant.php:37-69` does in HTTP), then `Cache::put('report_lock:abc', 1, 3600)`.\n  2. Reset to the bare prefix (what a worker has), then `Cache::get('report_lock:abc')` returns `null`, and `Cache::forget` removes nothing.\n  3. `redis-cli -n 1 KEYS '*report_lock*'` still shows the tenant-prefixed key with its TTL.\n- **Sokrio link:** `ReportCacheMacro.php:24-57` (429 until the TTL), Org cache invalidation (`Org.php:45-48`), unique locks dispatched in HTTP. The correct template is `SmsResendRun.php:24-25,197-214` (fixed prefix). R35, Q89.\n\n### L11 — Tenant model restored from the wrong tenant (F16) — `[LAB-T5]`\n- **Goal:** reproduce the cross-tenant restore with real `SerializesModels`.\n- **Steps** (outline of the T5 sandbox, `05` §5.3):\n  1. Create two SQLite files `a.sqlite` and `b.sqlite`, each with `users(id=42)` (Alice in A, Bob in B).\n  2. Define a `tenant` connection pointing at A. Serialize a job holding `User::on('tenant')->find(42)`.\n  3. `Config::set('database.connections.tenant.database', 'b.sqlite')` + `DB::purge('tenant')` (= the previous job's `reconnect()`, `TenantManager.php:96-99`).\n  4. `unserialize()` the payload and print the user's name.\n- **Observed** `[LAB-T5]`: dispatched *\"Alice (tenant A)\"* → restored *\"Bob (tenant B)\"*.\n- **Try the fix:** register a `JobProcessing` listener that sets the connection from `payload()['tenant_id']`, and repeat. The worker fires `JobProcessing` before unserializing (`Queue/Worker.php:412` → `:425`).\n- **Sokrio link:** 4 live jobs (`BatchTransferJob.php:35` …). R31, Top-5 #1, Q91.\n\n### L12 — Run Sokrio itself against the lab cluster (the §5.7 sandbox)\n- **Goal:** watch the real producer and consumer, not a probe.\n- **Setup:** the lab `compose.yml`, with ports published on the host for the app (`k1` → 9092, `redis` → **6380**, so it doesn't clash with other local Redis containers). In a **local** `.env` that you own, set `QUEUE_CONNECTION=redis`, `CACHE_DRIVER=redis`, `REDIS_CLIENT=phpredis|predis`, `KAFKA_BROKERS=localhost:9092`, and **two** tenants. Never point it at a shared or prod host.\n- **Steps:**\n  ```bash\n  php artisan kafka:consume departments --max-runtime=0            # ConsumeCommand.php:18-19\n  php artisan queue:work redis --queue=order-approved,summary,sequential,feature-tracking,default --timeout=900\n  tail -f storage/logs/kafka-$(date +%F).log                       # daily driver (D16)\n  ```\n  Edit a department in tenant 1, then watch it arrive in Mongo. Then stop the whole cluster (`docker compose -p t9lab stop k1 k2 k3`) and edit again: the save is ~3.75 s slower (F8) and the event is gone (D11).\n- **Sokrio link:** `05` §5.7 local gotchas (the defaults `sync` + `file` hide F12/F16).\n\n### L13 (optional) — SQS delay cap (F22) with LocalStack — *not run in T9*\n- **Steps** `[GENERAL]`: `docker run -d --name t9lab-ls -p 4566:4566 localstack/localstack`, then `aws --endpoint-url http://localhost:4566 sqs create-queue --queue-name lab`. Send with `--delay-seconds 3600`.\n- **Expected:** `InvalidParameterValue` (the maximum is 900 s). Sokrio's approval delay can be up to 60 min (`SettingRequest.php:39,45`), and `SqsQueue::later` passes it straight through (`vendor/…/Queue/SqsQueue.php:138`). R33, Q74.\n\n---\n\n## 9.4 Cheat sheet (one page)\n\n### Sokrio numbers to know by heart\n| Setting | Value | Ref |\n|---|---|---|\n| Producer acks | **0** (never set) | F5 |\n| Topics | auto-created, P=3, RF=1, suffix `.v1.{env}` | `config/kafka.php:74-75`, `TopicRegistry.php:51-58` |\n| Consumer | static `group.instance.id=\"\"`, autoCommit off, flush 200 msgs / 1 s | `KafkaConsumer.php:69,79-95`, `config/kafka.php:63-64` |\n| Session / rebalance / heartbeat | 30 s / 30 s / 3 s (heartbeat only on fetch, F9) | `config/kafka.php:50` |\n| Consumer max runtime | 21 600 s = 6 h (command fallback 3600) | `config/kafka.php:70`, `ConsumeCommand.php:70-73` |\n| Producer retries | 3 attempts, ~3.75 s worst case | `KafkaProducer.php:26,113-192` |\n| Groups | tracking = `KAFKA_GROUP`; others `{KAFKA_GROUP}-{topic}` | `ConsumeCommand.php:97-107` |\n| Queue `retry_after` | **9000 s** (2.5 h) | `config/queue.php:65` |\n| Queues | `summary`, `default`, `feature-tracking`, `order-approved`, `sequential` | T0 §0.7 |\n| Redis | DB0 queues + `Redis::`, DB1 cache; default client phpredis | `config/database.php:195,202-219` |\n| Supervisor | numprocs=1, `stopwaitsecs=35`, `autorestart=true` | `README.md:178-212` |\n| Org cache TTL | 10 080 s ≈ 2.8 h (not a week, D12) | `Org.php:57,72` |\n| Kafka log | `storage/logs/kafka-YYYY-MM-DD.log`, 7 days | `config/logging.php:54-68` |\n\n### Kafka CLI (`/opt/kafka/bin/*.sh`, or `bin/k.sh k1 <tool>` in the lab)\n```bash\nkafka-topics --bootstrap-server $BS --list | --describe --topic T | --describe --under-replicated-partitions | --describe --unavailable-partitions\nkafka-topics --bootstrap-server $BS --create --topic T --partitions 3 --replication-factor 3 --config min.insync.replicas=2\nkafka-configs --bootstrap-server $BS --entity-type topics --entity-name T --describe     # retention, cleanup.policy …\nkafka-consumer-groups --bootstrap-server $BS --list | --describe --group G [--members --verbose | --state]   # LAG per partition\nkafka-consumer-groups --bootstrap-server $BS --group G --topic T --reset-offsets --to-datetime 2026-10-23T00:00:00.000 --dry-run   # then --execute (group must be stopped)\nkafka-consumer-groups --bootstrap-server $BS --group G --topic T:0 --reset-offsets --to-offset 1234 --execute\nkafka-console-consumer --bootstrap-server $BS --topic T --partition 0 --offset 100 --max-messages 5 --property print.key=true --property print.offset=true\nkafka-console-producer --bootstrap-server $BS --topic T --property parse.key=true --property key.separator=: --producer-property acks=all\nkafka-get-offsets --bootstrap-server $BS --topic T                                    # end offsets (present in 3.7)\n```\n- Replay without touching prod consumers: use a **new** group and set its offsets with `--reset-offsets` **before** it first starts. phpkafka starts a new group at offset 0 (F6). Q26.\n\n### redis-cli\n```bash\nredis-cli INFO memory | grep -E 'used_memory_human|maxmemory_human|mem_fragmentation_ratio'\nredis-cli CONFIG GET maxmemory*          # policy + limit (A9) — read-only\nredis-cli INFO stats | grep -E 'evicted_keys|rejected_connections'\nredis-cli INFO persistence | grep -E 'aof_enabled|rdb_last_save_time'\nredis-cli --bigkeys          |  redis-cli MEMORY USAGE <key>  |  redis-cli SLOWLOG GET 10\nredis-cli -n 0 LLEN  \"${REDIS_PREFIX}queues:default\"           # waiting jobs (list)\nredis-cli -n 0 ZCARD \"${REDIS_PREFIX}queues:default:reserved\"  # running (score = lease expiry)\nredis-cli -n 0 ZCARD \"${REDIS_PREFIX}queues:default:delayed\"   # delayed approvals live here (lost on restart w/o AOF)\nredis-cli -n 1 --scan --pattern \"${CACHE_PREFIX}:tenant_7:*\" | head    # never KEYS * on prod\nredis-cli -n 1 TTL \"<key>\"                                     # -1 = no expiry (F11 lock), -2 = gone\n```\n\n### Artisan\n```bash\nphp artisan queue:work redis --queue=order-approved,summary,default --timeout=900 --tries=3 --max-time=3600   # order = priority\nphp artisan queue:restart                  # graceful: workers exit after the current job (cache key, Worker.php:653-666)\nphp artisan queue:failed | queue:retry <id|all> | queue:forget <id> | queue:flush\nphp artisan queue:prune-failed --hours=168 # not scheduled in Sokrio today\nphp artisan queue:monitor redis:default,redis:summary --max=100   # fires QueueBusy; nothing listens yet (AL2)\nphp artisan queue:clear redis --queue=default                     # destructive — confirm first\nphp artisan kafka:consume tracking|departments [--max-runtime=0]\nphp artisan schedule:list                  # only on the box with RUN_SCHEDULER=true\nphp artisan tenant:department_sync_with_mongodb   # manual full resync (F1)\n```\n\n### Supervisor\n```bash\nsupervisorctl status                                   # RUNNING / BACKOFF / FATAL (FATAL after 3 failed starts, no alert)\nsupervisorctl restart sokrio-kafka-consumer-departments\nsupervisorctl tail -f sokrio-kafka-consumer-tracking stderr\nsupervisorctl reread && supervisorctl update           # after editing a program file\nsupervisorctl stop all                                 # waits stopwaitsecs (35 s) per program, then SIGKILL\n```\n\n### First 5 minutes of an incident\n1. `supervisorctl status`: are the consumers and workers alive?\n2. `kafka-consumer-groups --describe`: is lag growing on one partition or on all of them?\n3. `LLEN`/`ZCARD` on the queues: is work piling up, or are reservations stuck?\n4. `INFO memory` / `evicted_keys`: is Redis full?\n5. `tail` the kafka log + `queue:failed`, then pick the runbook (R-id) from `07a`/`07b` §7.3.\n\n---\n\n### ✅ Quality check\n- [x] §9.1 gives a 5-week plan (+1 buffer week) walking 00 → 08e, with daily goals, the questions to rehearse each week (🔴 first, plus the Sokrio-derived Q82–Q106) and a \"Quiz me\" checkpoint per week\n- [x] All README_2 labs are covered: kill a broker (L1), force a rebalance with a slow consumer (L3), duplicate → idempotency (L5), the `retry_after` double run (L6), Redis memory full + eviction (L7)\n- [x] The pending labs from HANDOFF are covered: F7 (L4), F9 (L3), F11 (L8), F12 (L10), F14 (L9), F16 (L11), the §5.7 sandbox (L12), and F22 (L13, marked *not run*)\n- [x] L1–L9 were **run** on 2026-10-26 with the scripts saved in `labs/`, against phpkafka v1.2.5 and Laravel 9.52.22 from Sokrio's vendor (read-only). The outputs shown are real. L10/L11 reuse the T4/T5 lab results\n- [x] New finding **F25** (replay loop) and correction **D21** (the SCAN fix) recorded. F5, F7 and F9 upgraded from `[INFERENCE]` to `[LAB]`\n- [x] Compose snippets are ≤ 15 lines; code snippets are trimmed\n- [x] No secrets, hosts or IPs. Env vars are names only; every lab is local and throwaway\n"}, {"file": "GLOSSARY.md", "md": "# 10 · Glossary\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26 (`master` = `bf223a126`, no messaging changes). No new code was read for this file; every Sokrio fact is reused from sections 00–09 and `_plan/MEMORY.md`.\n> One line per term. `→ 04 §4.3` means \"explained in file `04-…md`, section 4.3\". Tags: `[CODE]` Sokrio app code · `[LIB]` vendor code · `[LAB]` reproduced in `labs/` · `[GENERAL]` industry knowledge · `[INFERENCE]` / `[ASSUMPTION]` as in the sections. A term with no tag is a `[GENERAL]` definition.\n\n**How to use this file:** look a term up here when a section uses it without explaining it. §10.1 is the tag legend, §10.2 general terms A–Z, §10.3 Sokrio components and config names, §10.4 every id used in the deep dive (F, D, R, AL, A, L, B, P/C, Q).\n\n---\n\n## 10.1 Tags and markers\n\n- **`[CODE]`** — verified in Sokrio app code at `d14c0ebb2`, with a `path:line` ref.\n- **`[LIB]`** — verified in installed vendor code (`longlang/phpkafka` v1.2.5, Laravel 9.52.22, predis 1.1.10).\n- **`[LAB]`** — reproduced in T9 with the scripts in `labs/`. `[LAB-T4]` / `[LAB-T5]` = reproduced in the T4 / T5 scratch labs.\n- **`[NOTES]`** — taken from Komol's notes (`README.md`, `README_2.md`, `old-resource/`); the code wins on conflict (see D-ids).\n- **`[HIST]`** — read from a file that exists only in git history (e.g. `557e63d68^:docker-compose.prod.yml`).\n- **`[GENERAL]`** — industry knowledge, not Sokrio-specific.\n- **`[INFERENCE]`** — follows from code (and labs), not observed in prod.\n- **`[ASSUMPTION]`** — best guess; tracked as an A-id until Komol confirms.\n- **🟢 / 🟡 / 🔴** — finding severity: low / medium / high blast radius.\n- **`### ✅ Quality check`** — the done-criteria list at the end of every section.\n\n---\n\n## 10.2 General terms (A–Z)\n\n### A\n- **ACID** — atomicity, consistency, isolation, durability: the guarantees of a DB transaction. → 08a §8.2\n- **ACK (message)** — consumer tells the broker \"done, don't redeliver\". RabbitMQ `basic.ack`; Laravel deletes the job from `:reserved`. → 03 §3.2, 08b §8.5\n- **acks (producer)** — how many replicas must confirm a write: `0` = none (fire and forget), `1` = leader only, `all` = every in-sync replica. Sokrio runs `acks=0` (F5). → 02 §2.1\n- **ACL** — access-control list (Kafka topic/group permissions, Redis 6 users). → 06 §6.4\n- **Aggregate** — DDD unit of consistency; the natural partition/ordering key (e.g. an order). → 08d §8.9\n- **allkeys-lru / allkeys-lfu** — Redis eviction policies that may evict *any* key, queue lists included. Right for a pure cache node, wrong for queues. `[LAB]` → 04 §4.9, 09 L7\n- **AMQP** — Advanced Message Queuing Protocol (0-9-1), RabbitMQ's wire protocol: exchanges, bindings, queues. → 03 §3.2\n- **AOF** — Redis append-only file persistence (`appendfsync everysec` ≈ ≤1 s loss). Not configured anywhere in Sokrio's repos. → 04 §4.9\n- **APM** — application performance monitoring (Datadog traces/profiler in Sokrio). → 06 §6.9\n- **at-least-once / at-most-once / exactly-once** — delivery semantics: may duplicate / may lose / neither (only within a closed system like Kafka EOS). Sokrio = \"consumer at-least-once, pipeline best-effort\". → 02 §2.6, 08a §8.2\n- **auto.offset.reset** — Kafka consumer setting for a group with no valid offset (`earliest`/`latest`). phpkafka has none (F6). → 02 §2.3\n- **autoCommit** — consumer commits offsets on a timer. Sokrio sets it `false` and commits per flush (D8). → 02 §2.3\n- **AZ** — AWS availability zone; Multi-AZ = replicas across zones. → 06 §6.4–6.5\n\n### B\n- **Backoff** — wait time between retries (fixed, linear, exponential + jitter). Laravel job `$backoff`. → 05 §5.3, 08a §8.2\n- **Backpressure** — slowing producers when consumers can't keep up (bounded queues, 429/503, RabbitMQ flow control). → 08a §8.1\n- **Batch layer / speed layer** — Lambda architecture halves; Sokrio has only the batch layer (hourly summaries + daily resync). → 08c §8.8\n- **BLMOVE / BRPOP / BLPOP** — blocking Redis list pops; Laravel uses `block_for` (null in Sokrio → `--sleep` polling). → 04 §4.2\n- **Bootstrap servers** — initial broker list a Kafka client connects to (`KAFKA_BROKERS`). → 00 §0.9\n- **Broker** — a Kafka (or RabbitMQ) server process that stores and serves messages. → 08a §8.3\n- **Bulkhead** — isolate resources per workload/tenant so one can't starve the rest (separate queues/workers). → 08c, R18\n\n### C\n- **Cache-aside** — read cache, on miss load from DB and store (`Cache::remember`). → 04 §4.4\n- **Cache penetration** — repeated lookups of keys that never exist; `remember()` never caches `null`, so every miss hits the DB `[LIB]`. → 08c §8.6\n- **Cache stampede (dog-pile)** — many requests rebuild one expired key at once; only `MatrixAggregator` is protected. → 04 §4.4, R16\n- **CAP / PACELC** — under a partition choose consistency or availability; PACELC adds \"else, latency vs consistency\". → 08a §8.1\n- **CDC** — change data capture: stream DB changes from the binlog (Debezium). Not used in Sokrio. → 02 §2.2, D19\n- **Choreography / orchestration** — sagas driven by events between services vs by a central coordinator. → 08d §8.9\n- **Circuit breaker** — stop calling a failing dependency for a while, then probe. → 08d §8.9\n- **cleanup.policy** — Kafka topic `delete` (time/size retention) or `compact` (keep last value per key). → 02 §2.5\n- **Compacted topic** — keeps the latest record per key; deletes need a tombstone. Departments is the ideal candidate. → 02 §2.5, 08a §8.3\n- **Competing consumers** — many workers pull from one queue; each message goes to one of them (Laravel `queue:work` × N). → 08a §8.1\n- **Consumer group** — Kafka consumers sharing a `group.id`; each partition is owned by one member. → 02 §2.3\n- **Consumer lag** — log-end offset minus committed offset (or time behind). Not monitored in Sokrio (AL1). → 06 §6.9\n- **Cooperative rebalancing** — incremental rebalance (KIP-429) that doesn't stop the whole group. → 08b §8.4\n- **Co-partitioning** — two topics with the same key/partition count so joins line up; breaks across clients with different partitioners (crc32 vs murmur2). → 08c §8.8\n- **CQRS** — separate write model and read model; Sokrio has CQRS (MySQL → Mongo summaries) without event sourcing. → 08d §8.9\n- **crc32 partitioner** — phpkafka's `crc32(key) % N`; Java clients use murmur2, so the same key can land on different partitions. `[LIB]` → 02 §2.5\n- **CROSSSLOT** — Redis Cluster error for multi-key commands across hash slots. → 08c §8.6\n\n### D\n- **Dead-man's switch** — alert when an expected heartbeat stops (`->thenPing()`); missing in Sokrio (AL7). → 06 §6.9\n- **Debezium** — open-source CDC connector on Kafka Connect. → 02 §2.2, 08b Q28\n- **Delayed job** — Laravel job with `->delay()`; on Redis it sits in the `:delayed` sorted set until due. → 04 §4.2, B7\n- **Delivery tag** — RabbitMQ per-channel id used to ack/nack. → 08b §8.5\n- **DelaySeconds** — SQS per-message delay, max 900 s (F22). → 06 §6.8\n- **DLQ / DLX / DLT** — dead-letter queue / RabbitMQ dead-letter exchange / Kafka dead-letter topic. Sokrio has none for Kafka; `failed_jobs` plays the role for jobs. → 02 §2.9, 03 §3.4\n- **Dual write** — writing DB and broker separately without a shared transaction; one can succeed without the other. → 02 §2.2, R6\n\n### E\n- **ECST** — event-carried state transfer: events carry the full state (fat payload), like department events. → 08d §8.9\n- **EINTR** — \"interrupted system call\": a signal (e.g. Datadog SIGPROF) breaks a blocking `select`; handled by `InterruptResilientStreamSocket`. → 07a R23\n- **ELR** — eligible leader replicas (KIP-966), safer unclean-election alternative in newer Kafka. → 08a §8.3\n- **EOS** — Kafka exactly-once semantics: idempotent producer + transactions + `read_committed`. → 08a §8.2\n- **Event sourcing** — state = fold over an append-only event log; not used in Sokrio. → 08d §8.9\n- **EventBridge (Scheduler)** — AWS event bus / one-off scheduled invocations; proposed for delayed approvals (F22). → 06 §6.8\n- **Eviction** — Redis removing keys when `maxmemory` is hit, per `maxmemory-policy`. → 04 §4.9, R11\n- **Exchange (direct / topic / fanout / headers)** — RabbitMQ router that copies messages to bound queues. → 03 §3.2\n\n### F\n- **Fan-out** — one message/trigger to many consumers or one job per tenant (`BaseCommand` → job per org). → 01 §1.6\n- **Fat vs thin event** — full state in the payload vs just an id to look up. Tracking/departments are fat, the planned order events thin. → 00 §0.4\n- **Fencing** — rejecting a stale member/leader by epoch or id (`FENCED_INSTANCE_ID`). → 07a R22\n- **FIFO queue** — SQS ordered queue with `MessageGroupId`; Laravel 9.52 SqsQueue can't set it. `[LIB]` → 06 §6.8\n\n### G–H\n- **group.instance.id** — Kafka static membership id; Sokrio sets `\"\"` → static, not dynamic (D1). → 02 §2.3\n- **Hash slot** — Redis Cluster key → one of 16384 slots (CRC16). → 08c §8.6\n- **Head-of-line (HOL) blocking** — one stuck message blocks everything behind it in the same partition/queue (poison message). → 07a R4\n- **Heartbeat** — consumer liveness signal to the group coordinator; phpkafka sends it only on fetch outside Swoole (F9). → 02 §2.3\n- **High watermark (HW)** — highest offset replicated to all ISR; consumers read up to it. → 08a §8.3\n- **Horizon** — Laravel's Redis-queue dashboard/supervisor; not installed in Sokrio. → 00 §0.13\n\n### I–K\n- **Idempotency** — applying the same message twice has the same effect as once (upsert, unique key, dedupe table). → 02 §2.7, 09 L5\n- **Idempotency-Key** — client-supplied request id for safe HTTP retries; only Task Manager has it in Sokrio. → 08e §8.13\n- **Idempotent producer** — Kafka producer id + sequence numbers dedupe broker-side retries; phpkafka uses `producerId=-1` (off). `[LIB]` → 02 §2.1\n- **Inbox pattern** — consumer stores processed message ids to dedupe. → 03 §3.4, 08a §8.2\n- **ISR** — in-sync replicas: followers caught up with the leader. → 08a §8.3\n- **Key (message)** — decides partition and thus ordering; Sokrio keys by `user_id` / `department_id`, not tenant (D4). → 02 §2.5\n- **Kinesis** — AWS managed stream (shards), Kafka's closest AWS-native analog. → 06 §6.8\n- **KIP** — Kafka Improvement Proposal (e.g. KIP-500 KRaft, KIP-848 new rebalance protocol, KIP-932 share groups). → 08a §8.3\n- **KRaft** — Kafka's built-in Raft metadata quorum replacing ZooKeeper (KIP-500). Labs use 3 KRaft brokers. → 08a §8.3, 09 §9.2\n- **KTable / GlobalKTable** — Kafka Streams table views of a topic; departments = KTable, `Org` = GlobalKTable candidate. → 08c §8.8\n\n### L\n- **Lambda / Kappa architecture** — batch + speed layers vs stream-only with replay. → 08c §8.8\n- **Leader / follower** — partition replica roles; producers and consumers talk to the leader. → 08a §8.3\n- **Lease (visibility timeout)** — a reserved message is hidden for N seconds, then redelivered. Laravel Redis = `retry_after`; SQS = VisibilityTimeout. → 04 §4.2\n- **LEO** — log end offset: next offset to be written on a replica. → 08a §8.3\n- **linger.ms / batch.size** — producer batching knobs (Java client); phpkafka batches per `sendBatch` call. → 02 §2.1\n- **LocalStack** — local AWS emulator; used by the unrun L13. → 09 L13\n- **Lock (distributed)** — mutual exclusion across processes; Laravel `Cache::lock` = Redis `SET NX EX` + owner-checked Lua release. → 04 §4.5\n- **LSO** — last stable offset: `read_committed` consumers stop before open transactions. → 08a §8.2\n\n### M\n- **max.poll.interval.ms** — max gap between polls before the member is kicked (Java, default 5 min); in phpkafka the effective budget is `session_timeout` 30 s (F9). → 07a R3\n- **maxmemory / maxmemory-policy** — Redis memory cap and what happens at it (`noeviction`, `*-lru`, `*-lfu`, `volatile-ttl`). → 04 §4.9\n- **min.insync.replicas** — with `acks=all`, the minimum ISR size to accept a write (usually 2 with RF=3). → 07a R1\n- **MSK** — Amazon Managed Streaming for Apache Kafka (provisioned / Serverless). phpkafka can't do its IAM/SCRAM auth (F21). → 06 §6.4\n- **MemoryDB / ElastiCache** — AWS managed Redis: durable (multi-AZ log) vs cache-grade. → 06 §6.5\n- **murmur2** — the Java Kafka client's default partitioner hash. → 08b §8.4\n\n### N–O\n- **NACK / requeue** — RabbitMQ negative ack; Laravel analog = `release($delay)`. → 03 §3.2\n- **noeviction** — Redis refuses writes at `maxmemory` (`OOM command not allowed`); the right policy for a queue node. `[LAB]` → 09 L7\n- **Noisy neighbor** — one tenant's load degrades others (shared queue, global export lane). → 07b R18, F24\n- **Offset** — a record's position in a partition; committed offset = where the group resumes. → 02 §2.3\n- **OFFSET_OUT_OF_RANGE** — committed offset no longer exists (retention) or is past the end; phpkafka resets to `latest − 1` (F6, F25). → 07a R27\n- **onOneServer()** — Laravel scheduler lock so only one box runs a task; Sokrio relies on `RUN_SCHEDULER` instead. → 05 §5.1\n- **OOM** — out of memory: Redis `OOM command not allowed`, or the kernel killing a PHP worker. → R11, R8\n- **Ordering guarantee** — Kafka orders per partition only; Laravel queues give no ordering across workers. → 02 §2.8, R7\n- **Outbox pattern** — write the event to a DB table in the same transaction, relay it to the broker later. Fixes dual write. → 02 §2.2, 08d §8.9\n\n### P\n- **Partition** — an ordered, append-only shard of a topic; the unit of parallelism and ordering. → 08a §8.3\n- **Partitioner** — function key → partition (`crc32 % N` in phpkafka). → 02 §2.5\n- **PEL** — Redis Streams pending entries list: delivered but not `XACK`ed. → 08c §8.6\n- **Poison message** — a message that fails every time and blocks or loops. Sokrio logs and skips malformed envelopes. → 07a R4\n- **Prefetch (QoS)** — RabbitMQ `basic.qos` cap on unacked messages per consumer. → 03 §3.2\n- **Publisher confirms** — RabbitMQ broker ack to the producer (≈ Kafka `acks`). → 03 §3.2\n- **Pub/sub (Redis)** — fire-and-forget fan-out, no persistence; unused in Sokrio. → 04 §4.8\n- **Pusher** — hosted WebSocket service behind Laravel broadcasting; the frontend uses `laravel-echo` + `pusher-js`. → 04 §4.8, B5\n\n### Q–R\n- **Quorum queue** — RabbitMQ replicated (Raft) queue type; `x-delivery-limit` gives poison protection. → 03 §3.2\n- **Rate limiter (fixed / sliding window, token bucket)** — Laravel limiters are fixed-window (D20). → 04 §4.6, 08c Q47\n- **RDB** — Redis point-in-time snapshot persistence (`BGSAVE`). → 04 §4.9\n- **read_committed** — consumer isolation that hides aborted/open transactional records. → 08a §8.2\n- **Rebalance** — reassigning partitions when members join/leave/time out. → 07a R3\n- **RecordBatch** — Kafka's on-disk/wire batch of records with one `baseOffset`; phpkafka ignores it and counts records (F7). `[LIB]` → 02 §2.3, 09 L4\n- **Replication factor (RF)** — copies per partition; Sokrio's auto-create default is 1 (A3, R21). → 02 §2.5\n- **Retention (retention.ms / retention.bytes)** — how long Kafka keeps records (broker default 7 days). → 00 §0.6\n- **retry_after** — Laravel Redis-queue lease: a reserved job not finished in N s is handed out again. Sokrio = 9000 s. → 04 §4.2, R13\n- **RPO / RTO** — recovery point (data you can lose) / recovery time objective. → 06 §6.5\n- **RangeAssignor** — partition assignment strategy phpkafka uses (`ConsumerConfig.php:115`). `[LIB]` → 02 §2.3\n\n### S\n- **Saga** — a long business transaction as local steps + compensations; not used in Sokrio. → 08d §8.9\n- **SASL (PLAIN / SCRAM / IAM / OAUTHBEARER / GSSAPI)** — Kafka auth mechanisms; phpkafka supports PLAIN only (F21). `[LIB]` → 06 §6.4\n- **SCAN** — cursor-based Redis key iteration; the cursor API differs between predis and phpredis (F14, D21). → 04 §4.7, 09 L9\n- **Schema registry / schema evolution** — versioned payload contracts (Avro/Protobuf/JSON Schema); Sokrio's envelope has no version field. → 07a R10\n- **Session timeout (session.timeout.ms)** — no heartbeat for this long → member evicted; 30 s in Sokrio. → 02 §2.3\n- **Share groups** — queue-like Kafka consumption with per-record acks (KIP-932). → 08c, 08d\n- **Sharding** — splitting data across nodes by key (Redis Cluster slots, Kafka partitions). → 08c §8.6\n- **SIGTERM / SIGINT / SIGKILL / SIGALRM / SIGUSR2** — stop request / Ctrl-C / uncatchable kill / Laravel job timeout alarm / Laravel worker pause. → 07a R9, 08d §8.10\n- **SNS** — AWS pub/sub topic (fan-out to SQS, HTTP, SMS). → 06 §6.8\n- **SQS (standard / FIFO)** — AWS managed queue; 15-min delay cap, visibility timeout, DLQ via redrive policy. → 06 §6.8\n- **Static membership** — consumer keeps its partitions across restarts via `group.instance.id`; two processes with the same id fence each other. → 02 §2.3, 07a R22\n- **Sticky / cooperative-sticky assignor** — keeps assignments stable across rebalances. → 08b §8.4\n- **Stream (Redis)** — append-only log type with consumer groups (`XADD`, `XREADGROUP`, `XACK`, `XAUTOCLAIM`); unused in Sokrio. → 08c §8.6\n- **Stream processing** — continuous computation over events (windows, joins, state stores). → 08c §8.8\n- **Supervisor** — process manager that keeps `queue:work` / `kafka:consume` running; `autorestart`, `numprocs`, `stopwaitsecs`. → 05 §5.1, 06 §6.7\n\n### T–Z\n- **Tenant / landlord** — per-org DB vs platform DB in Sokrio's multi-tenancy. → 05 §5.5\n- **Tombstone** — Kafka record with a null value; deletes a key in a compacted topic. → 02 §2.5\n- **Topic** — named Kafka log made of partitions. → 00 §0.6\n- **Transactional producer** — atomic writes across partitions + offsets (`transactional.id`). → 08a §8.2\n- **TTL** — time to live of a cache key, lock or message. → 04 §4.4\n- **Unclean leader election** — electing an out-of-sync replica (data loss for availability). → 07a R1\n- **Under-replicated partitions (URP)** — partitions with ISR < RF; RF=1 can't under-replicate, it just goes offline. → 06 §6.9\n- **Unique job** — Laravel `ShouldBeUnique`: a cache lock keyed by class + `uniqueId()` for `uniqueFor` seconds. → 04 §4.3\n- **Visibility timeout** — SQS lease; Laravel's SqsQueue never sets it per pop. `[LIB]` → 06 §6.8, F22\n- **volatile-lru / volatile-ttl** — evict only keys with a TTL; queue keys survive (no TTL). `[LAB]` → 09 L7\n- **Write-ahead log (WAL)** — durable append before applying a change; Kafka's log is one. → 08b, 08c\n- **ZooKeeper / ZAB** — Kafka's old metadata store and its consensus protocol, removed in Kafka 4.0. → 08a §8.3\n\n---\n\n## 10.3 Sokrio components, config and runtime names\n\n### Kafka layer `[CODE]`\n- **`KafkaProducer`** — publish engine: envelope, 3 attempts, socket teardown, no acks set. `app/Services/Kafka/KafkaProducer.php` → 02 §2.1\n- **`KafkaConsumer`** — poll loop, 200 msg / 1 s flush, manual per-flush commit, signal blocking, join retry. → 02 §2.3\n- **`ConsumeCommand` (`kafka:consume <topic>`)** — the artisan entry point; `HANDLERS` map = tracking, departments. → 00 §0.5\n- **`TopicRegistry`** — topic keys → names, `.{APP_ENV}` suffix outside production. → 00 §0.6\n- **`TopicProvisioner`** — auto-creates missing topics (P=3, RF=1), cache-marks them verified for 1 day. → 02 §2.5\n- **`TrackingMessageHandler`** — groups by tenant, bulk-writes MySQL `trackings` + Mongo, retries 3×, per-point fallback. → 01 §1.4\n- **`DepartmentMessageHandler`** — Mongo `bulkWrite` upsert on `department_id`, per-record fallback; untested. → 01 §1.5\n- **`InterruptResilientStreamSocket`** — EINTR-tolerant socket subclass. → 07a R23\n- **`PublishesKafkaMessage`** — observer trait that swallows and logs publish errors. → 02 §2.2\n- **`DepartmentChangeObserver`** — publishes department `created`/`updated`; no fallback, no `afterCommit`. → 01 §1.5, F8\n- **Envelope** — `{event_id, event_type, tenant_id, occurred_at, payload}`; the consumer drops `event_id`/`occurred_at`. → 00 §0.4\n- **`tracking.events.v1` / `departments.events.v1`** — the two live topics; `order-summaries.events.v1` / `delivery-summaries.events.v1` are planned (B8). → 00 §0.6\n- **`KAFKA_GROUP` / `{KAFKA_GROUP}-{topic}`** — tracking keeps the bare legacy group; other topics get their own (D2). → 02 §2.3\n- **`KAFKA_CONSUMER_MAX_RUNTIME`** — consumer recycle, 21600 s (6 h) in config, 3600 s command fallback. → 00 §0.5\n- **`KAFKA_AUTO_CREATE_PARTITIONS` / `_REPLICATION_FACTOR`** — auto-create defaults 3 / 1. → 00 §0.6\n- **`kafka` log channel** — daily file `kafka-YYYY-MM-DD.log` + stderr, kept out of Slack/Sentry (D16). → 06 §6.9\n- **Tracking v1 / v2** — single-point `send()` vs bulk `publishBatch` endpoints; 202 on publish, sync fallback, 503 + `Retry-After: 5` (D9). → 01 §1.4\n- **`WriteTrackingActions` / `WriteBulkTrackingActions`** — the synchronous fallback writers. → 01 §1.4\n- **`DepartmentSync` (`tenant:department_sync_with_mongodb`)** — full Mongo resync; manual only (F1). → 01 §1.5\n\n### Queues, Redis, scheduler `[CODE]`\n- **Queues `summary` / `default` / `feature-tracking` / `order-approved` / `sequential`** — the five named Redis queues in use. → 00 §0.7\n- **`queues:{name}`, `:reserved`, `:delayed`** — Laravel's Redis list + two sorted sets per queue. `[LIB]` → 04 §4.2\n- **DB0 / DB1** — Redis DB 0 = queues + `Redis::` facade (+ Python cache, F20); DB 1 = cache store. → 04 §4.1\n- **`REDIS_CLIENT` (predis / phpredis)** — PHP Redis client; prod value unknown (A7) and decides F14. → 04 §4.1\n- **`QUEUE_CONNECTION` / `CACHE_DRIVER`** — default `sync` / `file` in code; prod very likely `redis` (A6). → 04 §4.1\n- **`RUN_SCHEDULER`** — env gate so only one box runs `schedule:run`. → 05 §5.1\n- **`BaseCommand`** — summary command base: dispatch one job per active org. → 01 §1.6\n- **`SummariesQuery`** — builds `updateOne` + `$set`/`$setOnInsert` upserts, so summary re-runs are idempotent. → 01 §1.6\n- **`SequentialJob` / `SequentialJobDispatcher` / `sequential_jobs`** — landlord export lane, one export at a time platform-wide (F24). → 01 B6, 07b R34\n- **`sequential:jobs`** — 4-hourly kick of the export lane. → 07b R34\n- **`Order::approveAfter` / `ApproveOrder`** — delayed auto-approval job, idempotent via `pending()`. → 01 B7, F10\n- **`BufferFeatureUsageListener` / `FlushFeatureEventsJob`** — Redis list buffer (RPUSH/LTRIM/EXPIRE) flushed every 15 min to Mongo `feature_usage_events`. → 04 §4.7\n- **`ScopeCacheToTenant`** — HTTP middleware that prefixes the cache per tenant; workers don't get it (F12). → 04 §4.4\n- **`EnsureTenantAccess`** — middleware that checks `Org.active` and stamps `tenant_id` into job payloads (dead on workers, F17). → 05 §5.5\n- **`TenantManager::tenant($org)->reconnect()`** — switches the `tenant` connection; a no-op in `testing`. → 05 §5.5\n- **`Org`** — landlord tenant model; `findById` cached `60*24*7` s ≈ 2.8 h (D12). → 04 §4.4\n- **`ReportCacheMacro`** — \"report already running\" guard key; split by the prefix (F12 → 429). → 04 §4.4\n- **`MatrixAggregator`** — the only stampede-protected cache (lock + double-checked remember). → 04 §4.5\n- **`SmsResendRun`** — template for a fixed-prefix cloned cache store. → 04 §4.4\n- **`ReportProgressUpdated` / `ReportNotification`** — `ShouldBroadcastNow` (sync Pusher call, F4) vs queued `ShouldBroadcast`. → 04 §4.8\n- **`SendApprovalNotificationJob`** — best job template (Org + arrays, reconnect, per-step try, `->afterCommit()`). → 05 §5.3\n- **`failed_jobs`** — Laravel failed-job table; no alert, no `queue:prune-failed` (R15). → 07b R15\n- **Supervisor programs** — `sokrio-kafka-consumer-tracking`, `sokrio-kafka-consumer-departments`, `sokrio-feature-tracking`; numprocs=1, `stopwaitsecs=35`, DD_* off. `[NOTES]` → 06 §6.7\n- **`pipeline.sh`** — server-side deploy script run over SSH by each GitHub workflow (A11). → 06 §6.1\n- **Boxes: prod \"all task\" VM, PVM, queue-worker VM, report VM, staging** — the deploy targets in `.github/workflows`. → 06 §6.1\n- **IFS / ERP shared-DB poll** — `customer_responses` / `sales_part` polled daily (05:40, 06:00). → 03 §3.3\n\n### Labs `labs/`\n- **`labs/compose.yml`** — 3 KRaft brokers `k1`–`k3` (`apache/kafka:3.7.0`) + Redis, project `-p t9lab`. → 09 §9.2\n- **`labs/bin/k.sh` / `labs/bin/php.sh`** — Kafka CLI inside a broker / PHP 8.3 in `memo-phptest:jpeg` with Sokrio `vendor/` read-only. → 09 §9.2\n- **`labs/laravel/artisan`** — ~10-line Laravel 9.52.22 console on Sokrio's vendor (`php artisan run <script>`). → 09 §9.2\n\n---\n\n## 10.4 Ids used across the deep dive\n\n### F — findings (code defects or risks found in this deep dive)\n- **F1** 🟡 `DepartmentSync` full resync is manual only; no safety net for lost department events. → 01 §1.5\n- **F2** 🟡 `Department::upsert()` (ERP code sync) bypasses the observer, so `erp_code` never reaches Mongo. → 01 §1.5\n- **F3** 🟢 `SecondaryOrderSummaryJob::uniqueId()` adds `rand()`, making `ShouldBeUnique` a no-op. → 01 §1.6\n- **F4** 🟡 `ReportProgressUpdated` is `ShouldBroadcastNow`: Pusher latency/outage hits the export job. → 01 §1.6\n- **F5** 🔴 Producer `acks=0`: \"success\" = socket write; broker rejections are silent. `[LAB]` → 02 §2.1, L2\n- **F6** 🟡 No `auto.offset.reset`: new group starts at 0; out-of-range jumps to `latest − 1`, skipping the gap. → 02 §2.3, R27\n- **F7** 🟡 phpkafka counts records and ignores `baseOffset`: mid-batch restart duplicates the head. `[LAB]` → 02 §2.3, L4\n- **F8** 🟡 Bulk department update publishes inside an open transaction → phantom events on rollback. → 02 §2.2\n- **F9** 🟡 Heartbeats only on fetch: a flush > 30 s → eviction → commit fails → batch replayed. `[LAB]` → 02 §2.3, L3\n- **F10** 🟡 Primary-order delayed approval runs on `default` with `$timeout = 0` (idempotent via `pending()`). → 03 §3.3\n- **F11** 🔴 `BulkStockImportJob` unique lock has no id and no TTL → other chunks/tenants silently dropped. `[LAB]` → 04 §4.3, R29, L8\n- **F12** 🟡 Web vs worker cache prefix split: guards, unique locks and `Org` invalidation miss across processes. `[LAB-T4]` → 04 §4.4, R35, L10\n- **F13** 🟡 Stock lock released before `DB::commit()` + read-modify-write → lost updates. → 04 §4.5\n- **F14** 🔴-if-phpredis predis-style `Redis::scan` finds 0 keys on phpredis → feature analytics never flushed. `[LAB]` → 04 §4.7, R30, L9\n- **F15** 🟢 `$candidate->lockForUpdate()` builds a query and never runs it → no row lock. → 04 §4.5\n- **F16** 🔴 Tenant models in job constructors are restored from the *previous* job's tenant DB. `[LAB-T5]` → 05 §5.5, R31, L11\n- **F17** 🟢 `EnsureTenantAccess` payload `tenant_id` stamp + listener exist only in HTTP → dead on workers. → 05 §5.5\n- **F18** 🟢 Kafka handlers cache `Org` per process ≤6 h with no `active` check. → 05 §5.5\n- **F19** 🟡 `[INFERENCE]` Stock upload on the `local` disk, job may run on another VM → silent no-op. → 06 §6.6, R32\n- **F20** 🟡 Python benchmark cache shares Redis DB 0 with Laravel queues. → 06 §6.5\n- **F21** 🟢 phpkafka SASL = PLAIN only → MSK IAM/SCRAM/Serverless impossible; TLS/mTLS only. → 06 §6.4\n- **F22** 🟡 Approval delays up to 60 min vs SQS 15-min cap (migration blocker, not a live bug). → 06 §6.8, R33, L13\n- **F23** 🟡 Deploy hygiene: unpinned `ssh-action@master`, password SSH on prod, PVM on the prod VM, no concurrency guard. → 06 §6.1\n- **F24** 🟡 `[INFERENCE]` Global export lane stuck behind a dead `processing` row. → 07b R34\n- **F25** 🟡→🔴 phpkafka replay loop: after a mid-batch restart the last batch is re-delivered on every poll. `[LAB]` → 09 L4\n\n### D — notes-vs-code conflicts (the code wins)\n- **D1** `''` instance id = static membership, not dynamic. → 00 §0.12\n- **D2** One group per topic (tracking legacy bare group), not one shared group. → 00 §0.12\n- **D3** Departments is live too, not only tracking. → 00 §0.12\n- **D4** Key = `user_id` / `department_id`, not always `tenant_id`. → 00 §0.12\n- **D5** Sync write is a fallback only (202), not a shadow write. → 00 §0.12\n- **D6** Department publish is enabled; the Mongo sync call is what's commented out. → 00 §0.12\n- **D7** Laravel 9.52.22, not 10. → 00 §0.12\n- **D8** `autoCommit=false` + per-flush manual commit, not `true`. → 00 §0.12\n- **D9** Fallback failure returns 503 + `Retry-After: 5`, not always 202. → 01 §1.7\n- **D10** No nightly department resync; `DepartmentSync` is manual (F1). → 01 §1.7\n- **D11** Departments have no sync fallback, and `upsert` never publishes (F2). → 01 §1.7\n- **D12** `Org` cache TTL ≈ 2.8 h, not a week. → 04 §4.0\n- **D13** One `afterCommit` site exists (`ApprovalNotifier.php:67`). → 05 §5.0\n- **D14** In-process `Org` cache (≤6 h) outlives the 2.8 h Redis TTL (F18). → 05 §5.0\n- **D15** Server Docker setup and `containerization/` are gone (`557e63d68`). → 05 §5.7\n- **D16** Kafka logs are daily `kafka-YYYY-MM-DD.log`, not `kafka.log`. → 05 §5.0\n- **D17** The devops skill's `docker-compose.prod.yml` AWS overlay doesn't exist. → 06 §6.0\n- **D18** `.docker/php/` is an empty untracked folder. → 06 §6.0\n- **D19** MySQL binlog is per server, not per tenant DB (Debezium cost). → 08b Q28\n- **D20** Laravel rate limiters are fixed-window, not sliding. → 08c Q47\n- **D21** The \"null start on both clients\" SCAN fix was wrong for predis; portable fix recorded. `[LAB]` → 09 L9\n\n### R — runbooks (8-field template)\n- **R1** Broker down / leader election / `acks=1` vs `all` · **R2** Lag on one hot partition · **R3** Rebalance loop · **R4** Poison message · **R5** Duplicate after crash before commit → 07a §7.1\n- **R6** Dual-write loss · **R7** Out-of-order events · **R8** Consumer memory leak / silent death · **R9** Deploy restarts consumers mid-message · **R10** Schema change breaks consumers → 07a §7.1\n- **R11** Redis full / eviction · **R12** Redis restart loses jobs (`:delayed`) · **R13** Job runs twice (`timeout >= retry_after`, `$timeout = 0`) `[LAB]` · **R14** Dispatched before commit · **R15** `failed_jobs` unwatched → 07b §7.4\n- **R16** Cache stampede · **R17** Lock expires mid-job · **R18** Noisy-neighbor tenant · **R19** RabbitMQ memory alarm (not applicable + Redis analog) · **R20** Network partition / AZ failure → 07b §7.4\n- **R21** RF=1 auto-created topic · **R22** `FENCED_INSTANCE_ID` from group sharing · **R23** EINTR from Datadog signals · **R24** Signal mid-DB-read → 07a §7.2\n- **R25** Department publish lost, no fallback · **R26** `acks=0` silent loss (F5) · **R27** Out-of-range → latest (F6) · **R28** Offset counting vs batch base (F7; now `[LAB]`, see F25) → 07a §7.2\n- **R29** F11 stock chunks dropped · **R30** F14 phpredis-blind flusher · **R31** F16 wrong-tenant models · **R32** F19 local-disk handoff → 07b §7.5\n- **R33** F22 SQS delay cap · **R34** F24 stuck export lane · **R35** F12 prefix split → 07b §7.5\n\n### AL — minimum alert set (T6 §6.9)\n- **AL1** Kafka consumer lag (> 5 min time lag). → 06 §6.9\n- **AL2** Queue depth / oldest-job age (`queue:monitor`, SQS `ApproximateAgeOfOldestMessage`). → 06 §6.9\n- **AL3** `failed_jobs` count in the last hour → Slack. → 06 §6.9\n- **AL4** Redis memory %, evictions, connections. → 06 §6.9\n- **AL5** Broker disk, offline and under-replicated partitions. → 06 §6.9\n- **AL6** Process liveness (Supervisor program state for consumers + workers). → 06 §6.9\n- **AL7** Scheduler heartbeat (`->thenPing()` dead-man's switch). → 06 §6.9\n\n### A — open assumptions (status in `_plan/MEMORY.md` §3)\n- **A1** Producer acks default — resolved: `acks=0` (F5). · **A2** `auto.offset.reset` — resolved: none (F6).\n- **A3** Prod topics RF=1 — open. · **A4** Kafka self-hosted on EC2, not MSK — open, leans yes. · **A5** Redis self-hosted, not ElastiCache — open, leans yes.\n- **A6** Prod `QUEUE_CONNECTION=redis`, `CACHE_DRIVER=redis` — very likely. · **A7** Prod `REDIS_CLIENT` — open, urgent (decides F14), leans phpredis.\n- **A8** Department observer publishes before commit — confirmed (F8). · **A9** Prod Redis `maxmemory` + `noeviction`, no AOF — open.\n- **A10** Which boxes run which `--queue`s; shared `storage/app`? — open (F19). · **A11** Does `pipeline.sh` restart workers and stop consumers gracefully? — open.\n- Questions for Komol: → 06 §6.11\n\n### L — labs (09 §9.3)\n- **L0** Smoke test · **L1** Kill a broker, RF=1 vs RF=3 · **L2** acks=0 swallows a rejection (F5) · **L3** Slow consumer → eviction → replay (F9)\n- **L4** Counted offsets after a mid-batch restart → replay loop (F7, F25) · **L5** Duplicate, then idempotent insert · **L6** `retry_after` double run (R13)\n- **L7** Redis OOM vs eviction policies (R11, A9) · **L8** Unique lock drops chunks (F11) · **L9** SCAN on two clients + corrected fix (F14, D21)\n- **L10** Prefix split (F12, `[LAB-T4]`) · **L11** Wrong-tenant model restore (F16, `[LAB-T5]`) · **L12** Run Sokrio against the lab cluster · **L13** SQS delay cap with LocalStack (F22, not run)\n\n### B — business flows (01 §1.2)\n- **B1** GPS tracking (Kafka) · **B2** Department master data → Mongo (Kafka) · **B3** Sales/KPI summaries (scheduler → `summary` queue)\n- **B4** Feature-usage analytics (Redis buffer) · **B5** Realtime notifications (Pusher) · **B6** Deferred exports (`sequential` lane)\n- **B7** Delayed order approval (`order-approved`) · **B8** Planned order/delivery summary events (commented out)\n\n### P / C — producers and consumers (00 §0.4–0.5)\n- **P1** Tracking v1 single point · **P2** Tracking v2 bulk · **P3** `DepartmentChangeObserver` · **P4** `OrderObserver` (commented) · **P5** `DeliveryObserver` (commented)\n- **C1** `kafka:consume tracking` → `TrackingMessageHandler` · **C2** `kafka:consume departments` → `DepartmentMessageHandler`\n\n### Q — interview questions (08a–08e)\n- **Q1–Q5** foundations · **Q6–Q11** delivery guarantees · **Q12–Q19** Kafka internals → 08a\n- **Q20–Q28** Kafka ops · **Q29–Q37** RabbitMQ → 08b\n- **Q38–Q47** Redis · **Q48–Q50** comparisons · **Q51–Q57** stream processing → 08c\n- **Q58–Q63** patterns · **Q64–Q68** Laravel/PHP · **Q69–Q75** system design · **Q76–Q81** incidents → 08d\n- **Q82–Q106** new Sokrio-derived questions · STAR story §8.14 · Designs 1–3 §8.15 → 08e\n\n### T — task cards (`_plan/PLAN.md`)\n- **T0** inventory · **T1** architecture · **T2** Kafka · **T3** RabbitMQ · **T4** Redis · **T5** Laravel · **T6** AWS · **T7** failure modes · **T8a–e** Q&A · **T9** study plan + labs · **T10** this glossary · **T11** HTML page · **T12** final QA\n\n---\n\n### ✅ Quality check\n- [x] Every id family used in 00–09 is listed: F1–F25, D1–D21, R1–R35, AL1–AL7, A1–A11, L0–L13, B1–B8, P1–P5, C1–C2, Q1–Q106, T0–T12, each with the section where it lives\n- [x] General terms cover the acronyms harvested from the sections (ISR, HW, LEO, LSO, KRaft, EOS, CDC, DLQ/DLX/DLT, ECST, CQRS, CAP/PACELC, URP, ELR, LRU/LFU, AOF/RDB, PEL, RPO/RTO, SASL, KIP…)\n- [x] Sokrio components and config/env names point back to their section; env vars are names only\n- [x] One line per entry, alphabetical within §10.2; no new code reads, so no new findings or conflicts\n- [x] No secrets, hosts or IPs\n"}]</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
(function () {
  "use strict";
  const DOCS = JSON.parse(document.getElementById("docs").textContent);
  const TAGS = ["CODE", "LIB", "GENERAL", "INFERENCE", "ASSUMPTION", "LAB", "NOTES", "HIST"];
  const TAG_RE = new RegExp("\\[(" + TAGS.join("|") + ")\\]|(🟢|🟡|🔴)", "g");
  const REF_RE = /^[\w@~.\/-]+\.[A-Za-z]{1,5}:\d+([-–,:]\d+)*$/;
  const LABELS = ["Short answer", "Deep answer", "Sokrio example", "Follow-up questions", "Common mistakes"];
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  };

  // ---------- theme ----------
  const root = document.documentElement;
  const savedTheme = store.get("mdd-theme", null);
  if (savedTheme) root.setAttribute("data-theme", savedTheme);
  const isDark = () => root.getAttribute("data-theme") === "dark" ||
    (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);

  // ---------- render ----------
  const used = new Set();
  const slug = (s) => {
    let base = s.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-").slice(0, 60) || "s";
    let id = base, i = 2;
    while (used.has(id)) id = base + "-" + i++;
    used.add(id);
    return id;
  };

  marked.setOptions({ gfm: true });
  const content = $("#content");
  const cards = [];

  DOCS.forEach((d) => {
    const sec = document.createElement("section");
    sec.className = "doc";
    sec.innerHTML = marked.parse(d.md);
    content.appendChild(sec);

    $$("h1, h2, h3", sec).forEach((h) => { h.id = slug(h.textContent); });
    $$("table", sec).forEach((t) => {
      const w = document.createElement("div"); w.className = "table-wrap";
      t.replaceWith(w); w.appendChild(t);
    });
    $$("pre > code.language-mermaid", sec).forEach((c) => {
      const w = document.createElement("div");
      w.className = "mermaid-wrap";
      w.dataset.src = c.textContent;
      c.parentElement.replaceWith(w);
    });
    buildCards(sec, d.file);
    decorate(sec);
  });

  function buildCards(sec, file) {
    const sectionTitle = $("h1", sec) ? $("h1", sec).textContent : file;
    $$(":scope > h3", sec).forEach((h) => {
      const m = h.textContent.match(/^Q(\d+)\./);
      if (!m) return;
      const n = +m[1];
      const nodes = [];
      for (let el = h.nextElementSibling; el && !/^(H1|H2|H3|HR)$/.test(el.tagName); el = el.nextElementSibling) nodes.push(el);

      const card = document.createElement("div");
      card.className = "qcard";
      card.dataset.q = n;
      h.replaceWith(card);
      const head = document.createElement("div");
      head.className = "qhead";
      head.appendChild(h);
      const lbl = document.createElement("label");
      lbl.className = "knownBox";
      lbl.innerHTML = '<input type="checkbox"> known';
      head.appendChild(lbl);
      card.appendChild(head);

      let target = card, shortBody = null;
      nodes.forEach((el) => {
        const st = el.tagName === "P" && el.firstChild && el.firstChild.nodeName === "STRONG" ? el.firstChild : null;
        const label = st && st.textContent.replace(/:\s*$/, "");
        if (st && /:\s*$/.test(st.textContent) && LABELS.some((l) => label.startsWith(l))) {
          const det = document.createElement("details");
          const sum = document.createElement("summary");
          sum.textContent = label;
          det.appendChild(sum);
          card.appendChild(det);
          el.removeChild(st);
          if (el.textContent.trim()) det.appendChild(el);
          target = det;
          if (label.startsWith("Short answer")) shortBody = det;
          return;
        }
        target.appendChild(el);
      });
      cards.push({ n, card, title: h.textContent, section: sectionTitle, short: shortBody });
    });
  }

  function decorate(sec) {
    $$("code", sec).forEach((c) => {
      if (c.closest("pre")) return;
      const t = c.textContent.trim();
      const tm = t.match(/^\[([A-Z]+)\]$/);
      if (tm && TAGS.includes(tm[1])) { c.replaceWith(badge(tm[1])); return; }
      if (REF_RE.test(t)) c.classList.add("ref");
    });
    const walker = document.createTreeWalker(sec, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => n.parentElement.closest("pre, code, .mermaid-wrap") ? NodeFilter.FILTER_REJECT
        : (TAG_RE.lastIndex = 0, TAG_RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP)
    });
    const hits = [];
    while (walker.nextNode()) hits.push(walker.currentNode);
    hits.forEach((node) => {
      const frag = document.createDocumentFragment();
      let last = 0;
      node.nodeValue.replace(TAG_RE, (m, tag, emo, idx) => {
        frag.appendChild(document.createTextNode(node.nodeValue.slice(last, idx)));
        if (tag) frag.appendChild(badge(tag));
        else {
          const s = document.createElement("span");
          s.className = "chip " + ({ "🟢": "g", "🟡": "y", "🔴": "r" })[emo];
          s.textContent = emo;
          frag.appendChild(s);
        }
        last = idx + m.length;
        return m;
      });
      frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
      node.replaceWith(frag);
    });
  }

  function badge(tag) {
    const b = document.createElement("span");
    b.className = "badge " + tag;
    b.textContent = tag;
    return b;
  }

  // ---------- mermaid ----------
  let mmSeq = 0;
  async function renderMermaid() {
    mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "default", securityLevel: "strict" });
    for (const w of $$(".mermaid-wrap")) {
      try {
        const { svg } = await mermaid.render("mm" + (++mmSeq), w.dataset.src);
        w.innerHTML = svg;
      } catch (e) {
        w.innerHTML = "";
        const p = document.createElement("pre");
        p.className = "mermaid-err";
        p.textContent = "Diagram failed to render: " + (e && e.message ? e.message : e) + "\n\n" + w.dataset.src;
        w.appendChild(p);
      }
    }
  }

  // ---------- TOC + scrollspy ----------
  const toc = $("#toc");
  const tocLinks = new Map();
  $$(".doc").forEach((sec) => {
    const h1 = $("h1", sec);
    if (!h1) return;
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = h1.textContent.replace(/ — .*/, "");
    sum.title = h1.textContent;
    det.appendChild(sum);
    const ul = document.createElement("ul");
    const add = (h, text) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = text;
      li.appendChild(a); ul.appendChild(li);
      tocLinks.set(h.id, a);
    };
    add(h1, "Overview");
    $$(":scope > h2", sec).forEach((h2) => add(h2, h2.textContent));
    det.appendChild(ul);
    toc.appendChild(det);
  });

  // Scrollspy: the active entry is the last TOC heading above the header line.
  // Scroll-based (not IntersectionObserver) so long jumps still update it.
  const spyHeads = Array.from(tocLinks.keys()).map((id) => document.getElementById(id));
  let spyActive = null, spyQueued = false;
  function spy() {
    spyQueued = false;
    let lo = 0, hi = spyHeads.length - 1, idx = 0;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (spyHeads[mid].getBoundingClientRect().top < 90) { idx = mid; lo = mid + 1; } else hi = mid - 1;
    }
    const a = tocLinks.get(spyHeads[idx].id);
    if (a === spyActive) return;
    if (spyActive) spyActive.classList.remove("active");
    a.classList.add("active");
    spyActive = a;
    const det = a.closest("details");
    if (!det.open) { $$("details[open]", toc).forEach((x) => { x.open = false; }); det.open = true; }
    if (results.hidden) a.scrollIntoView({ block: "nearest" });
  }
  addEventListener("scroll", () => { if (!spyQueued) { spyQueued = true; requestAnimationFrame(spy); } }, { passive: true });

  toc.addEventListener("click", (e) => { if (e.target.closest("a")) document.body.classList.remove("nav-open"); });
  $("#menuBtn").onclick = () => document.body.classList.toggle("nav-open");
  $("#scrim").onclick = () => document.body.classList.remove("nav-open");

  // ---------- known tracker ----------
  let known = new Set(store.get("mdd-known", []));
  const progress = $("#progress");
  function syncKnown() {
    cards.forEach((c) => {
      const k = known.has(c.n);
      c.card.classList.toggle("known", k);
      $(".knownBox input", c.card).checked = k;
    });
    progress.innerHTML = "<b>" + known.size + "</b> / " + cards.length + '<span class="lbl"> known</span>';
    store.set("mdd-known", Array.from(known));
  }
  function setKnown(n, v) { v ? known.add(n) : known.delete(n); syncKnown(); }
  cards.forEach((c) => {
    $(".knownBox input", c.card).addEventListener("change", (e) => setKnown(c.n, e.target.checked));
  });
  syncKnown();

  let expanded = false;
  $("#expandBtn").onclick = () => {
    expanded = !expanded;
    $$(".qcard details").forEach((d) => { d.open = expanded; });
  };

  // ---------- search ----------
  const units = [];
  $$(".doc").forEach((sec) => {
    const secTitle = $("h1", sec) ? $("h1", sec).textContent.split(" — ")[0] : "";
    let cur = null;
    Array.from(sec.children).forEach((el) => {
      if (/^H[123]$/.test(el.tagName) || el.classList.contains("qcard")) {
        const h = el.classList.contains("qcard") ? $("h3", el) : el;
        cur = { el, sec: secTitle, title: h.textContent, text: el.textContent };
        units.push(cur);
        if (el.classList.contains("qcard")) cur = null;
      } else if (cur) {
        cur.text += "\n" + el.textContent;
      }
    });
  });
  units.forEach((u) => { u.lt = u.text.toLowerCase(); u.ltt = u.title.toLowerCase(); });

  const results = $("#results");
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  let tmr;
  $("#search").addEventListener("input", (e) => { clearTimeout(tmr); tmr = setTimeout(() => runSearch(e.target.value), 140); });

  function runSearch(q) {
    const terms = q.toLowerCase().split(/\s+/).filter((t) => t.length > 1);
    if (!terms.length) { results.hidden = true; toc.hidden = false; return; }
    const hits = units.filter((u) => terms.every((t) => u.lt.includes(t)))
      .map((u) => ({ u, score: terms.reduce((s, t) => s + (u.ltt.includes(t) ? 10 : 0), 0) - u.text.length / 1e5 }))
      .sort((a, b) => b.score - a.score).slice(0, 60);
    const hl = new RegExp("(" + terms.map(reEsc).join("|") + ")", "gi");
    results.innerHTML = '<div class="resHead">' + hits.length + (hits.length === 60 ? "+" : "") + " results</div>";
    hits.forEach(({ u }, i) => {
      const at = u.lt.indexOf(terms[0]);
      const snip = (at > 60 ? "…" : "") + u.text.slice(Math.max(0, at - 60), at + 120).replace(/\s+/g, " ") + "…";
      const a = document.createElement("a");
      a.className = "res"; a.href = "#";
      a.innerHTML = "<b>" + esc(u.title).replace(hl, "<mark>$1</mark>") + "</b><span>" + esc(u.sec) + "</span><span>" +
        esc(snip).replace(hl, "<mark>$1</mark>") + "</span>";
      a.onclick = (ev) => { ev.preventDefault(); goTo(u.el, true); document.body.classList.remove("nav-open"); };
      results.appendChild(a);
    });
    results.hidden = false; toc.hidden = true;
  }

  function goTo(el, open) {
    if (open && el.classList.contains("qcard")) $$("details", el).forEach((d) => { d.open = true; });
    let d = el.closest("details");
    while (d) { d.open = true; d = d.parentElement.closest("details"); }
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  // ---------- quiz ----------
  const quiz = $("#quiz");
  let qCur = null, qLast = null;
  function nextQuestion() {
    const onlyUnknown = $("#quizOnlyUnknown").checked;
    let pool = cards.filter((c) => !onlyUnknown || !known.has(c.n));
    if (pool.length > 1) pool = pool.filter((c) => c !== qLast);
    $("#quizAnswer").hidden = true;
    $("#quizKnew").hidden = $("#quizLearn").hidden = true;
    $("#quizReveal").hidden = false;
    if (!pool.length) {
      qCur = null;
      $("#quizSection").textContent = "";
      $("#quizQ").textContent = "🎉 Every question is marked known. Untick “only unknown” to keep practising.";
      $("#quizReveal").hidden = true;
      return;
    }
    qCur = qLast = pool[Math.floor(Math.random() * pool.length)];
    $("#quizSection").textContent = qCur.section.split(" — ")[0] + " · " + (known.size) + "/" + cards.length + " known";
    $("#quizQ").textContent = qCur.title;
  }
  function openQuiz() { quiz.classList.add("open"); nextQuestion(); $("#quizReveal").focus(); }
  function closeQuiz() { quiz.classList.remove("open"); }
  $("#quizBtn").onclick = openQuiz;
  $("#quizClose").onclick = closeQuiz;
  quiz.addEventListener("click", (e) => { if (e.target === quiz) closeQuiz(); });
  $("#quizOnlyUnknown").onchange = nextQuestion;
  $("#quizSkip").onclick = nextQuestion;
  $("#quizReveal").onclick = () => {
    if (!qCur) return;
    const box = $("#quizAnswer");
    box.innerHTML = "";
    if (qCur.short) Array.from(qCur.short.children).forEach((c) => { if (c.tagName !== "SUMMARY") box.appendChild(c.cloneNode(true)); });
    else box.textContent = "(No short answer found — open the card in the page.)";
    box.hidden = false;
    $("#quizReveal").hidden = true;
    $("#quizKnew").hidden = $("#quizLearn").hidden = false;
  };
  $("#quizKnew").onclick = () => { setKnown(qCur.n, true); nextQuestion(); };
  $("#quizLearn").onclick = () => { setKnown(qCur.n, false); nextQuestion(); };
  $("#quizGo").onclick = () => { if (qCur) { closeQuiz(); goTo(qCur.card, true); } };

  // ---------- keys ----------
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (quiz.classList.contains("open")) closeQuiz();
      else if (document.activeElement === $("#search")) { $("#search").value = ""; runSearch(""); $("#search").blur(); }
    } else if (e.key === "/" && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
      e.preventDefault(); $("#search").focus();
    }
  });

  $("#themeBtn").onclick = () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    store.set("mdd-theme", next);
    renderMermaid();
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!root.getAttribute("data-theme")) renderMermaid(); });

  renderMermaid().then(() => {
    if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t) goTo(t, false); }
    spy();
  });
})();
</script>
</body>
</html>
