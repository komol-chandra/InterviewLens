-export guards (1 h), Org cache invalidation (up to ~2.8 h, including the `active` flag), the sequential-export lock, and unique locks taken in a request | 🟡 | §4.4, `[LAB]` |\n| **F13** | `StockUpdateController` releases its per-stock Redis lock **before the DB transaction commits**, so two challans for the same stock row can lose an update | 🟡 | §4.5 |\n| **F14** | The feature-tracking flusher finds **zero keys under phpredis** (Laravel's default client). Its variadic `SCAN` call only works on predis. If prod runs phpredis, all feature analytics expire unflushed | 🔴 if phpredis | §4.7, `[LAB]` |\n| **F15** | `SequentialJobDispatcher` calls `$candidate->lockForUpdate()` on a model instance. That builds a query and never runs it, so the DB row lock is a no-op | 🟢 | §4.5 |\n\n- `[CODE]` The code is written to survive both clients (it catches `Predis\\…` and `\\RedisException` side by side, `app/Models/Core/Org.php:21-22,58`, `app/Services/Kafka/TopicProvisioner.php:88-98`), so the code alone can't settle **A7 (predis vs phpredis)**. F14 makes A7 urgent.\n- `[INFERENCE]` **A6 is now very likely true** (prod `CACHE_DRIVER=redis`). `ScopeCacheToTenant` only works on stores with `setPrefix()`, and the file store has none (`app/Http/Middleware/ScopeCacheToTenant.php:71-76`). The comments in `SmsResendRun.php:197-201` and `FlushFeatureEventsJob.php:21-23` assume Redis DB 1, and there is a test for the Redis OOM error (`tests/Unit/Kafka/KafkaProducerTest.php:231`).\n\n---\n\n## 4.1 One Redis, many jobs — the map\n\n### Config facts\n| Setting | Value | Ref |\n|---|---|---|\n| Client | `env('REDIS_CLIENT', 'phpredis')`. `predis/predis ^1.1` is also in composer | `config/database.php:195`, `composer.json:31` |\n| DB 0 (`default` connection) | queues, feature buffer, `Redis::` facade calls, Redis broadcaster (unused) | `config/database.php:202-210` |\n| DB 1 (`cache` connection) | cache store, locks, unique locks, rate limiters, sessions (if `SESSION_DRIVER=redis`) | `config/database.php:212-220`, `config/cache.php:74-77` |\n| Key prefix (client level) | `REDIS_PREFIX`, default `{app}_database_` | `config/database.php:199` |\n| Cache prefix (store level) | `CACHE_PREFIX`, default `{app}_cache`, re-pointed per request (§4.4) | `config/cache.php:101` |\n| `read_write_timeout` | 180 s on both connections | `config/database.php:208,218` |\n| Code defaults | cache `file`, session `file`, queue `sync`, broadcast `null` | `config/cache.php:21`, `config/session.php:21`, `config/queue.php:16`, `config/broadcasting.php:18` |\n| `.env.example` | `CACHE_DRIVER=file`, `QUEUE_CONNECTION=sync`, `REDIS_CLIENT=` (empty) | `.env.example:23-26,51` |\n| Tests | cache `array`, queue `sync`, session `array` | `phpunit.xml:35-38` |\n\n- `[LIB]` An **empty** `REDIS_CLIENT=` is not the same as an unset one. `env()` returns `''`, and `RedisManager::connector()` returns `null` for an unknown driver (`vendor/laravel/framework/src/Illuminate/Redis/RedisManager.php:171-175`), so the first Redis call fails. Prod must set it explicitly or remove the line. If it's removed, the client is phpredis.\n- `[ASSUMPTION]` One Redis instance, self-hosted (A5). Both connections read the same `REDIS_HOST`/`REDIS_PORT`, so `maxmemory` and eviction are **shared** by queues and cache (§4.9).\n\n### Key families\n```mermaid\nflowchart LR\n    subgraph DB0[\"Redis DB 0 · prefix {app}_database_\"]\n        Q[\"queues:{name} (list)\\nqueues:{name}:delayed (zset)\\nqueues:{name}:reserved (zset)\\nqueues:{name}:notify (list)\"]\n        FB[\"feature_tracking:buffer:{tenant} (list)\\nfeature_tracking:flushing:{tenant} (list)\\nfeature_tracking:pending_count\"]\n    end\n    subgraph DB1[\"Redis DB 1 · prefix {app}_cache[:tenant_N | :landlord]\"]\n        C[\"cache: org_by_domain_*, org_by_id_*,\\npgm:agg:v3:*, report_lock:*, report_ref:*, …\"]\n        L[\"locks: kpi_summary_lock:*, *_stock_update_*,\\nvan_*, sms-resend:*, custom-jobs:one-at-a-time,\\nlock:pgm:agg:*\"]\n        U[\"laravel_unique_job:{Class}{uniqueId}\"]\n        RL[\"rate limiter counters + :timer keys\"]\n        S[\"sessions (if SESSION_DRIVER=redis)\"]\n    end\n    W[web request] --> C & L & RL & S\n    J[queue worker] --> Q & FB & C & L & U\n    Sch[scheduler] --> Q & U\n```\n\n---\n\n## 4.2 The queue driver\n\n### How a Laravel Redis queue really works `[LIB]`\nA job isn't \"in a queue\". It moves between four keys (`vendor/laravel/framework/src/Illuminate/Queue/RedisQueue.php`):\n\n```mermaid\nstateDiagram-v2\n    [*] --> ready: dispatch() → RPUSH queues#58;X\n    [*] --> delayed: delay() → ZADD queues#58;X#58;delayed (score = available_at) #58;193-196\n    delayed --> ready: worker pop → migrate() moves due jobs #58;244-249\n    ready --> reserved: Lua pop → ZADD queues#58;X#58;reserved (score = now + retry_after) #58;275-286\n    reserved --> [*]: success → ZREM #58;305\n    reserved --> delayed: exception + tries left → release(backoff) #58;321\n    reserved --> ready: worker died / still running after retry_after → migrate #58;249\n    reserved --> failed_jobs: tries exhausted\n```\n\n- `[LIB]` **`retry_after` is not a timeout.** It's the moment Redis assumes the worker is dead and hands the job to someone else. If the first worker is still running, you get two copies running at once.\n- `[CODE]` Sokrio uses **`retry_after = 9000`** (2.5 h) for every queue on the one `redis` connection (`config/queue.php:65`). That's large enough for the slowest report, but it means a crashed job comes back **2.5 h later**.\n- `[CODE]` `block_for = null` (`config/queue.php:66`), so workers poll: an empty pop sleeps `--sleep` seconds (README uses `--sleep=1`, `README.md:173`). No `BLPOP` on `:notify`.\n\n### Queues in use\n| Queue | Producers | Notes |\n|---|---|---|\n| `summary` | ~20 summary jobs from `BaseCommand` fan-out, `KPISummary` (`app/Jobs/KPISummary.php:67`) | Hourly/daily, per tenant (T1) |\n| `default` | Anything without `onQueue`: primary-order delayed approval (F10), `ResendFailedSmsBatch`, queued broadcasts (§4.8), most jobs | Shared catch-all |\n| `feature-tracking` | `BufferFeatureUsageListener` (`:13`), `FlushFeatureEventsJob` (`:39`) | §4.7 |\n| `order-approved` | Secondary `ApproveOrder` delayed by N minutes (`app/Models/Order/Order.php:240-243`) | Delayed zset |\n| `sequential` | `SequentialJobDispatcher` exports (`config/deferred-jobs.php:19`) | One-at-a-time (§4.5) |\n\n### `retry_after` vs job timeouts\n| Job class | `$timeout` | vs `retry_after` 9000 | Risk |\n|---|---|---|---|\n| GenerateAdvanceInvoicePDF, GenerateVisitTargetReport, StockReport, GenerateTrackingReport, GenerateOrderProductSummery, `PrimaryOrder\\ApproveOrder` (F10) | **0** (no alarm) | A run over 2.5 h is redelivered while still running | Double run (T7 risk 3) |\n| `KPISummary` | 1800 | OK | Blocks a worker up to 1740 s waiting for its lock (§4.5) |\n| `SecondaryOrderSummaryJob` | 900 | OK | — |\n| `FlushFeatureEventsJob` | 240 | OK | — |\n| Jobs with no `$timeout` | worker `--timeout` (default 60) | OK | Killed at 60 s if the worker CLI doesn't raise it |\n\n- `[LIB]` `$timeout = 0` disables the alarm: `Worker::timeoutForJob()` returns 0 and `pcntl_alarm(0)` cancels it (`vendor/…/Queue/Worker.php:229-254`).\n- `[CODE]` **Ignored properties:** `ApproveOrder::$retry_after = 600` (`app/Jobs/ApproveOrder.php:26`) and `PrimaryOrderSummaryMongoDBJob::$retries`. Laravel reads `retry_after` only from the connection config and `$tries` (not `$retries`) from the job.\n- `[CODE]` **Workers:** the only documented Supervisor program is `sokrio-feature-tracking`: `queue:work --queue=feature-tracking,default --sleep=1 --tries=3 --max-jobs=1000` (`README.md:179`). The comma list is a **strict priority**: `default` only gets served when `feature-tracking` is empty. Programs for `summary`, `order-approved` and `sequential` are not in the repo (open question from T3).\n- `[CODE]` No Horizon (T0). So there are no queue metrics, no per-queue autoscaling and no wait-time alerts. `failed_jobs` in MySQL is the only failure record (`config/queue.php:82-86`).\n\n**What could go wrong**\n- `[INFERENCE]` A worker OOM-killed or SIGKILLed mid-job (deploy without `queue:restart`, Supervisor `stopwaitsecs` too short) leaves the job in `:reserved`. It reappears 2.5 h later, so a delayed approval that should have run at 10:05 runs at 12:35.\n- `[INFERENCE]` A Redis restart without persistence wipes `:delayed`. **Pending delayed approvals disappear**, and the orders stay pending forever. There is no DB-side sweeper (§4.9).\n- `[GENERAL]` Fix pattern: a second connection `redis-short` with `retry_after = 360` for short jobs (approvals, flush, SMS), and keep `redis` at 9000 only for long reports. Give every job a real `$timeout < retry_after`.\n\n---\n\n## 4.3 Unique jobs (`ShouldBeUnique`)\n\n### Mechanism `[LIB]`\n`PendingDispatch::__destruct()` calls `shouldDispatch()` → `UniqueLock::acquire()` (`vendor/…/Foundation/Bus/PendingDispatch.php:157-165,186-195`):\n- key = `laravel_unique_job:` + class + `uniqueId()` (`Bus/UniqueLock.php:67-73`)\n- TTL = `uniqueFor` (0 means **no expiry**: `SETNX` instead of `SET … EX`, `Cache/RedisLock.php:38-40`)\n- store = the **default cache store** unless the job defines `uniqueVia()` (`UniqueLock.php:39-41`)\n- If the lock is taken, the dispatch is **silently skipped**: no exception, no log.\n- The worker force-releases it after the job finishes or fails for good (`Queue/CallQueuedHandler.php:202-205`).\n\n### The five implementers\n| Job | `uniqueId` | `uniqueFor` | Verdict |\n|---|---|---|---|\n| `KPISummary` | `{db}_{type}_{date}` (`:42-45`) | 86400 (`:55-58`) | ✅ intentional day-long window |\n| `UserSalesSummaryJob` | yes | method | ✅ |\n| `FlushFeatureEventsJob` | `flush-feature-events` (`:42-45`) | 300 > `$timeout` 240 (`:24-28`) | ✅ textbook: the lock outlives the run |\n| `SecondaryOrderSummaryJob` | appends `rand(1000,9999)` (`:40-43`) | — | 🟡 F3: uniqueness is a no-op |\n| `Stock\\BulkStockImportJob` | **none** | **none** | 🔴 **F11** |\n\n### F11 — bulk stock import chunks dropped\n- `[CODE]` `app/Jobs/Stock/BulkStockImportJob.php:30` implements `ShouldBeUnique` with no `uniqueId`/`uniqueFor`. Its constructor takes `path, rows, startingRowNumber, org, …` (`:62-71`), so the author clearly meant one job **per chunk**.\n- `[CODE]` `BulkStockBatchImportJob` splits the CSV into 30 000-row chunks (`app/Jobs/Stock/BulkStockBatchImportJob.php:20`) and calls `dispatch($job)` for each in a loop (`:104-107`).\n- `[LAB]` Reproduced with Laravel's own `UniqueLock` on a throwaway Redis:\n  ```\n  dispatch beol chunk 1 -> queued\n  dispatch beol chunk 2 -> DROPPED\n  dispatch pvm chunk 1 -> DROPPED\n  TTL of lock key: -1  (-1 = never expires)\n  ```\n- **Impact.** Files over 30 000 rows lose every row after the first chunk, and the last chunk (which deletes the upload, `:74-79,169`) never runs. While any tenant's chunk is queued or running (up to `$timeout` 600 s), **every other tenant's stock import is dropped**. If a worker dies holding that job, the lock lives until the job is redelivered 2.5 h later. If the job is lost entirely (Redis flush), the lock is permanent and nobody can import until someone deletes the key. Users see \"upload accepted\", and nothing happens.\n- `[CODE]` A one-off repair command for duplicate bulk-stock rows exists (`app/Console/Commands/CleanupDuplicateBulkStockImport.php:16`). That suggests `ShouldBeUnique` was added to stop duplicates (git: `b6b46e155`). The real fix is `uniqueId() = \"{$this->org->id}:{$this->uploadId}:{$this->startingRowNumber}\"` plus `uniqueFor = 3600`.\n\n---\n\n## 4.4 Cache\n\n### Tenant scoping: `ScopeCacheToTenant` `[CODE]`\nA global middleware (`app/Http/Kernel.php:19`) reads the subdomain and re-points the **already-built** cache store's prefix (and the session handler's) in place (`app/Http/Middleware/ScopeCacheToTenant.php:37-69`):\n- reserved subdomain → `{CACHE_PREFIX}:landlord`\n- tenant → `{CACHE_PREFIX}:tenant_{id}`\n- `[CODE]` It only works on stores with `setPrefix()` (`:71-76`). The file store has none. That's why the rate limiter adds its own tenant scope to its keys (`app/Providers/RouteServiceProvider.php:44-61,253-270`).\n- `[CODE]` **Workers, the scheduler and Kafka consumers never pass through middleware**, so they always use the bare `{CACHE_PREFIX}:`. Added 2026-08-10 (`ff97230d4`).\n\n### F12 — the prefix-split family\n> **Update (T12, 2026-10-29):** on `master`, `ScopeCacheToTenant::tenantPrefix($orgId)` lets landlord code forget one tenant key (`{domain}.module.all`, `9d3d42cd6`). Every other cross-context key below still leaks.\n\n```mermaid\nsequenceDiagram\n    participant Web as Web request (tenant 7)\n    participant R as Redis DB1\n    participant Wk as Queue worker\n    Web->>R: SET sokrio_cache:tenant_7:report_lock:abc (TTL 1h)\n    Web->>R: SET sokrio_cache:tenant_7:report_ref:… → lock key\n    Web->>Wk: dispatch export job\n    Wk->>R: GET sokrio_cache:report_ref:…  → (nil)  ❌ wrong namespace\n    Note over Wk: removeCache() does nothing\n    Web->>R: user re-exports → ADD report_lock:abc fails → 429 for up to 1 h\n```\n\n| Site | Written in | Cleared in | Effect | Ref |\n|---|---|---|---|---|\n| `ReportCacheMacro` export guard | 16 report controllers (`setCache`) | 17 export jobs (`removeCache`) | Same export blocked with 429 until the TTL (default 3600 s) instead of on completion | `app/Support/Macros/ReportCacheMacro.php:24-57` |\n| Unique locks from a request | `PendingDispatch` in HTTP | `CallQueuedHandler` in worker | Lock lives for its full `uniqueFor`; **forever** if 0. Today only `KPISummary` via the admin daily report (`Admin/DailyReportController.php:81`), so 24 h, which is benign | `[LAB]` \"DROPPED (stale tenant-prefixed lock)\" |\n| `custom-jobs:one-at-a-time` | `SequentialJob::put` (HTTP) | export jobs' `dispatchNext` (worker) | Two different locks, so \"one at a time\" isn't enforced across request vs worker, or across tenants | `app/Support/Dispatcher/SequentialJobDispatcher.php:15` |\n| Org lookup cache | everywhere | `Org::updated` hook, in the admin request's namespace only | Other copies stay up to **~2.8 h** (see below) | `app/Models/Core/Org.php:45-48,57,72` |\n\n- `[CODE]` **The one correct site is `SmsResendRun`.** It clones the store and pins a fixed prefix `sms-resend-run:`, so the request and the worker see the same key, and it puts the org id in the key (`app/Services/SMS/SmsResendRun.php:24-25,192-214`). **That's the template for the fix:** a `Cache::cross()` helper (or a second `redis-shared` store) for every key that crosses the request/worker boundary.\n\n### Org lookups: `findByDomain` / `findById`\n- `[CODE]` `Cache::remember(…, 60*24*7)` with a DB fallback when Redis is down (`app/Models/Core/Org.php:51-80`). Good resilience: tenant resolution keeps working through a Redis outage.\n- `[LIB]` **The TTL is 10 080 s ≈ 2.8 h, not a week.** Since Laravel 5.8 an integer TTL is in seconds, and `60*24*7` is minutes-per-week arithmetic. The code comments believe it's a week (`app/Services/Kafka/Handlers/TrackingMessageHandler.php:27`, \"Redis-cached for a week\"). That's conflict **D12**. It's harmless (a shorter TTL means fresher data and only a few more DB lookups), but if a week was intended, use `now()->addWeek()`.\n- `[CODE]` The same org is cached under several namespaces:\n  - `{p}:org_by_domain_*`: `ScopeCacheToTenant` itself (before it sets the prefix, `:43`) and `AuthServiceProvider:65`\n  - `{p}:tenant_N:org_by_domain_*`: `EnsureTenantAccess:24`, which **checks `active`** (`:26-29`)\n  - `{p}:org_by_id_*`: Kafka handlers (`TrackingMessageHandler.php:167`, `DepartmentMessageHandler.php:165`)\n- `[INFERENCE]` `OrgController::update` (deactivate) forgets only its own namespace. So **a deactivated tenant keeps passing `EnsureTenantAccess` for up to ~2.8 h**. Its tokens are truncated at deactivation (`Admin/OrgController.php:37-40`), but a fresh login goes through cached checks. Verify on staging: deactivate a tenant, then call any tenant API with a new token. Fix: forget all namespaces in `Org::updated`, or put org keys on the fixed-prefix store.\n\n### Stampede protection\n- `[CODE]` **`MatrixAggregator` is the model to copy** (`app/Services/Report/ProductGeographyMatrix/MatrixAggregator.php:162-174`): it checks the cache, then takes `lock:{key}` (90 s), waits up to 60 s, and calls `Cache::remember` again inside the lock (double-checked). The query is capped at 60 s (`MAX_TIME_MS`, `:26`) so it ends before the lock (90 s, `:27`) expires. A versioned key (`pgm:agg:v3:{db}:t{version}:…`) means invalidation never needs a `DEL`.\n- `[CODE]` The other **~192** `remember()` sites have no lock. On a cold key (deploy, eviction, Redis restart) every concurrent request runs the query. That's fine for cheap lookups and risky for heavy report aggregations.\n- `[CODE]` 9 `rememberForever` keys (`setUpRun`, module status, admin permissions, settings) rely on explicit `forget` calls. They're also prefix-sensitive (F12).\n- `[CODE]` No `Cache::tags` anywhere. Tags aren't supported on file/database stores anyway.\n\n---\n\n## 4.5 Distributed locks — every site\n\n`[LIB]` `Cache::lock()` on Redis is `SET key owner EX n NX` (`Cache/RedisLock.php:38`), and release is a Lua compare-and-delete on the owner. It's a **single-instance lease, not Redlock**. If it expires mid-work, someone else can get in. With `CACHE_DRIVER=file`, locks are per box (`flock`), so with two web boxes they don't exclude each other at all.\n\n| Site | Key | TTL / wait | Protects | If the lease expires or the lock fails | Verdict |\n|---|---|---|---|---|---|\n| `KPISummary.php:88-89` | `kpi_summary_lock:{db}` | 1800 / 1740 | order + delivery KPI rows of one tenant | Waiter throws `LockTimeoutException` → retry (tries 3). The waiting job **occupies a `summary` worker** for up to 29 min | 🟡 head-of-line blocking |\n| `Guest/StockUpdateController.php:115` | `{domain}_stock_update_{challan}` | 30 / none | duplicate challan | A request over 30 s → the same challan can be applied twice | 🟡 |\n| `Guest/StockUpdateController.php:152-166` | `{domain}_stock_{dept}_{bp}_{batch}_{product}` | 10 / 5 | read-modify-write of `stocks.qty` | **F13**, see below | 🔴 |\n| `VanSettlementService.php:331` | `van_settlement_resolve_{id}` | 30 / none | settle/reject once | Status re-check inside (`fresh()` + `STATUS_PENDING`) but not under a row lock → a run over 30 s can double-apply | 🟡 |\n| `VanLoadOutStockService.php:22` | `van_load_out_confirm_{id}` | 30 / none | confirm once | `confirmed_at` re-check + `StockHistory` challan-exists guard → mostly idempotent | 🟢 |\n| `SequentialJobDispatcher.php:15` | `custom-jobs:one-at-a-time` | 10 / none | one export at a time | F12 split + **F15** | 🟡 |\n| `MessageResendService.php:153` | `sms-resend:{org}:claim` | 30 / 10 | balance check + claim | The real guard is the DB txn + `lockForUpdate()` on rows; the lock just serialises the balance read | 🟢 good |\n| `MatrixAggregator.php:170` | `lock:pgm:agg:…` | 90 / 60 | stampede | Query capped at 60 s < 90 s | 🟢 good |\n| `SmsResendRun.php:59` | `{org}:{run}:lock` (fixed prefix) | 10 / 10 | read-modify-write of run tally | Short critical section, idempotent per batch number | 🟢 good |\n\n(`RetailerConnectionService::lock()` is a DB `lockForUpdate`, not a cache lock, `app/Services/Retail/RetailerConnectionService.php:221-228`.)\n\n### F13 — lock released before commit\n> **Update (T12, 2026-10-29): fixed on `master` `75c787a2c`** (`e39909947`, `428b098ec`). The per-stock Redis lock is gone. Stock rows are now locked with `lockForUpdate` inside `DB::transaction(…, 3)` (`LockOrCreateStock`). The code below is the `d14c0ebb2` snapshot. Keep it as the interview story.\n\n```php\nDB::beginTransaction();                                   // :125\n…\n$stockLock = Cache::lock($stockLockKey, 10); $stockLock->block(5);   // :152-153\ntry {\n    $stock = Stock::firstOrCreate([...]);                 // plain SELECT: snapshot read\n    $stock->update(['qty' => $stock->qty + $qty]);        // read-modify-write in PHP\n} finally { $stockLock->release(); }                      // :166 ← lock gone…\n…\nDB::commit();                                             // :263 ← …long before this\n```\n- `[INFERENCE]` Request A updates the row and releases the lock, but hasn't committed. Request B (different challan, same stock row) takes the lock and reads `qty` **without A's change** (InnoDB consistent read). Its `UPDATE` waits on A's row lock, then writes `old + qtyB`. **A's increment is lost.**\n- `[CODE]` The atomic version is already in the code, commented out: `// $stock->increment('qty', …)` (`:163`). Fix: use `increment()` (or `lockForUpdate()` on the select) and keep the Redis lock only for the challan dedupe.\n- `[GENERAL]` Interview line: \"A distributed lock around a DB write is only as good as its scope. If you release it before the commit, you've protected nothing.\"\n\n### F15 — `lockForUpdate()` on an instance\n- `[CODE]` `$candidate->lockForUpdate();` (`SequentialJobDispatcher.php:31`) goes through `Model::__call` → `newQuery()->lockForUpdate()`, which returns a Builder that is never executed. The `status !== PENDING` check on the next line reads the copy already in memory. Combined with F12 (two lock namespaces), a request and a finishing worker can both dispatch the same pending export. The impact is a duplicate export, which is low.\n- Fix: `SequentialJob::whereKey($candidate->id)->lockForUpdate()->first()` inside the transaction.\n\n---\n\n## 4.6 Rate limiters\n- `[CODE]` Five named limiters (`api`, `auth`, `otp`, `otp-verify`, `bulk`) in `app/Providers/RouteServiceProvider.php:66-150`. Values come from `config/rate_limiting.php` (api 600/min `:34`, auth 8/min per identifier and 25/min per IP `:49-50`, OTP send 2/min and 6/h `:68-69`, bulk 3/min and 20/h `:84-85`), with a master switch (`:16`).\n- `[CODE]` They use the plain `ThrottleRequests` (`app/Http/Kernel.php:136`), so the counters live in the **default cache store** (DB 1). They don't use `ThrottleRequestsWithRedis` (a Lua sliding window). They run **after auth** on purpose, keyed by user (`:53-61`). It caps authenticated abuse; it is not a DDoS shield.\n- `[CODE]` Keys carry their own tenant scope (`scopedKey`, `:253-256`), so they're correct even on the file store. On file they're **per box**, so N web boxes give N× the limit.\n- `[GENERAL]` A Redis restart resets every window, which is harmless. With `noeviction` + OOM, every throttled route throws on `INCR`, so the limiter becomes an outage multiplier (§4.9).\n\n---\n\n## 4.7 The feature-tracking buffer — a \"poor man's stream\"\n\n```mermaid\nflowchart LR\n    MW[FeatureTracking middleware /\\ncontroller] -->|FeatureUsedEvent| L[BufferFeatureUsageListener\\nqueue feature-tracking, tries 1]\n    L -->|RPUSH + LTRIM -5000 + EXPIRE 1800| B[(\"buffer:{tenant}\")]\n    L -->|INCR pending ≥100 → DECRBY 100| T{{\"dispatch flush\"}}\n    S[scheduler] --> T\n    T --> F[FlushFeatureEventsJob\\nunique 300s, timeout 240]\n    F -->|SCAN flushing:* → drain leftovers| P[(\"flushing:{tenant}\")]\n    F -->|SCAN buffer:* → RENAME buffer→flushing| P\n    P -->|LRANGE → insert chunks of 500| M[(Mongo landlord\\nfeature_usage_events)]\n    F -->|DEL flushing| P\n```\n\n- `[CODE]` Listener: `app/Listeners/Analytics/BufferFeatureUsageListener.php:28-54`. It swallows every Redis error (`:47-53`), so analytics never breaks a request.\n- `[CODE]` Flusher: `app/Jobs/Analytics/FlushFeatureEventsJob.php:47-127`. Claiming with `RENAME` is atomic, so the listener's `LTRIM` can never cut into a list that's being drained (`:87-95`). Orphaned `flushing:*` lists are re-drained first (`:49-51`). A partial chunk failure re-inserts on retry: at-least-once, and duplicates are accepted for analytics (`:118-121`).\n- `[GENERAL]` What it reinvents: a Redis **List as a queue** with a claim-by-rename \"ack\". Compare **Redis Streams** (`XADD` + consumer group + `XACK` + `XAUTOCLAIM` for orphans), which gives per-message acks, a pending list and trimming (`MAXLEN ~ 5000`) for free. Kafka would be overkill at this volume. Losses: `LTRIM` drops the oldest events past 5000 per tenant, `EXPIRE 1800` drops everything if no flush runs for 30 min, and a Redis restart drops the buffer. All are fine for usage analytics.\n\n### F14 — the flusher is blind under phpredis\n- `[CODE]` `Redis::scan($cursor, 'MATCH', $match, 'COUNT', 50)` (`FlushFeatureEventsJob.php:68`, and the same call in `PurgeFeatureTrackingLeaderboards.php:38`).\n- `[LIB]` On **predis**, Laravel forwards the variadic args and predis passes raw args through (`vendor/predis/predis/src/Command/KeyScan.php:32-40`), so it works. On **phpredis**, Laravel's wrapper is `scan($cursor, $options = [])` (`vendor/…/Redis/Connections/PhpRedisConnection.php:314-326`): `'MATCH'` lands in `$options` and the pattern is lost. phpredis also treats the string cursor `'0'` as \"already finished\".\n- `[LAB]` Same loop, same throwaway Redis, one buffer key present:\n  ```\n  predis    keys seen: [\"sokrio_database_feature_tracking:buffer:7\"]  iterations: 1\n  phpredis  keys seen: []  iterations: 1\n  ```\n- **Impact if prod is phpredis:** every flush is a silent no-op. Buffers fill to 5000, then expire after 30 min, and `feature_usage_events` stays empty. **Check:** is anything in Mongo `feature_usage_events` from the last day? If yes, prod is predis and F14 is latent. Fix: pick the start cursor by client (`null` on phpredis, `'0'` on predis) and pass options as an array, `Redis::scan($cursor, ['match' => $match, 'count' => 50])`. Each half was `[LAB]`-tested at 120/120 keys. The options array alone isn't enough: phpredis with a `'0'` start still found 0/120. *(Corrected in T9, D21: an earlier version said a `null` start works on both, but predis rejects it with `ERR invalid cursor`. See 09 §9.3 L9.)*\n\n---\n\n## 4.8 Broadcast / Pusher\n- `[CODE]` The broadcaster is Pusher (`config/broadcasting.php:33-41`). The `redis` broadcaster exists in config (`:44-47`) but there's no Socket.IO/Echo server for it, so it's unused. Redis is **not** a pub/sub bus in Sokrio. No `PUBLISH`/`SUBSCRIBE` anywhere.\n- `[CODE]` Queued broadcasts (`ShouldBroadcast`): `ReportNotification`, `UserMessageNotification`, `PasswordChanged`, `VanAlertSummaryChanged`, `OrderApproved`, `PaymentApproved/Rejected`, `WalletCollection`. They go to the `default` queue on Redis. Under the README worker, they're served only when `feature-tracking` is empty.\n- `[CODE]` Inline (`ShouldBroadcastNow`): `ReportProgressUpdated` (F4) and `SmsResendFinished`. The latter is wrapped in a try/catch (`SmsResendRun.php:135-148`).\n\n---\n\n## 4.9 Persistence, memory and eviction — what a restart costs\n`[ASSUMPTION]` No `redis.conf`, `maxmemory` or `appendonly` setting exists anywhere in the monorepo, so the server config is unknown. One clue: the code is hardened against `OOM command not allowed when used memory > maxmemory` (`tests/Unit/Kafka/KafkaProducerTest.php:231`; commit `37840a3b5` \"Harden feature tracking… treat Redis/Predis cache failures as transport noise\"). That error only happens with `maxmemory` set **and** `maxmemory-policy noeviction`, so prod has probably hit its memory ceiling at least once.\n\n| Lost on restart / flush (no AOF) | Impact | Recovery |\n|---|---|---|\n| `queues:*` ready jobs | Summaries, exports, SMS batches, broadcasts gone | Summaries self-heal on the next schedule (idempotent upserts, T1). Exports stay \"processing\" in `sequential_jobs` |\n| `queues:*:delayed` | **Delayed order approvals gone**, orders stay pending | ❌ none. Needs a sweeper: \"pending and `approve_at` < now\" |\n| `queues:*:reserved` | Jobs mid-run are not retried | Same as above |\n| Unique locks | Freed (good, clears the F11 jam) | — |\n| Cache | Stampede on cold keys; Org lookups fall back to DB | Self-heals |\n| Sessions (if Redis) | Web users logged out (Sanctum tokens live in MySQL) | Re-login |\n| Feature buffer | ≤ 30 min of analytics | Accepted |\n| `SmsResendRun` tallies | No \"resend finished\" notification | Message rows are still the truth |\n| `TopicProvisioner` cache | Re-checks broker topics | Self-heals |\n\n- `[GENERAL]` **Eviction policy matters more than size.** With `allkeys-lru`, Redis may evict a *queue list* or a *lock* under pressure: lost jobs, or two holders of one lock. With `volatile-lru`, only keys with a TTL are evicted. Queues and `uniqueFor=0` locks have no TTL, so they're safe, but `rememberForever` keys are also safe and can't be evicted either. With `noeviction` (the likely prod setting), writes fail loudly, and dispatches throw inside requests.\n- **Recommendation:** split into **two instances** (or at least two `maxmemory` budgets): *queue+locks* with `noeviction` + AOF `everysec`, and *cache+sessions+limiters* with `allkeys-lru`, no persistence. On AWS that's two small ElastiCache nodes, or one with Valkey/Redis 7 ACL-separated DBs. Compare in T6.\n\n---\n\n## 4.10 Fix list (priority order)\n1. **F11** Add `uniqueId()` (org + upload + startingRow) and `uniqueFor` to `Stock\\BulkStockImportJob`, or drop `ShouldBeUnique`. Delete the stale `laravel_unique_job:App\\Jobs\\Stock\\BulkStockImportJob` key once. 🔴\n2. **F14** Check A7. Switch both `Redis::scan` calls to a `null` start cursor plus the options-array form. 🔴 if phpredis\n3. **F12** Add a shared fixed-prefix store for cross-context keys (the `SmsResendRun` pattern). Make `Org::updated` forget every namespace. 🟡 (tenant deactivation lags up to ~2.8 h)\n4. **F13** Use `increment()`, or `lockForUpdate()` inside the transaction. 🟡\n5. Delayed approvals: put them on `order-approved` (F10), add a `redis-short` connection, add a \"stale pending approval\" sweeper. 🟡\n6. Redis topology: separate queue and cache budgets, `noeviction` + AOF for queues. 🟡\n7. **F15** and the `rand()` unique id (F3). 🟢\n\n---\n\n## 4.11 Takeaways for interviews\n- \"Redis wears seven hats for us: queue, cache, locks, unique-job locks, rate limits, an analytics buffer and sessions. The most important design decision isn't any one of them. It's that they share one `maxmemory`, and a queue must never be evicted to make room for cache.\"\n- \"`retry_after` is a lease, not a timeout. Ours is 2.5 h so long reports don't double-run, which means a crashed short job also waits 2.5 h. The fix is two connections, not one magic number.\"\n- \"`ShouldBeUnique` without a `uniqueId` is a global mutex for that class, and a dropped dispatch is silent. I found chunk jobs dropping each other's work that way.\"\n- \"Tenant-prefixing the cache in middleware is great for isolation, but workers don't run middleware. Anything that crosses the request/worker boundary needs a fixed namespace. Otherwise locks and invalidations miss.\"\n- \"A lock is only correct if its scope covers the commit. Releasing a Redis lock before `COMMIT` gives you a lost update with extra steps.\"\n- \"For stampedes we use lock + wait + double-checked `remember`, with the query capped below the lock TTL, and versioned keys so invalidation is a counter bump, not a `DEL`.\"\n\n---\n\n### ✅ Quality check\n- [x] Must-checks answered: `redis` cache store → connection `cache`/DB 1 (`config/cache.php:74-77`); session driver default `file`, Redis-aware via `CacheBasedSessionHandler` (`ScopeCacheToTenant.php:62-68`); `ShouldBeUnique` lock store = default cache store (`UniqueLock.php:39-41`); phpredis vs predis: code supports both, config default phpredis, prod unknown (A7), and F14 makes it matter\n- [x] Task-card items covered: queue driver (§4.2), retry_after vs `$timeout=0` (§4.2), ignored properties (§4.2), no Horizon (§4.2), `ScopeCacheToTenant` + `Org::findById` (§4.4), stampede + `MatrixAggregator` (§4.4), all lock sites + expiry (§4.5), rate limiters (§4.6), RPUSH/RENAME buffer (§4.7), broadcast (§4.8), persistence/eviction (§4.9)\n- [x] T3 hooks reused: delayed zset, `retry_after=9000` vs approvals and F10, SMS claim lock\n- [x] New findings F11–F15, three of them reproduced with `[LAB]` (throwaway `redis-server` on a spare port, no app code touched)\n- [x] Mermaid for the key map, job lifecycle, prefix split and feature buffer\n- [x] Every statement tagged; `[INFERENCE]` used where prod behaviour isn't observed\n- [x] No secrets: env var names only, no hosts or IPs\n"}, {"file": "05-laravel-implementation.md", "md": "# 05 · The Laravel Implementation Layer — Building It the Sokrio Way\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26. `master` is now `bf223a126` (2 commits ahead, neither touches a messaging file), so every ref below is still valid on `master`. The local working tree had been switched to `survey-question-image-stg`, so the code was read from `git archive d14c0ebb2`, not from the checkout.\n> Paths are relative to `sokrio-server/`. Tags: `[CODE]` verified in app code · `[LIB]` verified in `vendor/` (Laravel 9.52.22) · `[LAB]` reproduced in a throwaway sandbox · `[GENERAL]` industry knowledge · `[INFERENCE]` follows from code but not observed in prod · `[ASSUMPTION]` best guess plus how to verify.\n> Question bank links: Q8 (idempotent consumer), Q10 (dual write / outbox), Q11 (poison message), Q63 (multi-tenancy), Q64–Q65 (Laravel queues, `retry_after`), Q67 (PHP Kafka consumer), Q68 (`afterCommit`), Q77 (duplicate emails).\n\n## 5.0 What changed our understanding (read this first)\n\nThis section is the practical \"how do I build the next one\" guide. Writing the recipes meant tracing a job from `dispatch()` to `handle()` in a real worker, and that surfaced three new findings and four corrections.\n\n| # | Finding | Severity | Proof |\n|---|---|---|---|\n| **F16** | **Tenant models in a job's constructor are re-loaded from the wrong tenant DB.** `SerializesModels` re-fetches each model by id **before** `handle()` runs, on the `tenant` connection. In a worker, that connection still points at whichever tenant the *previous* job reconnected to. Four live jobs take a tenant `User` this way. They stamp another tenant's user name or code into audit columns, fail with `ModelNotFoundException`, or (in one job) send a failure email to a user in another tenant | 🔴 | §5.3, `[LAB]` |\n| **F17** | **The `tenant_id` added to every job payload is never read in workers.** `EnsureTenantAccess` adds `tenant_id` to every job payload, but registers the `JobProcessing` listener that would use it only inside the HTTP process. It looks like a safety net, but it does nothing in workers. Moving it to a service provider is the root fix for F16 | 🟢 (but it is the F16 fix) | §5.5 |\n| **F18** | Both Kafka handlers cache `Org` **for the life of the process** (up to `max_runtime` = 6 h). The code comments say this \"does not change freshness\", but it does: a deactivated or moved tenant keeps being consumed until the next restart | 🟢 | §5.5 |\n\n| # | Was | Now (code wins) |\n|---|---|---|\n| D13 | MEMORY: \"No `afterCommit` anywhere\" | One site: `app/Services/Notification/ApprovalNotifier.php:67` (`->afterCommit()`, added `91d04f736`, 2026-10-06) |\n| D14 | Handler comments: the in-process Org cache \"does not change freshness\" (`TrackingMessageHandler.php:27-28`, `DepartmentMessageHandler.php:17-19`) | The process cache outlives the 2.8 h Redis TTL (D12) by up to 6 h (F18) |\n| D15 | README: local Docker via `./dev` and `.docker/` (`README.md:63-118`); devops skill: `containerization/docker-compose.yml` | Server Docker files were removed in `557e63d68` (2024-01-02), and `containerization/` doesn't exist. **No compose file in the monorepo provides Kafka** |\n| D16 | Study guide §7.4/§7.5: logs go to `storage/logs/kafka.log` | `kafka_file` uses the `daily` driver (`config/logging.php:60-64`), so the file is `kafka-YYYY-MM-DD.log`, kept 7 days |\n\n- `[CODE]` **A7 hint (affects F14).** The README tells developers to set `REDIS_CLIENT=phpredis` in both setup paths (`README.md:43,85`). If prod was set up from the README, it runs phpredis, and F14 (feature analytics never flushed) is live. Mongo `feature_usage_events` row counts are still the cheapest way to confirm.\n\n---\n\n## 5.1 The extension points — where new code plugs in\n\nEverything Kafka-related is behind six interfaces in `app/Contracts/Kafka/`, bound as singletons in `KafkaServiceProvider` (`app/Providers/KafkaServiceProvider.php:23-35`). A new pipeline needs **no new infrastructure classes**: you add a constant, a handler class and one array entry.\n\n| Piece | File | What you touch for a new topic |\n|---|---|---|\n| Topic + event names | `app/Services/Kafka/TopicRegistry.php:12-31` | Add a key constant, a `TOPICS` mapping and event-type constants |\n| Env suffix | `TopicRegistry.php:51-58` | Nothing. Non-prod gets `.{APP_ENV}` appended (e.g. `….v1.staging`) |\n| Producer | `app/Services/Kafka/KafkaProducer.php:54-68` (`publish`), envelope `:93-102` | Nothing. Call it from your controller or observer |\n| Observer helper | `app/Observers/Concerns/PublishesKafkaMessage.php:11-26` | `use` it. It swallows `\\Throwable` and logs a warning |\n| Handler contract | `app/Contracts/Kafka/KafkaMessageHandlerInterface.php:15,25` | Implement `handleBatch()` (and the deprecated `handle()` as a one-line wrapper) |\n| Command wiring | `app/Console/Commands/Kafka/ConsumeCommand.php:27-30` | Add one `HANDLERS` entry |\n| Group id | `ConsumeCommand.php:97-107` | Nothing. You get `{KAFKA_GROUP}-{topicKey}` automatically |\n| Process | `README.md:187-212` (Supervisor) | One new `[program:…]` block |\n\n```mermaid\nflowchart LR\n  subgraph PS[\"Producer side (HTTP / worker)\"]\n    C[Controller] -->|publish| P[KafkaProducer]\n    O[Observer + PublishesKafkaMessage] -->|publish| P\n    P -->|topic = TopicRegistry::getTopicName| K[(\"Kafka topic<br/>*.events.v1[.env]\")]\n  end\n  subgraph CS[\"Consumer side (Supervisor process)\"]\n    K --> KC[KafkaConsumer pollLoop\\nbatch 200 / 1 s]\n    KC -->|decode → tenant_id,event_type,payload| CC[ConsumeCommand HANDLERS]\n    CC --> H[YourMessageHandler::handleBatch]\n    H -->|per tenant slice| TM[TenantManager reconnect]\n    TM --> DB[(tenant MySQL / Mongo)]\n  end\n```\n\n---\n\n## 5.2 Recipe A — add a new topic + consumer (corrected checklist)\n\nThis is the study guide §8 checklist with corrections from T2–T5 applied. Each step lists what to do and why.\n\n**Step 1 — Register the topic.** `[CODE]`\n```php\n// app/Services/Kafka/TopicRegistry.php\npublic const PRIMARY_ORDERS = 'primary_orders';\nprivate const TOPICS = [ /* … */ self::PRIMARY_ORDERS => 'primary-orders.events.v1' ];\npublic const PRIMARY_ORDER_APPROVED = 'primary-order.approved';\n```\n- `[CODE]` Version the name (`.v1`), following the existing four. A breaking payload change gets a new `.v2` topic, not an in-place change.\n\n**Step 2 — Pre-create the topic; don't rely on auto-create.** `[CODE]` `TopicProvisioner` creates missing topics with P=3, RF=1 (`config/kafka.php:74-75`, `TopicProvisioner.php:52-81`). RF=1 means one broker loss loses the topic (risk #1). Create it with ops-owned values, and set the partition count to at least the number of consumer processes you will ever run.\n\n**Step 3 — Pick the producer site and the key.**\n- `[CODE]` From a **controller**, follow `Tracking/TrackingController.php:62-83`: publish, and if it returns `null`, fall back to a sync write. Return 202, or 503 + `Retry-After` if the fallback fails too.\n- `[CODE]` From an **observer**, follow `DepartmentChangeObserver.php:104-145`: `use PublishesKafkaMessage`, skip in `testing` (`:106-108`), and pass an explicit partition key.\n- **Correction to the guide's \"key = tenant_id unless…\":** both live producers override the key, with `user_id` (tracking) and `department_id` (departments) (D4). Use the **entity id** whenever per-entity order matters. A tenant_id key puts a big tenant on one partition, which becomes a hot partition, and buys ordering you usually don't need.\n- **New (fixes F8):** add `public $afterCommit = true;` to the observer. `[LIB]` Laravel 9 honours it for model observers (`vendor/…/Events/Dispatcher.php:526-548`) and runs it immediately when no transaction is open (`Database/DatabaseTransactionsManager.php:90-97`), so the change is safe everywhere. See §5.4.\n- `[CODE]` **Remember acks=0 (F5).** A non-null return only means the bytes left the socket. If losing an event matters, you need a fallback (tracking) or a resync job (departments has only a manual one, F1). Better: an outbox (T2 §2).\n\n**Step 4 — Know what the consumer receives.** `[CODE]` The envelope has `event_id`, `event_type`, `tenant_id`, `occurred_at`, `payload` (`KafkaProducer.php:93-102`), but `decode()` hands the handler only `tenant_id`, `event_type`, `payload` (`KafkaConsumer.php:360-364`). If your handler must deduplicate, change `decode()` to pass `event_id` through. Otherwise the write must be idempotent on a natural key.\n\n**Step 5 — Write the handler.** Use **`DepartmentMessageHandler` as the template**, not tracking. It writes idempotently (upsert by `department_id`), while tracking appends and is not idempotent.\n```php\nfinal class PrimaryOrderMessageHandler implements KafkaMessageHandlerInterface\n{\n    private array $orgs = [];                       // see F18: bound it, or re-check `active`\n    public function handle(int $t, string $e, array $p): void { $this->handleBatch([['tenant_id'=>$t,'event_type'=>$e,'payload'=>$p]]); }\n    public function handleBatch(array $messages): void\n    {\n        foreach (collect($messages)->groupBy('tenant_id') as $tenantId => $slice) {\n            try { $this->persistForTenant((int) $tenantId, $slice->pluck('payload')->all()); }\n            catch (\\Throwable $e) { Log::channel('kafka')->warning('…unhandled', ['tenant_id'=>$tenantId,'error'=>$e->getMessage()]); report($e); }\n        }\n    }\n    // persistForTenant: resolveOrg (landlord self-heal) → TenantManager::tenant($org)->reconnect()\n    //                   → ONE bulk upsert keyed on a natural id → per-record fallback on failure\n}\n```\nRules the two existing handlers follow, with refs:\n- `[CODE]` Group by tenant, then one reconnect and one bulk write per tenant slice (`DepartmentMessageHandler.php:42-49,76,110-112`).\n- `[CODE]` **Never let an exception escape `handleBatch()`.** If one does, the poll loop crash-loops on the same batch (`:50-59`).\n- `[CODE]` If the landlord lookup fails, purge and reconnect `landlord`, then retry once (`:164-176`).\n- `[CODE]` Degraded path: per-record writes, so one bad document only drops itself (`:130-156`).\n- `[CODE]` Log on the `kafka` channel at `warning` or below. `KafkaLogsNeverAtErrorLevelTest` enforces this, but only for the files listed in its provider (`tests/Unit/Kafka/KafkaLogsNeverAtErrorLevelTest.php:21-28`). **`DepartmentMessageHandler` isn't listed**, so add your handler to that list yourself.\n- `[CODE]` Keep a flush well under `session_timeout` 30 s. Heartbeats are only sent on fetch (F9), so a slow flush gets the consumer evicted and the batch replayed.\n\n**Step 6 — Wire it.** `[CODE]` Add `TopicRegistry::PRIMARY_ORDERS => PrimaryOrderMessageHandler::class` to `ConsumeCommand::HANDLERS` (`:27-30`). The command checks the interface at runtime (`:65-68`), and `ConsumeCommandHandlersTest` checks it in CI (§5.6). **Don't** add the key to `KAFKA_GROUP_LEGACY_TOPICS` (`config/kafka.php:16`); that list exists only so `tracking` keeps its old offsets.\n\n**Step 7 — Run it under Supervisor.** `[CODE]` Copy a block from `README.md:189-212`:\n- `command=php artisan kafka:consume primary_orders`\n- `numprocs=1`. The static `group.instance.id=\"\"` makes a second process fence the first (MEMORY T2).\n- `stopwaitsecs=35`, which is more than the 30 s session timeout.\n- `DD_PROFILING_ENABLED=false`, `DD_TRACE_CLI_ENABLED=false` on this program only.\n- `ext-pcntl` on the box.\n\n**Step 8 — Give it a safety net.** `[CODE]` Departments has no fallback, no DLQ and only a manual resync (F1). For a new stream, ship at least one of these: a *scheduled* resync command, a DLQ topic for the swallowed-failure path, or an outbox.\n\n**Step 9 — Tests.** See §5.6 for the minimum set. Note that the department handler currently has **none** (risk 8).\n\n### What the old checklist got wrong\n| Study guide §8 said | Correction |\n|---|---|\n| \"Partition key = tenant_id unless you have a reason\" | Both live topics use entity ids (D4). Default to the entity id |\n| (silent on transactions) | Add `$afterCommit = true` to the observer (F8) |\n| \"`TopicProvisioner` auto-creates, fine for local\" | Fine locally, but it creates P=3 / RF=1 in **any** env that lacks the topic. Pre-create in staging and prod |\n| `handleBatch()` only, bounded retry | Plus: idempotent write or `event_id` passthrough (Step 4); flush < 30 s (F9); add the handler to the log-level test |\n| \"numprocs=1 today, scaling not exercised\" | Scaling is **blocked**, not just untested: static `\"\"` instance id → `FENCED_INSTANCE_ID` |\n\n---\n\n## 5.3 Recipe B — add a queued job the Sokrio way\n\n### The house idiom (what 119 of 127 jobs do)\n- `[CODE]` 127 classes in `app/Jobs` implement `ShouldQueue`. 119 call `TenantManager::tenant(...)`, and 77 hold an `Org` property. The pattern is: **constructor takes the landlord `Org` plus plain ids and arrays; the first line of `handle()` reconnects.** `Org` is safe to serialize because its connection is fixed to `landlord` (`app/Models/Core/Org.php:29`).\n- `[CODE]` The best template is the newest job, `app/Jobs/Notification/SendApprovalNotificationJob.php:34-68`:\n  - `Org` + arrays in the constructor\n  - reconnect first (`:45`)\n  - every side effect in its own `try` (`:47-67`), so a retry doesn't duplicate the steps that already succeeded (`:22-23`)\n  - dispatched with `->afterCommit()` (`ApprovalNotifier.php:67`)\n- `[CODE]` The delayed-and-idempotent template is `app/Jobs/ApproveOrder.php:37-54`: `Org` + `orderId` + `authUserId`, `onQueue('order-approved')` (`Order.php:243`), and a `pending()` guard that makes a re-run a no-op (`:53`).\n\n```php\nclass RecalculateCreditLimitJob implements ShouldQueue            // skeleton, not app code\n{\n    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n    public int $tries = 3;\n    public int $timeout = 300;                                    // < retry_after 9000, never 0\n    public function __construct(public Org $org, public int $departmentId, public int $actorId) {}\n    public function handle(): void\n    {\n        TenantManager::tenant($this->org)->reconnect();           // first line, always\n        $dept = Department::find($this->departmentId);            // load tenant models AFTER reconnect\n        if (! $dept || $dept->credit_recalculated_at?->isToday()) return;   // idempotency guard\n        // … work …\n    }\n}\n// RecalculateCreditLimitJob::dispatch(app('tenant'), $dept->id, auth()->id())->onQueue('summary')->afterCommit();\n```\n\n### F16 — what goes wrong when you pass a tenant model instead\n\n```mermaid\nsequenceDiagram\n  participant H as HTTP (tenant A)\n  participant R as Redis queues:default\n  participant W as queue:work (one long process)\n  H->>R: dispatch(Job(Org A, User #42 of A)) → payload stores {class: User, id: 42, connection: \"tenant\"}\n  Note over W: previous job ran for tenant B →<br/>config database.connections.tenant.database = B\n  R->>W: pop payload\n  W->>W: unserialize → SerializesModels::restoreModel → SELECT * FROM users WHERE id=42 ON tenant (= B!)\n  W->>W: handle(): TenantManager::tenant(Org A)->reconnect()  ← too late, $this->user is B's #42\n  W-->>W: writes created_by=42 (same id), user_name/actor_name = B's user · or ModelNotFound → job fails\n```\n\n- `[LIB]` A model is stored as `{class, id, connection}` and restored with `(new $class)->setConnection($value->connection)` → `firstOrFail()` (`vendor/…/Queue/SerializesAndRestoresModelIdentifiers.php:104-108`). This happens in `__unserialize` (`Queue/SerializesModels.php:62-88`), which `CallQueuedHandler` calls (`Queue/CallQueuedHandler.php:60,97`) **before** `handle()`.\n- `[CODE]` `TenantManager::reconnect()` changes the shared `tenant` connection config with `Config::set` (`app/Support/Tenant/TenantManager.php:96-99`). That setting survives across jobs in a long-lived worker (`--max-jobs=1000`, `README.md:173`).\n- `[LAB]` Throwaway sandbox using the real Laravel 9.52.22 `SerializesModels` and two SQLite DBs, each with a user #42. The job was dispatched holding *\"Alice (tenant A)\"*; after the connection was re-pointed to B, it restored *\"Bob (tenant B) <b@…>\"*. No app code was touched; the script lived in the session scratchpad.\n- `[CODE]` **Live affected jobs** (all take `User $user` next to an `Org`):\n\n| Job | Dispatched from | What breaks |\n|---|---|---|\n| `BatchTransferJob.php:35` | `Inventory/BatchTransferStockController.php:60` | `user_name`/`user_code` of the wrong person in transfer logs (`:316-318`) |\n| `PreInventoryTransferJob.php:34` | `Inventory/PreInventoryTransferController.php:64` | Same (`:319-321`) |\n| `BulkPrimaryPaymentActions.php:30` | `V3/Order/PrimaryInvoicePaymentController.php:114` | `actor_name` of the wrong person on payment actions (`:48-57`) |\n| `BulkProductBatchImportJob.php:34` | `Inventory/BulkProductBatchUploadController.php:42` | `Mail::to($this->user)` (`:142`) emails the skipped/failed lot list **to a user in another tenant** |\n\n  - If the id doesn't exist in the other tenant, the job fails with `ModelNotFoundException` and the whole bulk operation is silently lost.\n  - `created_by = $this->user->id` stays correct, because the id is the same. `[INFERENCE]` That is probably why nobody has noticed.\n- `[CODE]` **Latent (no live dispatch):**\n  - `GenerateSurveyReport.php:32` would be the worst case. `User::getOrg()` is *static* and asks the **current** tenant DB for its owner (`app/Models/Acl/User.php:248-253`), so it would reconnect to the wrong tenant and email tenant B's survey data to tenant A's recipient (`:41-45`).\n  - `SendAnnouncementNotify.php:24`: its dispatch is commented out at `AnnouncementController.php:136`.\n- `[CODE]` **Why tests don't catch it:** in tests, landlord and tenant are separate `:memory:` SQLite DBs with a single tenant (`tests/TestCase.php:41-49`). `reconnect()` is a no-op in `testing` (`TenantManager.php:94`), and the queue is `sync` (`phpunit.xml:37`). `SyncQueue` does round-trip the payload (`vendor/…/Queue/SyncQueue.php:38`), but always within the same tenant.\n- **Fixes**, smallest first:\n  1. Pass `int $userId` and load the user after reconnect.\n  2. Root fix: register a `JobProcessing` listener in a service provider that reconnects from `payload()['tenant_id']`. `[LIB]` The worker raises `JobProcessing` (`Queue/Worker.php:412`) before it fires and unserializes the job (`:425`, `CallQueuedHandler.php:60`), so models would be restored on the right tenant. Also move the `createPayloadUsing` stamp to the provider, so jobs dispatched *from* workers get it too (F17).\n\n### Rules (T4 + T5)\n| # | Rule | Why / ref |\n|---|---|---|\n| 1 | Constructor: `Org` + ids/arrays. **No tenant models** | F16 |\n| 2 | First line of `handle()`: `TenantManager::tenant($this->org)->reconnect()`. Don't chain on it: it returns `null` in `testing` (`TenantManager.php:92-106`) | `[CODE]` |\n| 3 | Choose the queue explicitly (`onQueue` or `public $queue`). Time-sensitive work never goes on `default` | F10: primary approvals sit on `default` |\n| 4 | `$timeout` < `retry_after` (9000), and never `0` | T4 §4.2, Q65 |\n| 5 | `$tries` + an idempotency guard. Don't rely on `$retry_after`/`$retries` properties: Laravel ignores them | T4, `ApproveOrder.php:26` |\n| 6 | `ShouldBeUnique` ⇒ always `uniqueId()` (no `rand()`) + `uniqueFor` | F11, F3 |\n| 7 | A cache key crossing request ↔ worker uses a fixed-prefix store | F12, `SmsResendRun.php:24-25,197-214` |\n| 8 | A lock must cover the commit; `Redis::scan` with a `null` cursor + options array | F13, F14 |\n| 9 | Dispatch with `->afterCommit()` whenever a transaction might be open | §5.4 |\n| 10 | Don't read `auth()` in a job. Pass the actor id. Worker auth is process-global and never reset; only two jobs log in (`ApproveOrder.php:52`, `PrimaryOrder/ApproveOrder.php:46`) | `[LIB]` no auth reset in `Queue/Worker.php`; `DepartmentBulkUpdateJob` reads `auth()` (latent, dispatch commented at `DepartmentBulkDataUpdateController.php:33`) |\n| 11 | A `failed()` hook that reports and cleans up (export guards, `SequentialJob` status) | `GenerateSurveyReport.php:56-59`, `tests/Unit/Jobs/ReportJobFailedCleanupTest.php` |\n\n---\n\n## 5.4 Where `afterCommit` is missing (and where it isn't needed)\n\n**The mechanics.** `[LIB]` Laravel 9.52.22 offers three switches:\n- per dispatch, `->afterCommit()` or a public `$afterCommit` property (`Queue/Queue.php:326-337`)\n- per observer or listener, `public $afterCommit = true` (`Events/Dispatcher.php:526-548`)\n- per connection, `'after_commit' => true`\n\n`[CODE]` `config/queue.php:30-72` sets the per-connection switch nowhere. The callback is queued on the innermost open transaction and runs right away when none is open (`Database/DatabaseTransactionsManager.php:90-97`). Manual `DB::beginTransaction()` counts too.\n\n| Site | In a txn? | Risk today | Verdict |\n|---|---|---|---|\n| `DepartmentChangeObserver` publish, during `DepartmentBulkDataUpdateController.php:41-52` | Yes | Rollback → phantom Kafka event already in Mongo (F8) | 🔴 Add `public $afterCommit = true` to the observer |\n| `SequentialJobDispatcher.php:30-56` dispatch inside `DB::transaction` | Yes | `[INFERENCE]` A fast job waits on the InnoDB row lock from the `UPDATE` (`:37-40`) until commit, so it's mostly safe. If the commit fails, the row stays `pending` and is picked again, so the export runs twice | 🟢 `->afterCommit()` |\n| `ImportSecondaryOrderJob.php:99-279`, `approveAfter` at `:260` | Yes | A delay of N minutes, plus `pending()->find()` returning null after a rollback (`ApproveOrder.php:53`) | ✅ safe by design |\n| `OrderRequest.php:205` / `PrimaryOrder/OrderRequest.php:168` `approveAfter` | **No** txn at all (`Order/OrderController.php:44` calls `save()` bare) | Not an `afterCommit` issue. The real smell is that a FormRequest dispatches jobs | ✅ for afterCommit |\n| `PromotionAction.php` `scheduleNotification` | Called after `DB::commit()` (`:35→37`, `:132→134`) | — | ✅ correct manual pattern |\n| `MessageResendService` | Claim txn `:153`, dispatch afterwards `:233-257` | — | ✅ |\n| `ApprovalNotifier.php:67` | Maybe | — | ✅ the only explicit `afterCommit` (D13) |\n\n- `[GENERAL]` `afterCommit` fixes \"published but rolled back\". It does **not** fix \"committed but never published\": a crash between `COMMIT` and the publish still loses the event. Only an outbox table, written in the same transaction and relayed afterwards, closes both gaps (Q10).\n- `[INFERENCE]` Should we flip `'after_commit' => true` on the `redis` connection? It changes timing for all 127 jobs at once. `Bus::fake`/`Queue::fake` ignore it (no `afterCommit` handling in `Support/Testing/Fakes/{Bus,Queue}Fake.php`), so the suite wouldn't notice a regression. Prefer the per-site switches above, plus a review rule.\n\n---\n\n## 5.5 Tenant context in jobs and consumers\n\n```mermaid\nsequenceDiagram\n  participant W as one worker / consumer process\n  Note over W: boot: tenant conn → DB_DATABASE · cache prefix = base · auth = none · app('tenant') unbound\n  W->>W: job 1 (tenant A): reconnect(A) → tenant conn=A, app('tenant')=A, Auth::loginUsingId(7)\n  Note over W: job 1 ends — nothing is reset\n  W->>W: job 2 (tenant B) unserialize: models restored on A (F16) · auth()->id()=7 (A's user)\n  W->>W: job 2 handle: reconnect(B) → conn=B, app('tenant')=B · cache prefix still base (F12)\n```\n\n| Context | Who sets the tenant | Cache prefix | Leftover state | Ref |\n|---|---|---|---|---|\n| HTTP request | `EnsureTenantAccess` (`:24-35`) → `TenantManager` + `ScopeCacheToTenant` | `…:tenant_{id}:` | None (fresh per request) | `[CODE]` |\n| HTTP → payload | `createPayloadUsing(['tenant_id'=>…])` (`EnsureTenantAccess.php:56-58`) | — | — | `[CODE]` |\n| Queue worker | Each job's own `handle()` | Base prefix | Tenant conn, `app('tenant')`, auth, **all persist** across jobs | `TenantManager.php:33-34,96-99` |\n| Worker `JobProcessing` | **Nobody.** The listener is registered only in the HTTP process (`EnsureTenantAccess.php:60-64`), and it reconnects to the captured `$tenant`, not the payload's | — | — | F17 |\n| Kafka consumer | Handler, once per tenant slice per flush | Base prefix | Stays on the last tenant; `Org` cached for the process life | `DepartmentMessageHandler.php:23,76,158-183` |\n| Scheduler fan-out | `BaseCommand` loops active orgs → `dispatchJob` per tenant | Base prefix | — | `BaseCommand.php:12,50-70` (T1) |\n\n- `[CODE]` **F17.** The only listener that reads the payload's `tenant_id` is the closure registered inside `EnsureTenantAccess`. `queue:work` never runs HTTP middleware, so in workers the stamp is dead data. Even in HTTP (sync queue) the closure reconnects to the request's own `$tenant`, ignoring the payload's id (`:60-64`). Jobs dispatched *from* a worker or the scheduler don't get the stamp at all.\n- `[CODE]` **F18.** `private array $orgs` caches positive lookups for the life of the consumer (`TrackingMessageHandler.php:33,162`, `DepartmentMessageHandler.php:23,160-180`). The life is `KAFKA_CONSUMER_MAX_RUNTIME` = 21600 s (`config/kafka.php:70`). Unlike HTTP, the handlers never check `$org->active` (compare `EnsureTenantAccess.php:26`). A deactivated tenant's events keep being written until the next recycle, even though the Redis copy expires after ~2.8 h (D12). Fix: a TTL on the in-process cache, or `active` checks on the cached entry.\n- `[GENERAL]` **The rule:** a long-lived PHP process is closer to Octane than to FPM. Anything a job sets globally (DB config, container bindings, `Auth`, cache prefix, `Carbon::setTestNow`, locale) leaks into the next job unless something resets it.\n\n---\n\n## 5.6 Testing patterns — the 13 Kafka-related test files\n\n| File | Lines | Technique |\n|---|---|---|\n| `tests/Unit/Kafka/KafkaProducerTest.php` | 313 | Mockery `Producer`; subclass `KafkaProducer` to inject it (`:61`); fake provisioner (`:32-43`); `ExceptionHandler` mock for `report()` (`:79-82`) |\n| `tests/Unit/Kafka/KafkaConsumerBatchTest.php` | 160 | Anonymous `ConsumerFactoryInterface` returning a Mockery `Consumer` (`:144-160`); scripted `consume()` queue + `ShutdownFlag::request()` to end the loop (`:49-93`); `OffsetManager` mock to assert commits |\n| `tests/Unit/Kafka/KafkaConsumerReconnectTest.php` | 290 | Same factory trick with a list of behaviours per connect (`:60-90`); asserts reconnect, exit after N failures, signal-stop |\n| `tests/Feature/Console/Kafka/ConsumeCommandTest.php` | 172 | Recorder `MessageConsumerInterface` bound with `$this->app->instance` (`:128,162`) to assert group ids per topic |\n| `tests/Feature/Kafka/TrackingMessageHandlerTest.php` | 194 | Real SQLite + Mongo; call `handleBatch()` with envelope triples (`:35-42`); count inserts with `DB::listen` (`:88-97`); `DB::shouldReceive('transaction')->times(3)->andThrow` (`:115-117`); `Cache::shouldReceive('remember')` to fake a landlord packet error (`:144-152`) |\n| `tests/Unit/Kafka/TopicProvisionerRedisFailureTest.php` | 93 | Data provider of Predis and phpredis exceptions (`:39`) |\n| `tests/Unit/Kafka/InterruptResilientStreamSocketTest.php` | 177 | Reflection into the socket; signal during `select` (`:88-116`) |\n| `tests/Unit/Kafka/TopicRegistryTest.php` | 35 | `$this->app['env'] = 'production'` to test the suffix (`:20`) |\n| `tests/Unit/Kafka/KafkaLogsNeverAtErrorLevelTest.php` | 44 | Source regex over a hard-coded path list (`:21-41`) |\n| `tests/Unit/Console/Kafka/ConsumeCommandHandlersTest.php` | 25 | Reflection on `HANDLERS` → every class implements the interface (`:14-23`) |\n| `tests/Unit/Observers/Concerns/PublishesKafkaMessageTest.php` | 57 | Anonymous producer that throws `\\TypeError` (proves `catch (\\Throwable)`), log-channel spy (`:14-55`) |\n| `tests/Feature/Tracking/TrackingTest.php` / `BulkTrackingTest.php` | 126 / 170 | Bind a `MessageProducerInterface` mock (`TrackingTest.php:57-59`, `BulkTrackingTest.php:29-30`); `alias:` mocks of Eloquent statics in `@runInSeparateProcess` tests (`BulkTrackingTest.php:82-94,104-116`) |\n\n- `[CODE]` **Log assertions** follow one idiom: `Log::shouldReceive('channel')->with('kafka')->andReturn($spy)`, then `$spy->shouldHaveReceived('warning')->once()->with(...)`, plus `Log::shouldNotHaveReceived('error')` (`TrackingMessageHandlerTest.php:46-55`).\n- `[CODE]` **Queue tests elsewhere:**\n  - `Queue::fake` in 7 files\n  - `Bus::fake` in 11 files\n  - call `->handle()` on a hand-built job (`tests/Unit/Jobs/Stock/BulkStockImportJobLeadingZeroTest.php:36`)\n  - `Bus::fake([Job::class])`, then inspect the dispatched job's public props (`tests/Unit/Services/Notification/ApprovalNotifierTest.php:23,57-61`)\n- **Minimum for a new handler** (copy `TrackingMessageHandlerTest`): unknown tenant → one warning, no error; known tenant → persisted; a batch → one bulk write per tenant; bulk failure → per-record fallback; a re-delivered batch → no duplicate (idempotency); the handler added to `KafkaLogsNeverAtErrorLevelTest`.\n\n### Blind spots (what the suite cannot see)\n1. `[CODE]` **Cross-tenant bugs.** There's one tenant, `reconnect()` is a no-op, and the queue is `sync` (`TestCase.php:41-49,77`, `TenantManager.php:94`, `phpunit.xml:37`). F16 and F12 can't fail a test. A fix needs a test that sets up two tenants and asserts on the restored model.\n2. `[CODE]` **Facade mocks encode client assumptions.** `FlushFeatureEventsJobTest` mocks `Redis::scan('0','MATCH',…,'COUNT',50)` (`tests/Unit/Jobs/FlushFeatureEventsJobTest.php:46-48`), the predis call shape. That's why F14 is green in CI. Integration-test Redis calls against a real server under the prod client.\n3. `[LIB]` **`afterCommit` is invisible to fakes.** The fakes record at call time. Assert `$job->afterCommit === true` on the recorded job instead `[INFERENCE]`.\n4. `[CODE]` **No test exercises `DepartmentMessageHandler`, and the observer publish is skipped in `testing`** (`DepartmentChangeObserver.php:106-108`, risk 8).\n5. `[CODE]` **No Kafka or Redis in CI** (MEMORY Infra), so every broker interaction is mocked.\n\n---\n\n## 5.7 Local development\n\n**What exists.** `[CODE]` Nothing in the monorepo starts Kafka. The server's Docker files were removed (D15). The only compose files belong to the Python benchmark projects, and they start Mongo and Redis only. A messaging change needs MySQL/MariaDB (landlord + tenant DBs), MongoDB, Redis, and Kafka only if you touch Kafka, plus `ext-pcntl` and either phpredis or `predis/predis`.\n\n**Env names** (values `<redacted>`; `.env.example:23-26,48-80,103-106`):\n- Drivers: `QUEUE_CONNECTION`, `CACHE_DRIVER`, `SESSION_DRIVER`, `BROADCAST_DRIVER`\n- Redis: `REDIS_HOST`, `REDIS_PORT`, `REDIS_PASSWORD`, `REDIS_CLIENT` (must be set, or the line removed; empty crashes, T4)\n- Kafka: `KAFKA_BROKERS`, `KAFKA_GROUP`, `KAFKA_GROUP_LEGACY_TOPICS`, `KAFKA_CONSUMER_BATCH_SIZE`, `KAFKA_CONSUMER_BATCH_INTERVAL`, `KAFKA_CONSUMER_MAX_RUNTIME`, `KAFKA_LOG_LEVEL`, `KAFKA_AUTO_CREATE_PARTITIONS`, `KAFKA_AUTO_CREATE_REPLICATION_FACTOR`, plus the `KAFKA_PRODUCER_*` / `KAFKA_CONSUMER_*` timeouts\n- Pusher: `PUSHER_APP_*`\n\n**A minimal sandbox** `[GENERAL]`. This is a proposal, not repo code. Keep it outside `sokrio-server`, e.g. in the T9 lab folder:\n```yaml\nservices:\n  kafka:\n    image: apache/kafka:3.7.0          # KRaft single node, no ZooKeeper\n    ports: [\"9092:9092\"]\n  redis:\n    image: redis:7.2-alpine\n    command: [\"redis-server\", \"--appendonly\", \"yes\", \"--maxmemory-policy\", \"noeviction\"]\n    ports: [\"6380:6379\"]               # spare port; don't collide with other local Redis containers\n```\n\n**Run and watch** `[CODE]` + `[GENERAL]`:\n```bash\nphp artisan kafka:consume departments --max-runtime=0            # ConsumeCommand.php:18-19\nphp artisan queue:work redis --queue=order-approved,summary,sequential,feature-tracking,default --timeout=900\ntail -f storage/logs/kafka-$(date +%F).log                       # daily driver (D16)\nredis-cli -n 0 LLEN \"${REDIS_PREFIX}queues:default\"              # list; also :delayed / :reserved zsets\nkafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group \"${KAFKA_GROUP}-departments\"\n```\n- `[LIB]` Queue keys are `queues:{name}` plus `:delayed`/`:reserved` (`Queue/RedisQueue.php:358-361`), under the client prefix `REDIS_PREFIX` (T4 §4.1).\n\n**Local gotchas:**\n- `[CODE]` The code defaults (`QUEUE_CONNECTION=sync`, `CACHE_DRIVER=file`) hide three bug classes. Jobs run inline in the request's tenant, which hides F16. The file cache has no `setPrefix()`, so `ScopeCacheToTenant` does nothing and F12 can't reproduce. And there's no real `retry_after`. Test messaging work with `QUEUE_CONNECTION=redis` + `CACHE_DRIVER=redis` and **two** tenants.\n- `[CODE]` Local topics are `….v1.local` (`TopicRegistry.php:57`). The provisioner auto-creates them on first publish, and `DepartmentChangeObserver` publishes for real outside `testing`.\n- `[INFERENCE]` If Redis or Kafka is down locally, the producer's retries add ~3.75 s per department save (F8 path), which feels like a slow API rather than an error.\n\n---\n\n## 5.8 Fix list (priority order)\n1. **F16** 🔴. Replace `User $user` with `int $userId` in the 4 live jobs, and load the user after reconnect. Then the root fix: a provider-level `JobProcessing` listener that reconnects from `payload()['tenant_id']`, with the `createPayloadUsing` stamp moved to the same provider (closes F17). Add a two-tenant regression test.\n2. **F8**. Add `public $afterCommit = true;` to `DepartmentChangeObserver` (one line). Plan an outbox for the commit-then-crash gap.\n3. **Review rule for new jobs**: rules 1–11 in §5.3, as a PR checklist item (no tenant models, explicit queue, `$timeout < retry_after`, `uniqueId`, `afterCommit`).\n4. **Testing**: a `DepartmentMessageHandler` test; add it to `KafkaLogsNeverAtErrorLevelTest`; one real-Redis integration test per client for `FlushFeatureEventsJob` (F14).\n5. **F18**: TTL or an `active` check on the handlers' in-process Org cache.\n6. **Docs**: fix the README Docker section (D15) and the log file name (D16); add a sandbox compose for messaging work.\n\n---\n\n## 5.9 Takeaways for interviews\n- \"Our multi-tenant rule for jobs is: serialize the landlord `Org` and ids, never tenant models. `SerializesModels` re-fetches models *before* `handle()` runs, and in a long-lived worker the tenant connection still points at the last job's tenant. I proved it with a two-database repro: same id, different person.\"\n- \"The right place to restore tenant context is `JobProcessing`, registered in a service provider. It fires before the payload is unserialized. We already add `tenant_id` to every payload; we just only listened for it inside the HTTP process.\"\n- \"A queue worker is a long-lived process like Octane. DB config, container bindings and the authenticated user all leak from one job to the next unless you reset them.\"\n- \"`afterCommit` fixes 'published but rolled back'. It doesn't fix 'committed but never published'. That's what an outbox is for. Outside a transaction `afterCommit` runs immediately, so it's safe to add everywhere.\"\n- \"Adding a Kafka pipeline here is three edits: a registry constant, a handler that implements `handleBatch()` and never throws, and one entry in the command's handler map. Most of the effort goes into choosing the partition key, making the write idempotent, and giving the stream a safety net.\"\n- \"Tests can lie by construction. Our Redis facade mock encodes the predis call shape, so a bug that only exists under phpredis stays green. A single-tenant test DB can't catch cross-tenant bugs.\"\n\n---\n\n### ✅ Quality check\n- [x] Task-card items covered:\n  - add topic + consumer, using real classes, corrected checklist (§5.1–5.2)\n  - queued job the Sokrio way (§5.3)\n  - where `afterCommit` is missing (§5.4)\n  - tenant context in jobs and consumers (§5.5)\n  - testing patterns from the Kafka test files (§5.6: 13, not 12; 11 core + 2 tracking feature tests)\n  - local dev: services, env names, running consumers (§5.7)\n- [x] T4 reuse: `uniqueId` (F11), fixed-prefix store (F12), lock covers commit (F13), `scan` form (F14), `$timeout < retry_after`\n- [x] HANDOFF hooks: F8 + both FormRequest `approveAfter` sites assessed (the FormRequest is not in a txn, so not an afterCommit issue)\n- [x] New findings F16 (`[LAB]`), F17, F18 and corrections D13–D16 recorded\n- [x] Mermaid for the extension points, the F16 restore sequence and worker state leakage\n- [x] Code snippets ≤ 15 lines; skeletons are marked \"not app code\"\n- [x] Every statement tagged; `[INFERENCE]` used where prod behaviour isn't observed\n- [x] No secrets: env var names only, no hosts or IPs; the sandbox compose uses public images and local ports only\n"}, {"file": "06-aws-infrastructure.md", "md": "# 06 · AWS Infrastructure — What Runs Where, and What AWS Would Manage\n\n> **Snapshot:** `sokrio-server` @ `master` · HEAD `d14c0ebb2` · written 2026-10-26. `master` is now `bf223a126`, and its 2 new commits touch no file under `.github/`, `config/`, the Kafka code, the jobs or `README.md`, so every ref below still holds. The working tree is on `survey-question-image-stg-new` (switched outside this session). Code was read from `git archive d14c0ebb2`, and vendor code from the installed `vendor/` (Laravel 9.52.22, `longlang/phpkafka` 1.2.5, `aws/aws-sdk-php` 3.394.3).\n> Paths are relative to `sokrio-server/` unless prefixed. Tags: `[CODE]` app code or repo files · `[LIB]` vendor code · `[HIST]` git history (deleted files) · `[NOTES]` project docs and skills · `[GENERAL]` AWS and industry knowledge · `[INFERENCE]` follows from code, not observed in prod · `[ASSUMPTION]` best guess plus how to verify.\n> **Big caveat:** prod `.env` and the server-side `pipeline.sh` scripts can't be read from here. A3–A5 are still open, so every \"today\" statement about Kafka and Redis hosting is evidence-weighted, not confirmed.\n> Question bank links: Q20–Q23 (Kafka ops, replication), Q38–Q42 (Redis persistence/HA), Q46–Q50 (Kafka vs SQS/Kinesis), Q58 (queue at scale), Q72–Q76 (design on AWS), Q79 (AZ failure).\n\n## 6.0 What changed our understanding (read this first)\n\nThe task card said: \"EC2 VMs deployed by GitHub Actions over SSH. Unknown: MSK vs self-hosted Kafka, ElastiCache vs self-hosted Redis.\" That is still the frame, but checking how Sokrio's code would run on each AWS service turned up five new findings and two corrections.\n\n| # | Finding | Severity | Proof |\n|---|---|---|---|\n| **F19** | **The upload → job handoff uses the local disk.** `BulkStockController` stores the upload on the `local` disk of the box that served the request, and `BulkStockBatchImportJob` reads it from the `local` disk of the box that runs the job. With a separate queue-worker VM that only works if both boxes share storage, or if the web box's own worker picks up the job. Otherwise the job logs a warning and returns: a silent no-op | 🟡 `[INFERENCE]` | §6.6 |\n| **F20** | **The Python benchmark service shares Redis DB 0 with Laravel's queues.** Its `REDIS_URL` points at DB `/0`, the same DB that holds `queues:*`. Its cache therefore shares `maxmemory` and the eviction policy with the queue. A cache-heavy benchmark run can trigger OOM errors on `dispatch()` under `noeviction`, or evict queued jobs under any `*-lru` policy | 🟡 | §6.5 |\n| **F21** | **The Kafka client rules out most MSK auth modes.** `longlang/phpkafka` supports TLS and SASL **PLAIN** only. MSK offers IAM, SCRAM, mTLS or unauthenticated access. IAM (the only option on MSK Serverless) and SCRAM are impossible without a client change. Sokrio configures neither TLS nor SASL today | 🟢 (a constraint) | §6.4 |\n| **F22** | **Moving the `order-approved` queue to SQS breaks it.** Approval delays are validated up to **60 minutes**, but SQS `DelaySeconds` is capped at **900 s** (15 min). Laravel passes the delay straight through, so `sendMessage` throws inside the order request. Laravel's SQS driver also ignores `retry_after` and short-polls | 🟡 (migration blocker) | §6.8 |\n| **F23** | **Deploy pipeline hygiene.** The deploy workflows use `appleboy/ssh-action@master` (an unpinned third-party action that receives SSH credentials), log in with **password** SSH on prod/PVM/staging, and run `sudo bash pipeline.sh`. PVM deploys to the **same host secret** as prod | 🟡 | §6.1 |\n\n| # | Was | Now (code wins) |\n|---|---|---|\n| D17 | Devops skill: `containerization/docker-compose.prod.yml` is an \"AWS overlay (ECR images, RDS/ElastiCache)\" (`.claude/skills/sokrio-devops/SKILL.md:42`) | No such file exists anywhere under `~/code` (searched `find -name docker-compose.prod.yml`, and `containerization/` doesn't exist, see D15). There is **no evidence of ECR, RDS or ElastiCache** in any repo |\n| D18 | Inventory §0.10: \"`.docker/php/` only (image bits)\" | `.docker/php/` is an **empty, untracked** folder in the local working tree. Git at `d14c0ebb2` has no `.docker/`; the real Docker files were deleted in `557e63d68` (2024-01-02) |\n\n---\n\n## 6.1 What we actually run — the topology\n\n```mermaid\nflowchart LR\n  GH[GitHub Actions<br/>appleboy/ssh-action@master] -- \"push master<br/>(password SSH)\" --> PROD\n  GH -- \"push pvm/master<br/>(same host secret)\" --> PROD\n  GH -- \"push prod-queue<br/>(key SSH)\" --> QW\n  GH -- \"push prod-report<br/>(key SSH)\" --> REP\n  GH -- \"push staging<br/>(password SSH)\" --> STG\n  GH2[benchmark-python<br/>deploy.yml] -- \"push main (key SSH)<br/>docker compose build+up\" --> PY\n\n  subgraph AWS[\"AWS account — EC2 (per secret names)\"]\n    PROD[\"Prod 'all task' VM<br/>nginx + php-fpm<br/>scheduler (RUN_SCHEDULER)<br/>/home/sokrio/sokrio-prod + /pvm\"]\n    QW[\"Queue-worker VM<br/>queue:work (queues: ?)\"]\n    REP[\"Report VM<br/>no scheduler\"]\n    STG[\"Staging VM\"]\n    PY[\"Benchmark API<br/>Docker, network 'sokrio'\"]\n    K[(\"Kafka<br/>A4: EC2 or MSK?\")]\n    R[(\"Redis<br/>A5: EC2 or ElastiCache?\")]\n  end\n  S3[(S3 bucket)]\n  DO[(DigitalOcean Spaces)]\n  PROD & QW & REP --> K & R\n  PY --> R\n  PROD --> S3 & DO\n```\n\n| Box | Trigger | Auth | Server-side script | Ref |\n|---|---|---|---|---|\n| Prod (\"all task\" server) | push `master` | **password** (`AWS_VM_HOST`/`_USERNAME`/`_PASSWORD`) | `/home/sokrio/sokrio-prod/post-deploy/pipeline.sh` | `[CODE]` `.github/workflows/ci-cd.yml:5-6,17-23` |\n| PVM tenant app | push `pvm/master` | **same `AWS_VM_HOST` secret as prod** | `/home/sokrio/pvm/post-deploy/pipeline.sh` | `[CODE]` `.github/workflows/pvm-ci-cd.yml:6,19-23` |\n| Queue worker | push `prod-queue` | SSH key (`AWS_QUEUE_VM_*`) | `/home/sokrio/sokrio-queue/post-deploy/pipeline.sh` | `[CODE]` `.github/workflows/queue-worker-deploy.yml:6,20-26` |\n| Report server | push `prod-report` | SSH key (`AWS_REPORT_VM_*`) | `/home/sokrio/sokrio-report/post-deploy/pipeline.sh` | `[CODE]` `.github/workflows/prod-report-deploy.yml:6,20-26` |\n| Staging | push `staging` | **password** (`AWS_DEV_*`) | a pipeline under a personal home dir | `[CODE]` `.github/workflows/stg.yml:6,19-23` |\n| Benchmark API (Python) | push `main` | SSH key (`EC2_*`) | inline: `git pull` → `docker compose build --pull` → `up -d --no-deps` → import check → `.env` drift warning | `[CODE]` `sokrio-benchmark-python/.github/workflows/deploy.yml:15-67` |\n\nWhat this tells us:\n- `[CODE]` **It's EC2 VMs, deployed by SSH.** There's no ECS, EKS, Lambda, Beanstalk, CodeDeploy, ECR, Terraform, S_HOST`: `….cache.amazonaws.com` means ElastiCache. Or run `aws elasticache describe-replication-groups`.\n- On the VMs: `docker ps --format '{{.Names}} {{.Image}}'`, `systemctl status redis* kafka*`.\n- A3 (RF): `kafka-topics.sh --describe --topic <tracking topic>`, or `kafka-log-dirs.sh`.\n\n---\n\n## 6.3 The concern table (README_2 Phase 6)\n\n| Concern | Today (best evidence) | AWS-managed option | Fit for Sokrio |\n|---|---|---|---|\n| **Kafka** | `[ASSUMPTION]` One self-hosted broker; topics P=3 / RF=1, auto-created by `TopicProvisioner`; plaintext; acks=0 (F5) | **MSK provisioned** (2–3 AZ, managed brokers, storage scaling, MSK Connect). MSK Serverless needs IAM auth, so it's ruled out by F21 | Good, if TLS-only or mTLS is acceptable (§6.4). Biggest gain: RF=3 across AZs |\n| **RabbitMQ** | `[CODE]` Not used (T3) | Amazon MQ for RabbitMQ (single-instance or 3-node cluster) | Not needed (T3 verdict). SQS covers the use cases |\n| **Redis** | `[ASSUMPTION]` One self-hosted node; DB0 = queues + Python cache (F20), DB1 = cache; persistence and eviction unknown (A9) | **ElastiCache** (Valkey/Redis OSS; Multi-AZ replica + auto-failover, snapshots) or **MemoryDB** (durable multi-AZ log) | ElastiCache with **cluster mode disabled**. Ideally split into a queue node (`noeviction`) and a cache node (`allkeys-lru`) (§6.5) |\n| **Workers** | `[CODE]`+`[NOTES]` EC2 + Supervisor; `queue:work` and `kafka:consume` programs; `pipeline.sh` per box | ECS on EC2/Fargate, EKS, Lambda | Stay on EC2 + Supervisor for now. ECS's 120 s stop timeout clashes with `$timeout = 0` jobs (§6.7) |\n| **Monitoring** | `[CODE]`+`[NOTES]` Sentry, Datadog APM + profiler, Slack log channels; Kafka logs isolated to files | CloudWatch metrics for MSK/ElastiCache/SQS; Datadog AWS integration | Missing: consumer lag, queue depth/age, failed_jobs, Redis memory/evictions, broker disk (§6.9) |\n| **Alternatives** | — | SQS, SNS, EventBridge (+ Scheduler), Kinesis | Per use case (§6.8): EventBridge Scheduler for delayed approvals, SQS for ERP request/reply, keep Kafka for tracking |\n\n`[CODE]` AWS services actually used today: **S3** via `league/flysystem-aws-s3-v3` (`composer.json:27`; disk `s3`, `config/filesystems.php:58-65`; `cloud` disk default `s3`, `:29`). A second S3-compatible disk, `spaces`, points at **DigitalOcean Spaces** (`:67-75`, `DO_SPACES_*`). The `sqs` queue connection (`config/queue.php:52-59`), `dynamodb` cache store (`config/cache.php:79-86`) and `ses` mail block (`config/services.php:27-30`) are untouched Laravel defaults: no `SQS_*` or `DYNAMODB_*` names in `.env.example`.\n\n---\n\n## 6.4 Kafka: self-hosted vs Amazon MSK\n\n### What AWS manages vs what we still own `[GENERAL]`\n\n| Layer | Self-hosted on EC2 (today, `[ASSUMPTION]`) | MSK provisioned |\n|---|---|---|\n| Broker processes, OS, JVM, patching | **Us** | AWS |\n| Controller quorum (ZooKeeper/KRaft) | **Us** | AWS |\n| Failed broker replacement | **Us** (by hand) | AWS (automatic, same broker id and storage) |\n| AZ spread | **Us** (today: one broker, so one AZ) | AWS places brokers across 2 or 3 AZs. **We** must still set RF=3 / `min.insync.replicas=2` |\n| Storage | **Us** (EBS size, alerts) | AWS (EBS, optional auto-scaling). **We** pick retention |\n| Encryption at rest | **Us** | AWS (KMS, always on) |\n| Topic design, partitions, RF, retention | Us | **Still us** |\n| Producer `acks`, idempotence, consumer commits, lag | Us | **Still us**: F5–F9 don't go away on MSK |\n| Version upgrades | Us | AWS runs them; **we** choose when and test the client |\n| Metrics | Us (JMX exporter or nothing) | CloudWatch per-broker/topic metrics + optional open monitoring (Prometheus) |\n\n### Would Sokrio's code run on MSK as-is?\n\n| Check | Sokrio today | On MSK | Ref |\n|---|---|---|---|\n| Auth | None configured | Must enable an **unauthenticated** listener (plaintext 9092 or TLS 9094), or mTLS (9094 + client cert). **IAM (9098) and SCRAM (9096) can't be used**: the client only implements
